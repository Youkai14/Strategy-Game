<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IRON NATIONS</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#081019;
    color:#e8edf2;
}

button{
    font-family:inherit;
}

/* =========================
   START SCREEN
========================= */

#start{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,#31495c 0,#182531 35%,#080d13 100%);
}

.startBox{
    width:560px;
    max-width:90%;
    padding:45px;
    text-align:center;
    background:linear-gradient(145deg,#17232e,#101820);
    border:1px solid #435564;
    border-radius:16px;
    box-shadow:0 30px 100px #000c;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:6px;
    text-shadow:0 4px 25px #000;
}

.logoLine{
    width:120px;
    height:3px;
    margin:13px auto;
    background:#7694ad;
    box-shadow:0 0 15px #7694ad66;
}

.subtitle{
    color:#94a3b1;
    margin-bottom:30px;
}

.menuBtn{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:1px solid #3d5060;
    border-radius:7px;
    background:#202f3b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.menuBtn:hover{
    background:#304656;
    transform:translateY(-1px);
}

.menuBtn.main{
    background:#3c6686;
    border-color:#6389a5;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,
        #294253 0%,
        #1b2e3c 45%,
        #0c1721 100%);
}

#world{
    width:100%;
    height:100%;
    display:block;
    cursor:grab;
    user-select:none;
}

#world:active{
    cursor:grabbing;
}

.ocean{
    fill:#142633;
}

.graticule{
    fill:none;
    stroke:#496274;
    stroke-width:.35;
    opacity:.25;
}

.land{
    stroke:#5b6c79;
    stroke-width:.7;
    vector-effect:non-scaling-stroke;
    transition:.15s;
    cursor:pointer;
}

.land:hover{
    stroke:#e2e9ee;
    stroke-width:1.6;
}

.playerLand{
    fill:#477da5;
}

.enemyLand{
    fill:#894d50;
}

.conqueredLand{
    fill:#5a87a8;
}

.neutralLand{
    fill:#354650;
}

.selectedLand{
    fill:#b28b45;
}

.countryLabel{
    pointer-events:none;
    fill:#eef3f6;
    font-size:10px;
    font-weight:bold;
    text-anchor:middle;
    paint-order:stroke;
    stroke:#101820;
    stroke-width:3px;
    stroke-linejoin:round;
}

.flagLabel{
    pointer-events:none;
    font-size:18px;
    text-anchor:middle;
    dominant-baseline:middle;
    paint-order:stroke;
    stroke:#111;
    stroke-width:2px;
}

/* =========================
   CITIES
========================= */

.capital{
    fill:#f0d17a;
    stroke:#1a1a1a;
    stroke-width:1;
}

.capitalText{
    pointer-events:none;
    fill:#fff;
    font-size:8px;
    font-weight:bold;
    paint-order:stroke;
    stroke:#111;
    stroke-width:2px;
}

/* =========================
   FRONT
========================= */

.frontGlow{
    stroke:#e05d4f;
    stroke-width:14;
    opacity:.16;
    fill:none;
}

.frontLine{
    stroke:#e7b84e;
    stroke-width:4;
    stroke-dasharray:9 7;
    fill:none;
    filter:drop-shadow(0 0 5px #000);
}

.frontArrow{
    fill:#f0c65a;
    opacity:.9;
}

.armyGroup{
    cursor:pointer;
}

.armyCircle{
    fill:#1b2b37;
    stroke:#d8e3ea;
    stroke-width:2;
}

.armyNumber{
    fill:#fff;
    font-size:9px;
    font-weight:bold;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
}

.armyIcon{
    font-size:19px;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
}

.battleIcon{
    font-size:22px;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:20;

    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;

    background:#101922ed;
    border-bottom:1px solid #3c4e5b;
    box-shadow:0 5px 25px #0009;
}

.gameLogo{
    font-weight:900;
    letter-spacing:2px;
    margin-right:13px;
    white-space:nowrap;
}

.stat{
    background:#1d2a34;
    border:1px solid #354651;
    padding:8px 10px;
    border-radius:6px;
    font-size:12px;
    white-space:nowrap;
}

/* =========================
   LEFT PANEL
========================= */

#left{
    position:absolute;
    z-index:20;
    left:10px;
    top:72px;
    bottom:10px;
    width:220px;

    padding:10px;

    background:#111b24f7;
    border:1px solid #3b4c58;
    border-radius:9px;

    box-shadow:0 10px 35px #0009;
}

.section{
    color:#82919e;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:9px 5px 6px;
}

.sideBtn{
    width:100%;
    padding:10px;
    margin-bottom:5px;

    background:#1d2a34;
    color:#e0e7eb;

    border:1px solid #344550;
    border-radius:6px;

    cursor:pointer;
    text-align:left;
    transition:.15s;
}

.sideBtn:hover{
    background:#2b3e4b;
}

.sideBtn.danger{
    color:#ed9999;
}

/* =========================
   RIGHT COUNTRY PANEL
========================= */

#right{
    display:none;

    position:absolute;
    z-index:20;

    right:10px;
    top:72px;

    width:320px;
    max-height:calc(100vh - 84px);

    overflow:auto;

    padding:15px;

    background:#111b24f8;
    border:1px solid #40515d;
    border-radius:9px;

    box-shadow:0 10px 35px #0009;
}

.header{
    display:flex;
    gap:12px;
    align-items:center;
}

.flag{
    font-size:40px;
}

.name{
    font-size:20px;
    font-weight:bold;
}

.tag{
    color:#81909d;
    font-size:11px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #293740;
    font-size:13px;
}

.action{
    width:100%;
    padding:11px;
    margin-top:8px;
    border:0;
    border-radius:6px;
    background:#385f7d;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.action:hover{
    background:#4b7898;
}

.warBtn{
    background:#713f42;
}

.warBtn:hover{
    background:#914f52;
}

.goodBtn{
    background:#3c6650;
}

/* =========================
   SPEED
========================= */

#speed{
    position:absolute;
    z-index:30;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);

    padding:6px;

    background:#111a22f7;
    border:1px solid #3b4b57;
    border-radius:8px;

    display:flex;
    gap:5px;
}

.speedBtn{
    width:50px;
    padding:8px;

    background:#1d2a34;
    color:white;

    border:1px solid #34444f;
    border-radius:5px;

    cursor:pointer;
}

.speedBtn.active{
    background:#466f8d;
}

/* =========================
   MODAL
========================= */

#overlay{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000c;
}

.modal{
    width:680px;
    max-width:94%;
    max-height:86vh;
    overflow:auto;

    background:#131e27;
    border:1px solid #425361;
    border-radius:11px;

    padding:22px;

    box-shadow:0 30px 100px #000;
}

.close{
    float:right;
    border:0;
    background:#303d48;
    color:white;
    border-radius:5px;
    padding:7px 10px;
    cursor:pointer;
}

/* =========================
   COUNTRY GRID
========================= */

.countryGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
}

.country{
    display:flex;
    align-items:center;
    gap:9px;

    padding:11px;

    background:#1d2a34;
    border:1px solid #354651;
    border-radius:7px;

    cursor:pointer;
    transition:.15s;
}

.country:hover{
    background:#2c3e4a;
    transform:translateY(-1px);
}

.countryFlag{
    font-size:27px;
}

.countryName{
    font-weight:bold;
    font-size:12px;
}

.countryPower{
    color:#81909d;
    font-size:10px;
    margin-top:3px;
}

/* =========================
   ARMY BOX
========================= */

.armyBox{
    padding:13px;
    margin-top:10px;

    background:#1d2a34;
    border:1px solid #34444f;
    border-radius:7px;
}

.armyTitle{
    color:#8997a4;
    font-size:11px;
    text-transform:uppercase;
}

.armyNumber{
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.bar{
    width:100%;
    height:9px;
    margin-top:8px;

    background:#0b1015;
    border-radius:5px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#6188a9;
    transition:.4s;
}

.redFill{
    background:#9b5555;
}

.greenFill{
    background:#5d9973;
}

.frontBox{
    margin-top:12px;
    padding:14px;

    text-align:center;

    background:#111920;
    border:1px solid #33414c;
    border-radius:7px;
}

.bigFront{
    font-size:30px;
}

/* =========================
   TOAST
========================= */

#toast{
    display:none;

    position:fixed;
    z-index:5000;

    left:50%;
    bottom:70px;

    transform:translateX(-50%);

    background:#202c36;
    border:1px solid #475866;

    padding:12px 18px;

    border-radius:7px;

    box-shadow:0 10px 30px #0008;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    #left{
        width:185px;
    }

    #right{
        width:280px;
    }

    .stat{
        display:none;
    }

    .countryGrid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    #left{
        width:155px;
    }

    .gameLogo{
        font-size:12px;
        margin-right:2px;
    }

    #right{
        right:5px;
        width:250px;
    }

    .countryGrid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     START
===================================================== -->

<div id="start">

    <div class="startBox">

        <div class="logo">IRON NATIONS</div>

        <div class="logoLine"></div>

        <div class="subtitle">
            Build your nation. Command your armies. Change history.
        </div>

        <button class="menuBtn main" onclick="newGame()">
            NEW GAME
        </button>

        <button class="menuBtn" onclick="loadGame()">
            CONTINUE
        </button>

        <button class="menuBtn" onclick="settings()">
            SETTINGS
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">

    <div id="map">

        <svg id="world"
             viewBox="0 0 1200 650"
             preserveAspectRatio="xMidYMid meet">

            <rect
                x="0"
                y="0"
                width="1200"
                height="650"
                class="ocean">
            </rect>

            <g id="graticuleLayer"></g>
            <g id="countriesLayer"></g>
            <g id="frontLayer"></g>
            <g id="armyLayer"></g>
            <g id="labelLayer"></g>
            <g id="capitalLayer"></g>

        </svg>

    </div>


    <!-- TOP BAR -->

    <div id="topbar">

        <div class="gameLogo">
            IRON NATIONS
        </div>

        <div class="stat">
            💰 <b id="money">0</b>
        </div>

        <div class="stat">
            👥 <b id="population">0</b>
        </div>

        <div class="stat">
            🪖 <b id="army">0</b>
        </div>

        <div class="stat">
            👨‍✈️ <b id="manpower">0</b>
        </div>

        <div class="stat">
            🏭 <b id="factories">0</b>
        </div>

        <div class="stat">
            📅 <b id="date">January 1936</b>
        </div>

    </div>


    <!-- LEFT -->

    <div id="left">

        <div class="section">Nation</div>

        <button class="sideBtn" onclick="openNations()">
            🌍 Nations
        </button>

        <button class="sideBtn" onclick="openArmy()">
            🪖 Army
        </button>

        <button class="sideBtn" onclick="construction()">
            🏭 Construction
        </button>

        <button class="sideBtn" onclick="research()">
            🔬 Research
        </button>

        <button class="sideBtn" onclick="diplomacy()">
            🤝 Diplomacy
        </button>

        <div class="section">Economy</div>

        <button class="sideBtn" onclick="taxes()">
            💰 Collect Taxes
        </button>

        <div class="section">Game</div>

        <button class="sideBtn" onclick="saveGame()">
            💾 Save
        </button>

        <button class="sideBtn" onclick="loadGame()">
            📂 Load
        </button>

        <button class="sideBtn danger" onclick="mainMenu()">
            ⬅ Main Menu
        </button>

    </div>


    <!-- RIGHT -->

    <div id="right"></div>


    <!-- SPEED -->

    <div id="speed">

        <button class="speedBtn active"
                onclick="setSpeed(0,this)">
            Ⅱ
        </button>

        <button class="speedBtn"
                onclick="setSpeed(1,this)">
            1×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(2,this)">
            2×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(4,this)">
            4×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(8,this)">
            8×
        </button>

    </div>

</div>


<!-- MODAL -->

<div id="overlay">

    <div class="modal">

        <button class="close" onclick="closeModal()">
            ✕
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   COUNTRY DATA
========================================================= */

const countries={

DEU:{name:"Germany",flag:"🇩🇪",army:100000,pop:69000000,manpower:1200000,factories:35,money:2500,income:250,capital:"Berlin",pos:[10,51]},
POL:{name:"Poland",flag:"🇵🇱",army:50000,pop:34000000,manpower:650000,factories:18,money:1500,income:120,capital:"Warsaw",pos:[19,52]},
FRA:{name:"France",flag:"🇫🇷",army:85000,pop:41000000,manpower:800000,factories:30,money:2200,income:210,capital:"Paris",pos:[2,46]},
GBR:{name:"United Kingdom",flag:"🇬🇧",army:90000,pop:48000000,manpower:900000,factories:40,money:3000,income:280,capital:"London",pos:[-2,54]},
ITA:{name:"Italy",flag:"🇮🇹",army:75000,pop:44000000,manpower:850000,factories:25,money:2000,income:180,capital:"Rome",pos:[12,42]},
ESP:{name:"Spain",flag:"🇪🇸",army:45000,pop:25000000,manpower:500000,factories:14,money:1300,income:100,capital:"Madrid",pos:[-4,40]},
RUS:{name:"Russia",flag:"🇷🇺",army:180000,pop:108000000,manpower:2500000,factories:55,money:3500,income:300,capital:"Moscow",pos:[37,56]},
UKR:{name:"Ukraine",flag:"🇺🇦",army:65000,pop:30000000,manpower:700000,factories:20,money:1600,income:130,capital:"Kyiv",pos:[32,49]},
USA:{name:"United States",flag:"🇺🇸",army:140000,pop:128000000,manpower:2500000,factories:80,money:6000,income:500,capital:"Washington",pos:[-97,38]},
CAN:{name:"Canada",flag:"🇨🇦",army:30000,pop:11000000,manpower:250000,factories:12,money:1500,income:110,capital:"Ottawa",pos:[-106,56]},
MEX:{name:"Mexico",flag:"🇲🇽",army:35000,pop:19000000,manpower:400000,factories:10,money:1100,income:90,capital:"Mexico City",pos:[-102,23]},
BRA:{name:"Brazil",flag:"🇧🇷",army:60000,pop:40000000,manpower:800000,factories:18,money:1700,income:140,capital:"Rio",pos:[-52,-10]},
ARG:{name:"Argentina",flag:"🇦🇷",army:40000,pop:13000000,manpower:300000,factories:12,money:1200,income:90,capital:"Buenos Aires",pos:[-64,-35]},
TUR:{name:"Turkey",flag:"🇹🇷",army:70000,pop:35000000,manpower:750000,factories:20,money:1800,income:150,capital:"Ankara",pos:[35,39]},
EGY:{name:"Egypt",flag:"🇪🇬",army:55000,pop:16000000,manpower:400000,factories:12,money:1000,income:80,capital:"Cairo",pos:[30,27]},
SAU:{name:"Saudi Arabia",flag:"🇸🇦",army:30000,pop:7000000,manpower:150000,factories:8,money:2500,income:180,capital:"Riyadh",pos:[45,24]},
IRN:{name:"Iran",flag:"🇮🇷",army:50000,pop:14000000,manpower:350000,factories:14,money:1300,income:100,capital:"Tehran",pos:[53,32]},
IND:{name:"India",flag:"🇮🇳",army:120000,pop:350000000,manpower:4000000,factories:35,money:3000,income:280,capital:"Delhi",pos:[79,22]},
CHN:{name:"China",flag:"🇨🇳",army:220000,pop:500000000,manpower:5000000,factories:45,money:3000,income:260,capital:"Nanjing",pos:[103,35]},
JPN:{name:"Japan",flag:"🇯🇵",army:110000,pop:70000000,manpower:1300000,factories:35,money:2800,income:250,capital:"Tokyo",pos:[138,36]},
KOR:{name:"South Korea",flag:"🇰🇷",army:45000,pop:20000000,manpower:500000,factories:18,money:1800,income:160,capital:"Seoul",pos:[128,36]},
AUS:{name:"Australia",flag:"🇦🇺",army:35000,pop:7000000,manpower:200000,factories:14,money:1800,income:140,capital:"Canberra",pos:[133,-25]},
SWE:{name:"Sweden",flag:"🇸🇪",army:35000,pop:6000000,manpower:180000,factories:14,money:1600,income:130,capital:"Stockholm",pos:[15,62]},
NOR:{name:"Norway",flag:"🇳🇴",army:22000,pop:3000000,manpower:90000,factories:8,money:1300,income:90,capital:"Oslo",pos:[12,65]},
FIN:{name:"Finland",flag:"🇫🇮",army:30000,pop:3500000,manpower:120000,factories:9,money:1300,income:100,capital:"Helsinki",pos:[26,64]},
NLD:{name:"Netherlands",flag:"🇳🇱",army:28000,pop:8500000,manpower:150000,factories:12,money:1500,income:120,capital:"Amsterdam",pos:[5,52]},
BEL:{name:"Belgium",flag:"🇧🇪",army:25000,pop:8500000,manpower:140000,factories:10,money:1300,income:100,capital:"Brussels",pos:[4.5,50.8]},
CZE:{name:"Czechoslovakia",flag:"🇨🇿",army:45000,pop:10000000,manpower:250000,factories:16,money:1400,income:110,capital:"Prague",pos:[15.5,49.8]},
ROU:{name:"Romania",flag:"🇷🇴",army:40000,pop:19000000,manpower:300000,factories:12,money:1200,income:100,capital:"Bucharest",pos:[25,46]},
GRC:{name:"Greece",flag:"🇬🇷",army:28000,pop:7000000,manpower:140000,factories:8,money:1000,income:80,capital:"Athens",pos:[22,39]}

};


/* =========================================================
   GAME STATE
========================================================= */

let player={
    nation:null,
    money:0,
    population:0,
    manpower:0,
    army:0,
    factories:0,
    income:0,
    technology:1,
    research:0,
    stability:80
};

let year=1936;
let month=1;
let speed=0;
let timer=null;

let selected=null;
let conquered={};
let wars=[];

let worldLoaded=false;


/* =========================================================
   SVG
========================================================= */

const svg=d3.select("#world");

const graticuleLayer=d3.select("#graticuleLayer");
const countryLayer=d3.select("#countriesLayer");
const frontLayer=d3.select("#frontLayer");
const armyLayer=d3.select("#armyLayer");
const labelLayer=d3.select("#labelLayer");
const capitalLayer=d3.select("#capitalLayer");

const projection=d3.geoNaturalEarth1();

const path=d3.geoPath()
    .projection(projection);


/* =========================================================
   WORLD MAP
========================================================= */

fetch(
    "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
)
.then(response=>{

    if(!response.ok)
        throw new Error("World map could not be loaded");

    return response.json();

})
.then(world=>{

    /*
       Automatically fit the whole world into the SVG.
       This prevents the old half-black map problem.
    */

    projection.fitExtent(
        [[15,15],[1185,635]],
        world
    );

    drawGraticule();

    countryLayer
        .selectAll("path")
        .data(world.features)
        .enter()
        .append("path")
        .attr("class","land neutralLand")
        .attr("d",path)
        .attr("data-iso",d=>getISO(d))
        .on("click",(event,d)=>{

            const iso=getISO(d);

            if(countries[iso]){
                selectCountry(iso);
            }

        })
        .on("mouseover",function(){

            d3.select(this).raise();

        });

    worldLoaded=true;

    drawCountryLabels();
    drawCapitals();

    updateMap();

            if(iso===player.nation)
                cls="land playerLand";

            if(conquered[iso])
                cls="land conqueredLand";

            if(
                wars.some(
                    w=>w.active&&w.enemy===iso

            ){
                cls="land enemyLand";
            }

            if(selected===iso)
                cls="land selectedLand";

            d3.select(this)
                .attr("class",cls);

        });

}

/* =========================================================
   GAME TIME
========================================================= */

function startTimer(){

    if(timer)
        clearInterval(timer);

    if(speed===0)
        return;

    timer=setInterval(()=>{

        advanceMonth();

    },3500/speed);

}


function advanceMonth(){

    month++;

    if(month>12){

        month=1;
        year++;

    }

    /*
       Economy
    */

    player.money+=player.income;

    /*
       Manpower growth
    */

    player.manpower+=
        Math.floor(player.population*.00008);

    /*
       Research
    */

    player.research+=
        Math.max(1,Math.floor(player.factories*.12));

    if(player.research>100)
        player.research=100;

    /*
       Wars
    */

    wars.forEach(w=>{

        if(w.active)
            battle(w);

    });

    updateUI();
    updateMap();

}


/* =========================================================
   BATTLE
========================================================= */

function battle(war){

    if(player.army<=0)
        return;

    const enemy=countries[war.enemy];

    /*
       Attack power
    */

    const myPower=
        player.army*
        (1+player.technology*.10);

    const enemyPower=
        war.enemyArmy*
        (1+war.enemyTechnology*.05);

    const ratio=
        myPower/
        (myPower+enemyPower);


    /*
       Casualties
    */

    const total=
        Math.floor(
            1600+
            Math.random()*2600
        );

    let myLoss=
        Math.floor(
            total*(1-ratio)*.9
        );

    let enemyLoss=
        Math.floor(
            total*ratio
        );

    myLoss=Math.max(50,myLoss);
    enemyLoss=Math.max(50,enemyLoss);

    player.army=
        Math.max(
            0,
            player.army-myLoss
        );

    war.enemyArmy=
        Math.max(
            0,
            war.enemyArmy-enemyLoss
        );

    war.myLosses+=myLoss;
    war.enemyLosses+=enemyLoss;


    /*
       Front movement
    */

    let movement=
        (ratio-.5)*7;

    movement+=
        (Math.random()-.5)*1.5;

    war.progress+=movement;

    war.progress=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    /*
       Draw troops
    */

    drawWar(war);


    /*
       Victory
    */

    if(war.enemyArmy<=0){

        victory(war);

        return;

    }


    /*
       Defeat
    */

    if(player.army<=0){

        war.active=false;

        removeWar(war);

        showToast(
            "💀 Your army has been destroyed."
        );

    }

}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(iso){

    if(!countries[iso])
        return;

    if(iso===player.nation)
        return;

    if(
        wars.some(
            w=>w.active&&w.enemy===iso
        )
    ){

        showToast(
            "You are already at war."
        );

        return;

    }

    const enemy=countries[iso];

    const war={

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };

    wars.push(war);

    drawWar(war);

    updateMap();

    showToast(
        `⚔️ War against ${enemy.flag} ${enemy.name}`
    );

    showWar(war);

}


/* =========================================================
   POSITION
========================================================= */

function position(iso){

    const c=countries[iso];

    if(!c)
        return [600,330];

    return projection(c.pos);

}


/* =========================================================
   DRAW WAR
========================================================= */

function drawWar(war){

    if(!worldLoaded)
        return;

    const start=
        position(player.nation);

    const end=
        position(war.enemy);

    const progress=
        war.progress/100;


    /*
       Army movement
    */

    const fx=
        start[0]+
        (end[0]-start[0])*
        progress*.88;

    const fy=
        start[1]+
        (end[1]-start[1])*
        progress*.88;


    /*
       Front line
    */

    const dx=end[0]-start[0];
    const dy=end[1]-start[1];

    const length=
        Math.sqrt(dx*dx+dy*dy)||1;

    const px=-dy/length;
    const py=dx/length;

    const frontLength=38;

    const x1=fx+px*frontLength;
    const y1=fy+py*frontLength;

    const x2=fx-px*frontLength;
    const y2=fy-py*frontLength;


    /*
       Remove old war graphics
    */

    frontLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();

    armyLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();


    /*
       Glow
    */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontGlow")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /*
       Front
    */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontLine")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /*
       Army group
    */

    const g=
        armyLayer
        .append("g")
        .attr("data-war",war.id)
        .attr("class","armyGroup")
        .attr(
            "transform",
            `translate(${fx},${fy})`
        )
        .on("click",()=>showWar(war));


    g.append("circle")
        .attr("class","armyCircle")
        .attr("r",20);

    g.append("text")
        .attr("class","armyIcon")
        .attr("y",-5)
        .text("🪖");

    g.append("text")
        .attr("class","armyNumber")
        .attr("y",10)
        .text(format(war.enemyArmy));


    /*
       Battle symbol
    */

    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","battleIcon")
        .attr("x",fx)
        .attr("y",fy-35)
        .text("⚔️");

}

   REDRAW WARS
========================================================= */

function redrawWars(){

    frontLayer.selectAll("*").remove();
    armyLayer.selectAll("*").remove();

    wars.forEach(w=>{

    showToast(
        "💾 Game saved."
    );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const raw=
        localStorage.getItem(
            "ironNationsSave"
        );

    if(!raw){

        newGame();

        return;

    }

    try{

        const data=
            JSON.parse(raw);

        player=data.player;

        year=data.year||1936;
        month=data.month||1;

        conquered=
            data.conquered||{};

        wars=
            data.wars||[];

        selected=
            player.nation;

        document.getElementById("start")
            .style.display="none";

        document.getElementById("game")
            .style.display="block";

        updateUI();
        updateMap();
        redrawWars();
        startTimer();

        showToast(
            "📂 Game loaded."
        );

    }catch(error){

        console.error(error);

        showToast(
            "❌ Save file is corrupted."
        );

    }

}


/* =========================================================
   MAIN MENU
========================================================= */

function mainMenu(){

    saveGame();

    if(timer)
        clearInterval(timer);

    document.getElementById("game")
        .style.display="none";

    document.getElementById("start")
        .style.display="flex";

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    document.getElementById("overlay")
        .style.display="none";

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const t=
        document.getElementById("toast");

    t.textContent=text;

    t.style.display="block";

    clearTimeout(toastTimer);

    toastTimer=
        setTimeout(()=>{

            t.style.display="none";

        },3000);

}


/* =========================================================
   FORMAT
========================================================= */

function format(n){

    n=Math.floor(n||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(1)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("de-DE");

}


/* =========================================================
   MAP ZOOM / PAN
========================================================= */

let zoom=1;
let offsetX=0;
let offsetY=0;

let dragging=false;
let lastX=0;
let lastY=0;


svg.on("wheel",event=>{

    event.preventDefault();

    const oldZoom=zoom;

    zoom+=
        event.deltaY>0
        ?-.1
        :.1;

    zoom=
        Math.max(
            .8,
            Math.min(
                2.8,
                zoom
            )
        );

    /*
       Zoom around mouse cursor
    */

    const rect=
        document
        .getElementById("world")
        .getBoundingClientRect();

    const mouseX=
        event.clientX-
        rect.left;

    const mouseY=
        event.clientY-
        rect.top;

    offsetX-=
        (mouseX-offsetX)*
        (zoom/oldZoom-1);

    offsetY-=
        (mouseY-offsetY)*
        (zoom/oldZoom-1);

    applyTransform();

});


svg.on("mousedown",event=>{

    dragging=true;

    lastX=event.clientX;
    lastY=event.clientY;

});


window.addEventListener("mouseup",()=>{

    dragging=false;

});


window.addEventListener("mousemove",event=>{

    if(!dragging)
        return;

    offsetX+=
        event.clientX-lastX;

    offsetY+=
        event.clientY-lastY;

    lastX=event.clientX;
    lastY=event.clientY;

    applyTransform();

});


function applyTransform(){

    const transform=
        `translate(${offsetX} ${offsetY}) scale(${zoom})`;

    countryLayer
        .attr("transform",transform);

    frontLayer
        .attr("transform",transform);

    armyLayer
        .attr("transform",transform);

    labelLayer
        .attr("transform",transform);

    capitalLayer
        .attr("transform",transform);

}
