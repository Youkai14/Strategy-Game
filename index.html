<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON NATIONS</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#081018;
    color:#eef4f8;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
}

#start{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#172b3b 0%,#081018 65%);
    z-index:1000;
}

.startBox{
    width:460px;
    max-width:90%;
    padding:40px;
    background:rgba(13,24,34,.96);
    border:1px solid #294153;
    border-radius:18px;
    box-shadow:0 30px 100px #000;
    text-align:center;
}

.logo{
    font-size:48px;
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:8px;
}

.subtitle{
    color:#8797a5;
    margin-bottom:30px;
}

.startButton{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#1d91ff;
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.startButton:hover{
    background:#42a5ff;
}

#game{
    display:none;
    width:100vw;
    height:100vh;
}

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:68px;
    z-index:100;
    display:flex;
    align-items:center;
    gap:20px;
    padding:10px 18px;
    background:rgba(7,15,22,.94);
    border-bottom:1px solid #263846;
}

.gameTitle{
    font-weight:900;
    letter-spacing:2px;
    margin-right:20px;
}

.stat{
    display:flex;
    flex-direction:column;
    min-width:85px;
}

.stat small{
    color:#71818e;
    font-size:10px;
}

.stat b{
    font-size:14px;
}

.date{
    margin-left:auto;
    font-weight:bold;
}

.speedBox{
    display:flex;
    gap:4px;
}

.speedBtn{
    border:1px solid #304555;
    background:#101d27;
    color:#b9c7d0;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}

.speedBtn.active{
    background:#1d91ff;
    color:white;
}

.leftbar{
    position:absolute;
    left:15px;
    top:85px;
    z-index:50;
    width:150px;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menuBtn{
    border:1px solid #2b4050;
    background:rgba(11,23,32,.94);
    color:#dbe6ed;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
}

.menuBtn:hover{
    background:#19303f;
}

#mapContainer{
    position:absolute;
    inset:68px 0 0 0;
    overflow:hidden;
    background:
        radial-gradient(circle,#162a36,#091219);
}

#world{
    width:100%;
    height:100%;
    cursor:grab;
}

#world:active{
    cursor:grabbing;
}

.land{
    stroke:#1b2a34;
    stroke-width:.7;
    transition:fill .2s;
}

.neutralLand{
    fill:#34434d;
}

.playerLand{
    fill:#2575c7;
}

.enemyLand{
    fill:#713f49;
}

.conqueredLand{
    fill:#267bcf;
}

.selectedLand{
    fill:#4c9ee8;
    stroke:#ffffff;
    stroke-width:1.5;
}

.occupiedTerritory{
    fill:#247fd1;
    opacity:.9;
    pointer-events:none;
}

.occupationFront{
    stroke:#ffffff;
    stroke-width:1.3;
    stroke-dasharray:4 3;
    opacity:.8;
    pointer-events:none;
}

.frontGlow{
    stroke:#ff5252;
    stroke-width:9;
    opacity:.12;
    pointer-events:none;
}

.frontLine{
    stroke:#ff6262;
    stroke-width:2.5;
    stroke-dasharray:7 4;
    pointer-events:none;
}

.frontDot{
    fill:#ff6868;
}

.armyGroup{
    cursor:pointer;
}

.armyCircle{
    fill:#0c1720;
    stroke:#58aaff;
    stroke-width:2;
}

.armyIcon{
    font-size:15px;
    text-anchor:middle;
}

.armyNumber{
    fill:white;
    font-size:10px;
    font-weight:bold;
    text-anchor:middle;
}

.battleIcon{
    fill:#ff9b9b;
    font-size:10px;
    font-weight:bold;
    text-anchor:middle;
    pointer-events:none;
}

.frontProgress{
    fill:#dcecff;
    font-size:9px;
    font-weight:bold;
    text-anchor:middle;
    pointer-events:none;
}

#right{
    display:none;
    position:absolute;
    right:15px;
    top:85px;
    width:260px;
    z-index:80;
    background:rgba(10,20,29,.95);
    border:1px solid #2b4150;
    border-radius:12px;
    padding:15px;
    box-shadow:0 15px 40px #0008;
}

.header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.flag{
    font-size:34px;
}

.name{
    font-weight:bold;
    font-size:16px;
}

.tag{
    color:#71818e;
    font-size:11px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:8px 0;
    border-bottom:1px solid #20303b;
}

.action{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:0;
    border-radius:7px;
    background:#1d91ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.warBtn{
    background:#a9434e;
}

.armyBox,
.frontBox{
    background:#101e28;
    border:1px solid #263b49;
    border-radius:10px;
    padding:13px;
    margin:10px 0;
}

.armyTitle{
    color:#7e8d99;
    font-size:11px;
}

.armyNumber{
    font-size:20px;
    font-weight:bold;
    margin-top:4px;
}

.bar{
    height:7px;
    background:#26343d;
    border-radius:5px;
    overflow:hidden;
    margin-top:9px;
}

.fill{
    height:100%;
    background:#2998ff;
}

.redFill{
    background:#e04f5f;
}

.bigFront{
    font-size:30px;
    text-align:center;
    margin-bottom:5px;
}

#overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:#0009;
    align-items:center;
    justify-content:center;
}

.modal{
    width:700px;
    max-width:92vw;
    max-height:85vh;
    overflow:auto;
    padding:25px;
    background:#0d1922;
    border:1px solid #304555;
    border-radius:15px;
    box-shadow:0 30px 100px #000;
}

.close{
    float:right;
    border:0;
    background:#182732;
    color:#aaa;
    border-radius:6px;
    padding:5px 9px;
    cursor:pointer;
}

.countryGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.country{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    background:#111f29;
    border:1px solid #263b49;
    border-radius:8px;
    cursor:pointer;
}

.country:hover{
    background:#19303f;
}

.countryFlag{
    font-size:27px;
}

.countryName{
    font-weight:bold;
}

.countryPower{
    color:#8495a2;
    font-size:11px;
    margin-top:3px;
}

#toast{
    display:none;
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:900;
    background:#10202c;
    border:1px solid #345062;
    padding:12px 18px;
    border-radius:9px;
    box-shadow:0 10px 30px #0008;
}

@media(max-width:800px){

    .stat{
        display:none;
    }

    .gameTitle{
        font-size:13px;
    }

    #right{
        width:220px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     START
===================================================== -->

<div id="start">

    <div class="startBox">

        <div class="logo">
            IRON NATIONS
        </div>

        <div class="subtitle">
            Build your nation. Research. Fight. Conquer.
        </div>

        <button
            class="startButton"
            onclick="newGame()">
            🌍 NEW GAME
        </button>

        <button
            class="startButton"
            onclick="loadGame()">
            📂 LOAD GAME
        </button>

        <button
            class="startButton"
            onclick="settings()">
            ⚙️ SETTINGS
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">

    <div class="topbar">

        <div class="gameTitle">
            IRON NATIONS
        </div>

        <div class="stat">
            <small>💰 MONEY</small>
            <b id="money">0</b>
        </div>

        <div class="stat">
            <small>👥 POPULATION</small>
            <b id="population">0</b>
        </div>

        <div class="stat">
            <small>🪖 ARMY</small>
            <b id="army">0</b>
        </div>

        <div class="stat">
            <small>👨 MANPOWER</small>
            <b id="manpower">0</b>
        </div>

        <div class="stat">
            <small>🏭 FACTORIES</small>
            <b id="factories">0</b>
        </div>

        <div
            class="date"
            id="date">
            January 1936
        </div>

        <div class="speedBox">

            <button
                class="speedBtn active"
                onclick="setSpeed(0,this)">
                ⏸
            </button>

            <button
                class="speedBtn"
                onclick="setSpeed(1,this)">
                ▶
            </button>

            <button
                class="speedBtn"
                onclick="setSpeed(2,this)">
                ▶▶
            </button>

            <button
                class="speedBtn"
                onclick="setSpeed(4,this)">
                ▶▶▶
            </button>

        </div>

    </div>


    <div class="leftbar">

        <button
            class="menuBtn"
            onclick="openNations()">
            🌍 Nations
        </button>

        <button
            class="menuBtn"
            onclick="openArmy()">
            🪖 Army
        </button>

        <button
            class="menuBtn"
            onclick="construction()">
            🏭 Construction
        </button>

        <button
            class="menuBtn"
            onclick="research()">
            🔬 Research
        </button>

        <button
            class="menuBtn"
            onclick="diplomacy()">
            🤝 Diplomacy
        </button>

        <button
            class="menuBtn"
            onclick="taxes()">
            💰 Collect Taxes
        </button>

        <button
            class="menuBtn"
            onclick="saveGame()">
            💾 Save
        </button>

        <button
            class="menuBtn"
            onclick="mainMenu()">
            🏠 Main Menu
        </button>

    </div>


    <div id="mapContainer">

        <svg
            id="world"
            viewBox="0 0 1200 650"
            preserveAspectRatio="xMidYMid slice">

            <defs id="occupationDefs"></defs>

            <g id="countriesLayer"></g>

            <g id="occupationLayer"></g>

            <g id="frontLayer"></g>

            <g id="armyLayer"></g>

        </svg>

    </div>


    <div id="right"></div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="overlay">

    <div class="modal">

        <button
            class="close"
            onclick="closeModal()">
            ✕
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   IRON NATIONS
   COMPLETE GAME ENGINE
========================================================= */


/* =========================================================
   COUNTRIES
========================================================= */

const countries = {

UKR:{name:"Ukraine",flag:"🇺🇦",army:65000,pop:30000000,manpower:700000,factories:20,money:1600,income:130,pos:[32,49]},
USA:{name:"United States",flag:"🇺🇸",army:140000,pop:128000000,manpower:2500000,factories:80,money:6000,income:500,pos:[-97,38]},
CAN:{name:"Canada",flag:"🇨🇦",army:30000,pop:11000000,manpower:250000,factories:12,money:1500,income:110,pos:[-106,56]},
MEX:{name:"Mexico",flag:"🇲🇽",army:35000,pop:19000000,manpower:400000,factories:10,money:1100,income:90,pos:[-102,23]},
BRA:{name:"Brazil",flag:"🇧🇷",army:60000,pop:40000000,manpower:800000,factories:18,money:1700,income:140,pos:[-52,-10]},
ARG:{name:"Argentina",flag:"🇦🇷",army:40000,pop:13000000,manpower:300000,factories:12,money:1200,income:90,pos:[-64,-35]},
TUR:{name:"Turkey",flag:"🇹🇷",army:70000,pop:35000000,manpower:750000,factories:20,money:1800,income:150,pos:[35,39]},
EGY:{name:"Egypt",flag:"🇪🇬",army:55000,pop:16000000,manpower:400000,factories:12,money:1000,income:80,pos:[30,27]},
SAU:{name:"Saudi Arabia",flag:"🇸🇦",army:30000,pop:7000000,manpower:150000,factories:8,money:2500,income:180,pos:[45,24]},
IRN:{name:"Iran",flag:"🇮🇷",army:50000,pop:14000000,manpower:350000,factories:14,money:1300,income:100,pos:[53,32]},
IND:{name:"India",flag:"🇮🇳",army:120000,pop:350000000,manpower:4000000,factories:35,money:3000,income:280,pos:[79,22]},
CHN:{name:"China",flag:"🇨🇳",army:220000,pop:500000000,manpower:5000000,factories:45,money:3000,income:260,pos:[103,35]},
JPN:{name:"Japan",flag:"🇯🇵",army:110000,pop:70000000,manpower:1300000,factories:35,money:2800,income:250,pos:[138,36]},
KOR:{name:"South Korea",flag:"🇰🇷",army:45000,pop:20000000,manpower:500000,factories:18,money:1800,income:160,pos:[128,36]},
AUS:{name:"Australia",flag:"🇦🇺",army:35000,pop:7000000,manpower:200000,factories:14,money:1800,income:140,pos:[133,-25]},
SWE:{name:"Sweden",flag:"🇸🇪",army:35000,pop:6000000,manpower:180000,factories:14,money:1600,income:130,pos:[15,62]},
NOR:{name:"Norway",flag:"🇳🇴",army:22000,pop:3000000,manpower:90000,factories:8,money:1300,income:90,pos:[12,65]},
FIN:{name:"Finland",flag:"🇫🇮",army:30000,pop:3500000,manpower:120000,factories:9,money:1300,income:100,pos:[26,64]},
NLD:{name:"Netherlands",flag:"🇳🇱",army:28000,pop:8500000,manpower:150000,factories:12,money:1500,income:120,pos:[5,52]},
BEL:{name:"Belgium",flag:"🇧🇪",army:25000,pop:8500000,manpower:140000,factories:10,money:1300,income:100,pos:[4.5,50.8]},
CZE:{name:"Czechoslovakia",flag:"🇨🇿",army:45000,pop:10000000,manpower:250000,factories:16,money:1400,income:110,pos:[15.5,49.8]},
ROU:{name:"Romania",flag:"🇷🇴",army:40000,pop:19000000,manpower:300000,factories:12,money:1200,income:100,pos:[25,46]},
GRC:{name:"Greece",flag:"🇬🇷",army:28000,pop:7000000,manpower:140000,factories:8,money:1000,income:80,pos:[22,39]}

};


/* =========================================================
   STATE
========================================================= */

let player={
    nation:null,
    money:0,
    population:0,
    manpower:0,
    army:0,
    factories:0,
    income:0,
    technology:1,
    research:0,
    stability:80
};

let year=1936;
let month=1;
let speed=0;
let timer=null;
let selected=null;

let conquered={};
let wars=[];

let mapReady=false;


/* =========================================================
   DOM
========================================================= */

const startScreen=document.getElementById("start");
const gameScreen=document.getElementById("game");
const overlay=document.getElementById("overlay");
const modalContent=document.getElementById("modalContent");
const rightPanel=document.getElementById("right");


/* =========================================================
   MAP
========================================================= */

let svg=null;
let countryLayer=null;
let occupationLayer=null;
let frontLayer=null;
let armyLayer=null;

let projection=null;
let path=null;

let zoom=1;
let offsetX=0;
let offsetY=0;

let dragging=false;
let lastX=0;
let lastY=0;


/* =========================================================
   HELPERS
========================================================= */

function format(n){

    n=Math.floor(Number(n)||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(1)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("de-DE");
}


let toastTimer;

function showToast(text){

    const toast=document.getElementById("toast");

    toast.textContent=text;
    toast.style.display="block";

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        toast.style.display="none";
    },3000);
}


function showStart(){

    startScreen.style.display="flex";
    gameScreen.style.display="none";
    overlay.style.display="none";

}


function showGame(){

    startScreen.style.display="none";
    gameScreen.style.display="block";

}


function openModal(){

    overlay.style.display="flex";

}


function closeModal(){

    overlay.style.display="none";

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    openModal();

    modalContent.innerHTML=`

        <h2>🌍 Choose your nation</h2>

        <p style="color:#84929d">
            Choose a country to start your campaign.
        </p>

        <div class="countryGrid">

            ${Object.entries(countries).map(([iso,c])=>`

                <div class="country"
                     onclick="chooseNation('${iso}')">

                    <div class="countryFlag">
                        ${c.flag}
                    </div>

                    <div>

                        <div class="countryName">
                            ${c.name}
                        </div>

                        <div class="countryPower">
                            🪖 ${format(c.army)}
                            · 🏭 ${c.factories}
                        </div>

                    </div>

                </div>

            `).join("")}

        </div>
    `;

}


/* =========================================================
   CHOOSE NATION
========================================================= */

function chooseNation(iso){

    const c=countries[iso];

    if(!c)
        return;


    player={
        nation:iso,
        money:c.money,
        population:c.pop,
        manpower:c.manpower,
        army:c.army,
        factories:c.factories,
        income:c.income,
        technology:1,
        research:0,
        stability:80
    };


    year=1936;
    month=1;
    speed=0;
    selected=iso;

    conquered={};
    conquered[iso]=true;

    wars=[];


    if(timer)
        clearInterval(timer);

    timer=null;


    closeModal();
    showGame();

    updateUI();
    updateMap();
    redrawWars();

    showToast(
        `${c.flag} ${c.name} selected`
    );

}


/* =========================================================
   TIME
========================================================= */

function setSpeed(value,button){

    speed=value;

    document
        .querySelectorAll(".speedBtn")
        .forEach(b=>b.classList.remove("active"));

    if(button)
        button.classList.add("active");


    if(timer)
        clearInterval(timer);


    timer=null;


    if(speed===0)
        return;


    timer=setInterval(
        advanceMonth,
        4000/speed
    );

}


function advanceMonth(){

    if(!player.nation)
        return;


    month++;

    if(month>12){

        month=1;
        year++;

    }


    player.money +=
        player.income +
        player.factories*5;


    player.manpower +=
        Math.floor(
            player.population*0.00008
        );


    player.research +=
        Math.max(
            1,
            Math.floor(
                player.factories*.12
            )
        );


    if(player.research>100)
        player.research=100;


    /*
       EVERY MONTH:
       battles actually happen.
    */

    wars.forEach(war=>{

        if(war.active)
            battle(war);

    });


    updateUI();

}


/* =========================================================
   BATTLE
========================================================= */

function battle(war){

    if(!war.active)
        return;


    if(player.army<=0){

        war.active=false;
        removeWarGraphics(war);

        showToast("💀 Your army was destroyed.");

        return;

    }


    if(war.enemyArmy<=0){

        war.progress=100;
        victory(war);

        return;

    }


    const myPower=
        player.army*
        (1+player.technology*.10);


    const enemyPower=
        war.enemyArmy*
        (1+war.enemyTechnology*.05);


    const ratio=
        myPower/
        (myPower+enemyPower);


    /*
       Casualties are deliberately
       relatively small so wars last.
    */

    const total=
        Math.floor(
            500+
            Math.random()*700
        );


    let myLoss=
        Math.floor(
            total*
            (1-ratio)*
            .65
        );


    let enemyLoss=
        Math.floor(
            total*
            ratio*
            .65
        );


    myLoss=Math.max(5,myLoss);
    enemyLoss=Math.max(5,enemyLoss);


    player.army=
        Math.max(
            0,
            player.army-myLoss
        );


    war.enemyArmy=
        Math.max(
            0,
            war.enemyArmy-enemyLoss
        );


    war.myLosses+=myLoss;
    war.enemyLosses+=enemyLoss;


    /*
       SLOW FRONT.

       A stronger army advances,
       but only a tiny amount each month.
    */

    let movement=0;


    if(ratio>.5){

        movement=
            .10+
            (ratio-.5)*1.5;

    }
    else if(ratio<.5){

        movement=
            -(
                .04+
                (.5-ratio)*.8
            );

    }


    movement=
        Math.max(
            -.45,
            Math.min(
                .65,
                movement
            )
        );


    war.progress+=movement;


    war.progress=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    war.occupation=
        war.progress;


    /*
       Redraw immediately.
    */

    drawOccupation(war);
    drawWar(war);


    if(war.enemyArmy<=0){

        war.progress=100;
        war.occupation=100;

        victory(war);

        return;

    }

}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(iso){

    if(!countries[iso])
        return;


    if(iso===player.nation){

        showToast(
            "You cannot declare war on yourself."
        );

        return;

    }


    const existing=
        wars.find(
            w=>
            w.active &&
            w.enemy===iso
        );


    if(existing){

        showWar(existing);
        return;

    }


    const enemy=
        countries[iso];


    const war={

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        occupation:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };


    wars.push(war);


    drawWar(war);
    drawOccupation(war);


    showToast(
        `⚔️ War against ${enemy.flag} ${enemy.name}`
    );

}


/* =========================================================
   POSITION
========================================================= */

function getPosition(iso){

    const c=countries[iso];

    if(!c)
        return [600,325];

    return projection(c.pos);

}


/* =========================================================
   DRAW OCCUPATION
========================================================= */

function drawOccupation(war){

    if(!mapReady)
        return;


    if(!occupationLayer)
        return;


    occupationLayer
        .selectAll(
            `[data-occupation="${war.id}"]`
        )
        .remove();


    if(war.progress<=0)
        return;


    const countryPath=
        countryLayer
        .select(
            `path[data-iso="${war.enemy}"]`
        );


    if(countryPath.empty())
        return;


    const node=
        countryPath.node();


    const bbox=
        node.getBBox();


    const start=
        getPosition(player.nation);


    const end=
        getPosition(war.enemy);


    /*
       Which side are we attacking from?
    */

    const fromLeft=
        start[0]<end[0];


    const percentage=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        )/100;


    let x;
    let width;


    if(fromLeft){

        x=bbox.x;

        width=
            bbox.width*
            percentage;

    }
    else{

        width=
            bbox.width*
            percentage;

        x=
            bbox.x+
            bbox.width-
            width;

    }


    /*
       Clip occupation to exact country shape.
    */

    const clipId=
        "clip_"+war.enemy;


    d3.select("#occupationDefs")
        .select("#"+clipId)
        .remove();


    const clip=
        d3.select("#occupationDefs")
        .append("clipPath")
        .attr("id",clipId);


    clip
        .append("path")
        .attr(
            "d",
            countryPath.attr("d")
        );


    /*
       Occupied area.
    */

    occupationLayer
        .append("rect")
        .attr(
            "data-occupation",
            war.id
        )
        .attr(
            "class",
            "occupiedTerritory"
        )
        .attr("x",x)
        .attr("y",bbox.y-3)
        .attr("width",Math.max(0,width))
        .attr("height",bbox.height+6)
        .attr(
            "clip-path",
            `url(#${clipId})`
        );


    /*
       Moving occupation border.
    */

    const frontX=
        fromLeft
        ?
        bbox.x+bbox.width*percentage
        :
        bbox.x+bbox.width*(1-percentage);


    occupationLayer
        .append("line")
        .attr(
            "data-occupation",
            war.id
        )
        .attr(
            "class",
            "occupationFront"
        )
        .attr(
            "x1",
            frontX
        )
        .attr(
            "y1",
            bbox.y
        )
        .attr(
            "x2",
            frontX
        )
        .attr(
            "y2",
            bbox.y+bbox.height
        )
        .attr(
            "clip-path",
            `url(#${clipId})`
        );

}


/* =========================================================
   DRAW FRONT
========================================================= */

function drawWar(war){

    if(!mapReady || !war.active)
        return;


    removeWarGraphics(war);


    const start=
        getPosition(player.nation);


    const end=
        getPosition(war.enemy);


    const p=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        )/100;


    const t=
        .12+
        p*.76;


    const fx=
        start[0]+
        (end[0]-start[0])*t;


    const fy=
        start[1]+
        (end[1]-start[1])*t;


    const dx=end[0]-start[0];
    const dy=end[1]-start[1];


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        )||1;


    const px=-dy/length;
    const py=dx/length;


    const frontLength=55;


    const x1=fx+px*frontLength;
    const y1=fy+py*frontLength;

    const x2=fx-px*frontLength;
    const y2=fy-py*frontLength;


    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontGlow")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontLine")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /*
       Little soldiers/front dots.
    */

    for(let i=0;i<5;i++){

        const q=i/4;

        frontLayer
            .append("circle")
            .attr("data-war",war.id)
            .attr("class","frontDot")
            .attr(
                "cx",
                x1+(x2-x1)*q
            )
            .attr(
                "cy",
                y1+(y2-y1)*q
            )
            .attr("r",3);

    }


    /*
       Army marker.
    */

    const group=
        armyLayer
        .append("g")
        .attr("data-war",war.id)
        .attr("class","armyGroup")
        .attr(
            "transform",
            `translate(${fx},${fy})`
        )
        .on(
            "click",
            ()=>showWar(war)
        );


    group
        .append("circle")
        .attr("class","armyCircle")
        .attr("r",23);


    group
        .append("text")
        .attr("class","armyIcon")
        .attr("y",-5)
        .text("🪖");


    group
        .append("text")
        .attr("class","armyNumber")
        .attr("y",11)
        .text(
            format(player.army)
        );


    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","battleIcon")
        .attr("x",fx)
        .attr("y",fy-36)
        .text(
            "⚔️ "+
            format(war.enemyArmy)
        );


    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","frontProgress")
        .attr("x",fx)
        .attr("y",fy+40)
        .text(
            Math.floor(
                war.progress
            )+"%"
        );

}


/* =========================================================
   REMOVE WAR GRAPHICS
========================================================= */

function removeWarGraphics(war){

    frontLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();


    armyLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )

}


/* =========================================================
   VICTORY
========================================================= */

function victory(war){

    war.active=false;
    war.progress=100;
    war.occupation=100;


    conquered[war.enemy]=true;


    const enemy=
        countries[war.enemy];


    player.factories+=
        Math.max(
            1,
            Math.floor(
                enemy.factories*.2
            )
        );


    player.income+=
        Math.max(
            10,
            Math.floor(
                enemy.income*.4
            )
        );


    /*
       Keep occupied area visible
       after victory.
    */

    drawOccupation(war);

    removeWarGraphics(war);


    updateMap();
    updateUI();


    showToast(
        `🏳️ ${enemy.flag} ${enemy.name} conquered`
    );

}


/* =========================================================
   UPDATE MAP
========================================================= */

function updateMap(){

    if(!countryLayer)
        return;


    countryLayer
        .selectAll("path")
        .each(function(feature){

            const iso=getISO(feature);

            let cls="land neutralLand";


            if(iso===player.nation)
                cls="land playerLand";


            if(conquered[iso])
                cls="land conqueredLand";


            const atWar=
                wars.some(
                    w=>
                    w.active &&
                    w.enemy===iso
                );


            if(atWar)
                cls="land enemyLand";


            if(selected===iso)
                cls="land selectedLand";


            d3.select(this)
                .attr(
                    "class",
                    cls
                );

        });

}


/* =========================================================
   GET ISO
========================================================= */

function getISO(feature){

    if(!feature || !feature.properties)
        return "";


    return (
        feature.properties.ADM0_A3 ||
        feature.properties.ISO_A3 ||
        ""
    );

}


/* =========================================================
   MAP INIT
========================================================= */

function initMap(){

    svg=d3.select("#world");

    countryLayer=
        d3.select("#countriesLayer");

    occupationLayer=
        d3.select("#occupationLayer");

    frontLayer=
        d3.select("#frontLayer");

    armyLayer=
        d3.select("#armyLayer");


    projection=
        d3.geoNaturalEarth1();


    path=
        d3.geoPath()
        .projection(projection);


    setupMapControls();


    fetch(
        "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
    )
    .then(r=>{

        if(!r.ok)
            throw new Error(
                "Map failed"
            );

        return r.json();

    })
    .then(world=>{

        projection.fitExtent(
            [
                [10,10],
                [1190,640]
            ],
            world
        );


        countryLayer
            .selectAll("path")
            .data(world.features)
            .enter()
            .append("path")
            .attr("class","land neutralLand")
            .attr("d",path)
            .attr(
                "data-iso",
                d=>getISO(d)
            )
            .on(
                "click",
                (event,d)=>{

                    const iso=
                        getISO(d);

                    if(countries[iso])
                        selectCountry(iso);

                }
            );


        mapReady=true;


        updateMap();
        redrawWars();


    })
    .catch(error=>{

        console.error(error);

        showToast(
            "⚠️ World map could not load."
        );

    });

}


/* =========================================================
   REDRAW WARS
========================================================= */

function redrawWars(){

    if(!mapReady)
        return;


    frontLayer
        .selectAll("*")
        .remove();


    armyLayer
        .selectAll("*")
        .remove();


    occupationLayer
        .selectAll("*")
        .remove();


    wars.forEach(war=>{

        if(
            war.active &&
            war.enemyArmy>0
        ){

            drawOccupation(war);
            drawWar(war);

        }
        else if(
            !war.active &&
            war.progress>=100
        ){

            drawOccupation(war);

        }

    });

}

        );

        return;

    }


    try{

        const data=
            JSON.parse(save);


        player=data.player;
        year=data.year||1936;
        month=data.month||1;
        conquered=data.conquered||{};

        "August",
        "September",
        "October",
        "November",
        "December"
    ];


    date.textContent=
        `${months[month-1]} ${year}`;

}


/* =========================================================
   MAP CONTROLS
========================================================= */

function setupMapControls(){

    svg.on(
        "wheel",
        function(event){

            event.preventDefault();


            const oldZoom=zoom;


            zoom+=
                event.deltaY>0
                ?
                -.12
                :
                .12;


            zoom=
                Math.max(
                    .75,
                    Math.min(
                        3,
                        zoom
                    )
                );


            const rect=
                document
                .getElementById("world")
                .getBoundingClientRect();


            const mouseX=
                event.clientX-
                rect.left;


            const mouseY=
                event.clientY-
                rect.top;


            offsetX-=
                (mouseX-offsetX)*
                (zoom/oldZoom-1);


            offsetY-=
                (mouseY-offsetY)*
                (zoom/oldZoom-1);


            applyMapTransform();

        }
    );


    svg.on(
        "mousedown",
        function(event){

            dragging=true;

            lastX=event.clientX;
            lastY=event.clientY;

        }
    );


    window.addEventListener(
        "mouseup",
        ()=>{
            dragging=false;
        }
    );


    window.addEventListener(
        "mousemove",
        function(event){

            if(!dragging)
                return;


            offsetX+=
                event.clientX-lastX;


            offsetY+=
                event.clientY-lastY;


            lastX=event.clientX;
            lastY=event.clientY;


            applyMapTransform();

        }
    );

}


function applyMapTransform(){

    const transform=
        `translate(${offsetX} ${offsetY}) scale(${zoom})`;


    countryLayer
        .attr(
            "transform",
            transform
        );


    occupationLayer
        .attr(
            "transform",
            transform
        );


    frontLayer
        .attr(
            "transform",
            transform
        );


    armyLayer
        .attr(
            "transform",
            transform
        );

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        showStart();

        initMap();

    }
);

</script>
