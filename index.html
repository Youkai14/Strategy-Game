*{

/* =========================

========================= */

    border-radius:14px;

.logo{
    font-size:48px;
    font-weight:900;

}

/* =========================
   GAME
========================= */

}

#map{

    z-index:1;
}

/* =========================
   TOP BAR
========================= */

/* =========================

========================= */

/* =========================================================

========================================================= */

let map;

let geoLayer;

let selectedISO=null;

let speed=0;

let year=1936;

let month=1;

let gameRunning=false;

let gameInterval=null;

let countryLayers={};

let conquered={};

let wars=[];

let armies=[];


/* =========================================================
   MAP
========================================================= */

function initMap(){

    map=L.map("map",{

        zoomControl:true,

        attributionControl:true,

        minZoom:2,

        maxZoom:7

    }).setView([30,10],3);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    fetch(
        "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson"
    )
    .then(r=>r.json())
    .then(data=>{

        geoLayer=L.geoJSON(
            data,
            {
                style:countryStyle,

                onEachFeature:(feature,layer)=>{

                    let iso=
                        feature.properties.ISO_A3 ||
                        feature.properties.iso_a3;

                    if(!iso)return;

                    countryLayers[iso]=layer;

                    layer.on("click",()=>{

                        countryClicked(iso);

                    });

                    layer.on("mouseover",()=>{

                        layer.setStyle({
                            weight:1.8
                        });

                    });

                    layer.on("mouseout",()=>{

                        geoLayer.resetStyle(layer);

                    });

                }
            }
        ).addTo(map);

    });

}


/* =========================================================
   COUNTRY COLORS
========================================================= */

function countryStyle(feature){

    let iso=
        feature.properties.ISO_A3 ||
        feature.properties.iso_a3;

    let fill="#39444f";

    if(iso===player.nation){
        fill="#416b92";
    }

    if(conquered[iso]){
        fill="#527fa7";
    }

    if(selectedISO===iso){
        fill="#c59b42";
    }

    for(let war of wars){

        if(war.active && war.enemy===iso){

            fill="#8b4747";

        }

    }

    return {

        fillColor:fill,

        fillOpacity:.72,

        color:"#7b8792",

        weight:.7

    };

}


/* =========================================================
   COUNTRY CLICK
========================================================= */

function countryClicked(iso){

    selectedISO=iso;

    let c=countries[iso];

    if(!c)return;

    showCountry(iso);

    refreshMap();

}


/* =========================================================
   REFRESH MAP
========================================================= */

function refreshMap(){

    if(!geoLayer)return;

    geoLayer.eachLayer(layer=>{

        let iso=
            layer.feature.properties.ISO_A3 ||
            layer.feature.properties.iso_a3;

        layer.setStyle(countryStyle(layer.feature));

    });

}

/* =========================================================
   CHOOSE NATION
========================================================= */

function chooseNation(iso){

    let c=countries[iso];

    player={

        nation:iso,

        money:c.money,

        population:c.population,

        manpower:c.manpower,

        military:c.military,

        factories:c.factories,

        territory:1,

        stability:80,

        research:0,

        technology:1,

        income:c.income

    };

    conquered={};

    wars=[];
    armies=[];

    conquered[iso]=true;

    year=1936;
    month=1;

    document.getElementById("modalOverlay").style.display="none";

    document.getElementById("startScreen").style.display="none";

    document.getElementById("game").style.display="block";

    gameRunning=true;

    updateUI();

    refreshMap();

    startGameLoop();

    showToast(
        `${c.flag} You are now playing as ${c.name}`
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function startGameLoop(){

    if(gameInterval)
        clearInterval(gameInterval);

    gameInterval=setInterval(()=>{

        if(!gameRunning)return;

        if(speed===0)return;

        advanceMonth();

    },3000 / speed);

}


/* =========================================================
   ADVANCE TIME
========================================================= */

function advanceMonth(){

    month++;

    if(month>12){

        month=1;
        year++;

    }


    player.money+=player.income;

    player.manpower+=Math.floor(
        player.population * .0001
    );

    player.research+=1;


    for(let war of wars){

        if(war.active){

            simulateBattle(war);

        }

    }


    updateUI();

    refreshMap();

}


/* =========================================================
   ARMY SYSTEM
========================================================= */

function simulateBattle(war){

    let enemy=countries[war.enemy];

    if(!enemy)return;


    /*
        Your available army
    */

    let myArmy=player.military;

    /*
        Enemy army
    */

    let enemyArmy=war.enemyArmy;


    /*
        Strength calculation
    */

    let myPower=
        myArmy *
        (1 + player.technology * .08);

    let enemyPower=
        enemyArmy *
        (1 + war.enemyTechnology * .05);


    let ratio=myPower/(myPower+enemyPower);


    /*
        Casualties

        Bigger armies don't automatically
        win instantly.
    */

    let totalCasualties=
        Math.floor(
            1500 +
            Math.random()*3000
        );


    let myLosses=
        Math.max(
            100,
            Math.floor(
                totalCasualties*(1-ratio)
            )
        );


    let enemyLosses=
        Math.max(
            100,
            Math.floor(
                totalCasualties*ratio
            )
        );


    player.military=
        Math.max(
            0,
            player.military-myLosses
        );


    war.enemyArmy=
        Math.max(
            0,
            war.enemyArmy-enemyLosses
        );


    war.myLosses+=myLosses;

    war.enemyLosses+=enemyLosses;


    /*
        Front movement
    */

    let movement=
        (ratio-.5)*7;

    movement+=
        (Math.random()-.5)*2;


    war.progress+=movement;

    war.progress=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    updateArmyVisual(war);


    /*
        Victory
    */

    if(war.enemyArmy<=0){

        war.progress=100;

        winWar(war);

        return;

    }


    /*
        Defeat
    */

    if(player.military<=0){

        war.active=false;

        removeArmyVisual(war);

        showToast(
            "Your army has been destroyed!"
        );

        return;

    }

}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(enemyISO){

    if(enemyISO===player.nation)
        return;


    if(wars.some(
        w=>w.active && w.enemy===enemyISO
    )){

        showToast("You are already at war.");

        return;

    }


    let enemy=countries[enemyISO];

    if(!enemy)return;


    let war={

        id:Date.now(),

        enemy:enemyISO,

        active:true,

        progress:0,

        enemyArmy:enemy.military,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0,

        frontLat:0,

        frontLng:0,

        marker:null,

        line:null

    };


    wars.push(war);


    createArmyVisual(war);


    showToast(
        `⚔️ War declared on ${enemy.flag} ${enemy.name}`
    );


    showWar(war);

}


/* =========================================================
   CREATE ARMY VISUAL
========================================================= */

function createArmyVisual(war){

    let myCenter=getCountryCenter(player.nation);

    let enemyCenter=getCountryCenter(war.enemy);


    if(!myCenter || !enemyCenter)
        return;


    war.frontLat=myCenter.lat;

    war.frontLng=myCenter.lng;


    let icon=L.divIcon({

        className:"army-marker",

        html:`

            <div style="
                background:#355f87;
                border:2px solid #b8d5ef;
                border-radius:50%;
                width:38px;
                height:38px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:21px;
                box-shadow:0 0 14px rgba(60,120,190,.7);
            ">
                🪖
            </div>

        `,

        iconSize:[38,38],

        iconAnchor:[19,19]

    });


    war.marker=
        L.marker(
            [myCenter.lat,myCenter.lng],
            {icon:icon}
        ).addTo(map);


    war.line=
        L.polyline(
            [
                [myCenter.lat,myCenter.lng],
                [enemyCenter.lat,enemyCenter.lng]
            ],
            {
                color:"#a95757",
                weight:4,
                opacity:.7,
                dashArray:"8 8"
            }
        ).addTo(map);

}


/* =========================================================
   UPDATE ARMY
========================================================= */

function updateArmyVisual(war){

    if(!war.marker)return;


    let start=
        getCountryCenter(player.nation);

    let end=
        getCountryCenter(war.enemy);


    if(!start || !end)
        return;


    let p=
        Math.max(
            0,
            Math.min(
                1,
                war.progress/100
            )
        );


    /*
        Slowly move army towards enemy
    */

    let lat=
        start.lat+
        (end.lat-start.lat)*p*.85;


    let lng=
        start.lng+
        (end.lng-start.lng)*p*.85;


    war.marker.setLatLng(
        [lat,lng]
    );


    war.frontLat=lat;
    war.frontLng=lng;


    /*
        Move front line with army
    */

    if(war.line){

        war.line.setLatLngs([

            [lat,lng],

            [
                lat+(end.lat-lat)*.22,
                lng+(end.lng-lng)*.22
            ]

        ]);

    }

}


/* =========================================================
   REMOVE ARMY
========================================================= */

function removeArmyVisual(war){

    if(war.marker){

        map.removeLayer(
            war.marker
        );

        war.marker=null;

    }

    if(war.line){

        map.removeLayer(
            war.line
        );

        war.line=null;

    }

}


/* =========================================================
   WIN WAR
========================================================= */

function winWar(war){

    war.active=false;

    conquered[war.enemy]=true;

    player.territory++;

    player.income+=
        Math.floor(
            countries[war.enemy].income*.35
        );


    removeArmyVisual(war);

    refreshMap();

    showToast(
        `🏳️ ${countries[war.enemy].flag} ${countries[war.enemy].name} has surrendered!`
    );


    setTimeout(()=>{

        showWarResult(war);

    },500);

}

/* =========================================================

========================================================= */

function loadGame(){

    let save=
        localStorage.getItem(
            "ironNationsSave"
        );


    if(!save){

        if(
            document.getElementById(
                "game"
            ).style.display==="none"
        ){

            newGame();

        }else{

            showToast(
                "No save found."
            );

        }

        return;

    }


    let data=
        JSON.parse(save);


    player=data.player;

    conquered=data.conquered || {};

    wars=data.wars || [];

    year=data.year;

    month=data.month;


    document.getElementById(
        "startScreen"
    ).style.display="none";


    document.getElementById(
        "game"
    ).style.display="block";


    gameRunning=true;


    /*
        Recreate army visuals
    */

    wars.forEach(w=>{

        if(w.active){

            createArmyVisual(w);

            updateArmyVisual(w);

        }

    });


    updateUI();

    refreshMap();

    startGameLoop();


    showToast(
        "📂 Game loaded."
    );

}

/* =========================================================

function formatNumber(number){

    number=Math.floor(number);


    if(number>=1000000000)
        return (number/1000000000).toFixed(1)+"B";


    if(number>=1000000)
        return (number/1000000).toFixed(1)+"M";


    if(number>=1000)
        return (number/1000).toFixed(1)+"K";


    return number.toLocaleString();

}
