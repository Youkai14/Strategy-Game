<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iron Nations</title>

    <meta name="description"
          content="Iron Nations – ein strategisches Multiplayer-Spiel um Nationen, Territorien und Eroberung.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
            background:
                radial-gradient(circle at center, #334155, #111827 75%);
        }

        /* Top-Leiste */
        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #475569;

            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #f59e0b;
        }

        .resources {
            display: flex;
            gap: 20px;
        }

        .resource {
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 8px;
        }

        /* Seitenmenü */
        .sidebar {
            position: absolute;
            top: 80px;
            left: 15px;

            width: 220px;
            padding: 15px;

            background: rgba(15, 23, 42, 0.94);
            border: 1px solid #475569;
            border-radius: 12px;

            z-index: 5;
        }

        .sidebar h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .button {
            width: 100%;
            padding: 11px;
            margin-bottom: 8px;

            background: #334155;
            color: white;

            border: none;
            border-radius: 7px;

            cursor: pointer;
        }

        .button:hover {
            background: #475569;
        }

        .button.attack {
            background: #b91c1c;
        }

        .button.attack:hover {
            background: #dc2626;
        }

        /* Karte */
        #map {
            position: absolute;
            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .world {
            position: relative;

            width: min(80vw, 1000px);
            height: min(65vh, 600px);

            background: #365314;
            border: 3px solid #64748b;
            border-radius: 30px;

            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Beispiel-Territorien */
        .territory {
            position: absolute;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;

            transition: 0.15s;
        }

        .territory:hover {
            filter: brightness(1.3);
            transform: scale(1.03);
            z-index: 3;
        }

        .north {
            left: 10%;
            top: 12%;
            width: 30%;
            height: 30%;
            background: #2563eb;
        }

        .central {
            left: 38%;
            top: 25%;
            width: 28%;
            height: 35%;
            background: #dc2626;
        }

        .east {
            right: 8%;
            top: 15%;
            width: 25%;
            height: 30%;
            background: #ca8a04;
        }

        .south {
            left: 30%;
            bottom: 8%;
            width: 30%;
            height: 27%;
            background: #15803d;
        }

        .west {
            left: 5%;
            bottom: 12%;
            width: 25%;
            height: 25%;
            background: #7c3aed;
        }

        /* Info-Fenster */
        .info {
            position: absolute;
            right: 20px;
            top: 80px;

            width: 240px;
            padding: 18px;

            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #475569;
            border-radius: 12px;

            display: none;
            z-index: 10;
        }

        .info h2 {
            margin-bottom: 10px;
        }

        .info p {
            margin: 7px 0;
            color: #cbd5e1;
        }

        /* Untere Leiste */
        .bottom {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);

            padding: 12px 20px;

            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #475569;
            border-radius: 10px;

            z-index: 10;
        }

        @media(max-width: 700px) {
            .sidebar {
                width: 170px;
            }

            .resources {
                display: none;
            }

            .info {
                width: 190px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <header class="topbar">
        <div class="logo">
            IRON <span>NATIONS</span>
        </div>

        <div class="resources">
            <div class="resource">⚙ Eisen: <b id="iron">500</b></div>
            <div class="resource">💰 Gold: <b id="gold">250</b></div>
            <div class="resource">👥 Bevölkerung: <b id="population">10.000</b></div>
        </div>
    </header>

    <aside class="sidebar">
        <h2>Kommandomenü</h2>

        <button class="button" onclick="recruit()">
            Soldaten rekrutieren
        </button>

        <button class="button" onclick="build()">
            Fabrik bauen
        </button>

        <button class="button attack" onclick="attack()">
            Angriff
        </button>
    </aside>

    <main id="map">
        <div class="world">

            <div
                class="territory north"
                onclick="selectTerritory('Nordland', 3500)"
            >
                Nordland
            </div>

            <div
                class="territory central"
                onclick="selectTerritory('Zentralien', 5200)"
            >
                Zentralien
            </div>

            <div
                class="territory east"
                onclick="selectTerritory('Ostmark', 4100)"
            >
                Ostmark
            </div>

            <div
                class="territory south"
                onclick="selectTerritory('Südreich', 2900)"
            >
                Südreich
            </div>

            <div
                class="territory west"
                onclick="selectTerritory('Westbund', 1800)"
            >
                Westbund
            </div>

        </div>
    </main>

    <section class="info" id="info">
        <h2 id="territoryName">Territorium</h2>

        <p>
            Bevölkerung:
            <b id="territoryPopulation">0</b>
        </p>

        <p>
            Besitzer:
            <b>Iron Nations</b>
        </p>

        <button class="button attack" onclick="attack()">
            Territorium angreifen
        </button>
    </section>

    <div class="bottom">
        🛡️ Deine Nation: <b>Iron Nations</b>
    </div>

</div>

<script>
    let iron = 500;
    let gold = 250;
    let population = 10000;

    function updateResources() {
        document.getElementById("iron").textContent = iron;
        document.getElementById("gold").textContent = gold;
        document.getElementById("population").textContent =
            population.toLocaleString("de-DE");
    }

    function selectTerritory(name, people) {
        document.getElementById("territoryName").textContent = name;
        document.getElementById("territoryPopulation").textContent =
            people.toLocaleString("de-DE");

        document.getElementById("info").style.display = "block";
    }

    function recruit() {
        if (iron >= 50) {
            iron -= 50;
            population += 500;

            updateResources();
            alert("500 Soldaten wurden rekrutiert.");
        } else {
            alert("Nicht genug Eisen.");
        }
    }

    function build() {
        if (iron >= 100 && gold >= 25) {
            iron -= 100;
            gold -= 25;

            updateResources();
            alert("Eine Fabrik wurde gebaut.");
        } else {
            alert("Nicht genügend Ressourcen.");
        }
    }

    function attack() {
        if (population >= 1000) {
            population -= 1000;
            updateResources();

            alert("Der Angriff wurde gestartet!");
        } else {
            alert("Du brauchst mindestens 1.000 Soldaten.");
        }
    }

    updateResources();
</script>

</body>
</html>
