<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATLAS BLITZ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1510;--border2:#2a4435;
  --text:#e8f0e8;--muted:#6f8577;--green:#5fcc8f;--cyan:#4a90e2;
  --red:#e74c3c;--yellow:#ffd54f;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--text);font-family:'Segoe UI',system-ui,Arial,sans-serif;
  user-select:none}
#game{height:100vh;position:relative}

/* ============ MAP ============ */
#map{width:100%;height:100%;background:#0a1a14}
.leaflet-container{background:#0a1a14;font-family:inherit}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{background:rgba(5,15,10,.8)!important;
  color:#4a5c52!important;font-size:9px!important;font-family:monospace}
.leaflet-control-attribution a{color:#6f8577!important}

/* City markers */
.city-marker{background:transparent!important;border:none!important;box-shadow:none!important}
.city-icon{display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);position:relative;pointer-events:none}
.city-dot{width:6px;height:6px;background:#c8d8c8;border:2px solid #0a1a14;
  border-radius:50%;box-shadow:0 0 5px rgba(200,220,200,.4)}
.city-dot.capital{width:10px;height:10px;background:#ffd54f;
  box-shadow:0 0 10px rgba(255,213,79,.8)}
.city-name{margin-top:3px;font-size:10px;color:rgba(200,220,200,.7);
  font-weight:600;letter-spacing:.5px;white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 6px #000}

/* ============ UNITS ============ */
.unit-marker{background:transparent!important;border:none!important;
  box-shadow:none!important;cursor:pointer;transition:filter .15s}
.unit-wrapper{position:relative;width:56px;height:56px;
  transform:translate(-50%,-50%);pointer-events:auto}

.unit-strength{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  padding:1px 6px;font-size:10px;font-weight:800;
  font-family:'Consolas',monospace;letter-spacing:.5px;border-radius:3px;
  white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.7);z-index:3}

.unit-rect{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:44px;height:26px;border:2px solid currentColor;border-radius:2px;
  background:rgba(10,20,15,.9);z-index:2}
.unit-rect svg{position:absolute;inset:0;width:100%;height:100%}

.unit-level{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;
  text-shadow:0 1px 2px #000;background:rgba(10,20,15,.85);
  padding:0 3px;border-radius:2px;z-index:3}

.unit-marker.player .unit-rect{color:#4a90e2}
.unit-marker.player .unit-strength{background:#4a90e2;color:#fff}
.unit-marker.enemy .unit-rect{color:#e74c3c}
.unit-marker.enemy .unit-strength{background:#e74c3c;color:#fff}

.unit-marker.selected .unit-rect{
  box-shadow:0 0 0 2px #ffd54f,0 0 16px rgba(255,213,79,.9);
  border-color:#ffd54f!important}
.unit-marker.selected .unit-rect svg{color:#ffd54f!important}

.unit-marker.targetable .unit-rect{animation:pulse-red 1s infinite}
@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}
  50%{box-shadow:0 0 0 6px rgba(231,76,60,.5),0 0 12px rgba(231,76,60,.8)}}

.unit-marker.in-battle .unit-rect{animation:shake .25s infinite}
@keyframes shake{
  0%,100%{transform:translateX(-50%) translateY(0)}
  25%{transform:translateX(-50%) translateY(-1px)}
  75%{transform:translateX(-50%) translateY(1px)}}

/* ============ BATTLE FLAGS (nur während Schlacht sichtbar) ============ */
.battle-flag{
  background:transparent!important;border:none!important;
  box-shadow:none!important;pointer-events:none}
.battle-flag-inner{
  transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;
  animation:flagFloat .8s ease-in-out infinite alternate}
@keyframes flagFloat{
  from{transform:translate(-50%,-50%) translateY(0)}
  to{transform:translate(-50%,-50%) translateY(-4px)}}

.battle-flag-img{
  width:34px;height:24px;object-fit:cover;
  border:2px solid #fff;border-radius:3px;
  box-shadow:0 0 14px rgba(0,0,0,.9),0 4px 12px rgba(0,0,0,.8);
  background:#fff}
.battle-flag-img.attacker{
  border-color:#4a90e2;
  box-shadow:0 0 18px rgba(74,144,226,.9),
             0 0 8px rgba(74,144,226,.7),
             0 4px 12px rgba(0,0,0,.8)}
.battle-flag-img.defender{
  border-color:#e74c3c;
  box-shadow:0 0 18px rgba(231,76,60,.9),
             0 0 8px rgba(231,76,60,.7),
             0 4px 12px rgba(0,0,0,.8)}
.battle-flag-troops{
  margin-top:3px;
  padding:1px 6px;
  font-size:10px;font-weight:800;
  font-family:'Consolas',monospace;
  background:rgba(6,14,10,.95);
  border-radius:3px;
  letter-spacing:.5px;
  white-space:nowrap}
.battle-flag-troops.attacker{color:#4a90e2;border:1px solid rgba(74,144,226,.6)}
.battle-flag-troops.defender{color:#e74c3c;border:1px solid rgba(231,76,60,.6)}

/* ============ TOP BAR ============ */
.topbar{position:absolute;top:0;left:0;right:0;height:52px;
  background:linear-gradient(180deg,rgba(6,14,10,.96),rgba(6,14,10,.85));
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;padding:0 20px;z-index:500;
  backdrop-filter:blur(8px)}
.topbar h1{font-size:15px;font-weight:800;letter-spacing:4px;color:#e8f0e8}
.topbar h1 span{color:var(--cyan)}
.topbar .stats{margin-left:auto;display:flex;gap:22px;font-size:12px;
  color:var(--muted);align-items:center}
.topbar .stats .item{display:flex;align-items:center;gap:6px;
  font-variant-numeric:tabular-nums}
.topbar .stats .item b{color:#e8f0e8;font-weight:700;font-size:13px}
.topbar .stats .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.topbar .stats .dot.cyan{background:var(--cyan)}
.topbar .stats .dot.red{background:var(--red)}
.topbar .stats .dot.green{background:var(--green)}

/* ============ ATTACK BAR ============ */
.attack-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(0deg,rgba(6,14,10,.98),rgba(6,14,10,.88));
  border-top:1px solid var(--border2);
  padding:14px 24px;z-index:500;
  display:flex;align-items:center;gap:22px;
  backdrop-filter:blur(10px);
  transform:translateY(0);
  transition:transform .25s cubic-bezier(.34,1.4,.4,1)}
.attack-bar.hidden{transform:translateY(120%)}

.ab-info{flex:0 0 auto;text-align:center;min-width:130px}
.ab-info .label{font-size:9px;letter-spacing:2px;color:var(--muted)}
.ab-info .name{font-size:14px;font-weight:800;margin-top:2px;color:#e8f0e8}
.ab-info .troops{font-size:16px;font-weight:800;
  font-family:'Consolas',monospace;margin-top:2px;
  font-variant-numeric:tabular-nums}
.ab-info.attacker .troops{color:var(--cyan)}
.ab-info.defender .troops{color:var(--red)}

.ab-slider-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
.ab-slider{-webkit-appearance:none;appearance:none;
  width:100%;height:6px;background:#16261e;border-radius:3px;outline:none}
.ab-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;background:var(--cyan);
  cursor:pointer;border:2px solid #0a1a14;
  box-shadow:0 0 12px rgba(74,144,226,.8)}
.ab-slider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--cyan);
  cursor:pointer;border:2px solid #0a1a14}
.ab-slider:disabled{opacity:.4}

.ab-meta{display:flex;justify-content:space-between;
  font-size:11px;color:var(--muted);font-family:'Consolas',monospace}
.ab-meta b{color:#ffd54f}

.ab-btn{flex:0 0 auto;padding:14px 28px;
  background:linear-gradient(180deg,#c73a3a,#8a1a1a);
  border:1px solid #e05a5a;border-radius:6px;
  color:#fff;font-weight:800;font-size:12px;
  letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-family:inherit;transition:.15s;min-width:180px}
.ab-btn:hover:not(:disabled){
  filter:brightness(1.15);transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(199,58,58,.5)}
.ab-btn:disabled{opacity:.4;cursor:not-allowed}

.ab-progress{flex:1;display:flex;flex-direction:column;gap:8px}
.ab-progress-bar{height:18px;background:#050f0a;
  border-radius:9px;overflow:hidden;
  border:1px solid #1a3025;position:relative}
.ab-progress-fill{height:100%;width:0;
  background:linear-gradient(90deg,#4a90e2,#3a70b2);
  transition:width .08s linear;
  box-shadow:0 0 12px rgba(74,144,226,.7)}
.ab-progress-text{position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:3px;
  color:#fff;text-shadow:0 1px 3px #000}

/* ============ MESSAGE ============ */
#message{position:absolute;top:64px;left:50%;transform:translateX(-50%);
  background:rgba(6,14,10,.95);border:1px solid var(--border2);
  padding:8px 18px;border-radius:5px;font-size:12px;color:#d0e0d0;
  z-index:450;white-space:nowrap;transition:opacity .3s;
  letter-spacing:.5px;font-family:'Consolas',monospace}

/* ============ TOASTS ============ */
#toasts{position:fixed;top:64px;right:20px;z-index:1000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(10,26,20,.98);border:1px solid var(--border2);
  border-left:3px solid var(--cyan);border-radius:6px;
  padding:12px 16px;font-size:12px;color:#e8f0e8;
  min-width:240px;max-width:340px;
  box-shadow:0 8px 24px rgba(0,0,0,.7);
  animation:toastIn .3s cubic-bezier(.34,1.4,.4,1);pointer-events:auto}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warning{border-left-color:var(--yellow)}
.toast.fade-out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}
  to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast-title{font-weight:800;font-size:11px;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;margin-bottom:3px}
.toast-msg{font-size:12px;color:#8fa49a;line-height:1.5}

/* ============ MAP CONTROLS ============ */
.map-controls{position:absolute;right:14px;bottom:88px;
  display:flex;flex-direction:column;gap:4px;z-index:450}
.map-controls button{width:36px;height:36px;background:rgba(6,14,10,.9);
  border:1px solid var(--border2);color:#c8d8c8;border-radius:4px;
  cursor:pointer;font-size:18px;font-family:inherit;
  transition:.15s;font-weight:600}
.map-controls button:hover{border-color:var(--cyan);
  background:#14261c;color:#fff}

/* ============ LOADING ============ */
#loading{position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#0a1a14;z-index:2000;color:var(--muted);
  font-family:'Consolas',monospace;letter-spacing:3px;font-size:13px}
#loading.hidden{display:none}

/* ============ BATTLE BANNER (Mitte) ============ */
#battleBanner{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.8);
  padding:16px 36px;
  background:linear-gradient(180deg,rgba(20,10,10,.98),rgba(10,6,6,.98));
  border:2px solid #e74c3c;
  border-radius:8px;
  font-size:22px;font-weight:900;
  letter-spacing:5px;
  color:#fff;
  text-shadow:0 0 20px rgba(231,76,60,.9),0 2px 8px #000;
  z-index:800;
  pointer-events:none;
  opacity:0;
  box-shadow:0 0 40px rgba(231,76,60,.6),
             0 10px 40px rgba(0,0,0,.9)}
#battleBanner.show{
  animation:bannerPulse 1.2s ease-out}
@keyframes bannerPulse{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#08120d}
::-webkit-scrollbar-thumb{background:#1e3025;border-radius:3px}
</style>
</head>
<body>

<div id="game">
  <div id="map"></div>

  <div class="topbar">
    <h1>ATLAS<span>//</span>BLITZ</h1>
    <div class="stats">
      <div class="item"><span class="dot cyan"></span>Achse <b id="statPlayer">0K</b></div>
      <div class="item"><span class="dot red"></span>Alliierte <b id="statEnemy">0K</b></div>
      <div class="item"><span class="dot green"></span>Einheiten <b id="statUnits">0</b></div>
    </div>
  </div>

  <div class="map-controls">
    <button onclick="zoomMap(1)">+</button>
    <button onclick="zoomMap(-1)">−</button>
    <button onclick="resetMap()">⌂</button>
  </div>

  <div id="message">Einheit auswählen...</div>
  <div id="loading">KARTE WIRD GELADEN...</div>
  <div id="battleBanner">⚔ SCHLACHT ⚔</div>

  <div class="attack-bar hidden" id="attackBar">
    <div class="ab-info attacker">
      <div class="label">ANGREIFER</div>
      <div class="name" id="abAttName">—</div>
      <div class="troops" id="abAttTroops">—</div>
    </div>

    <div class="ab-slider-wrap" id="abSliderWrap">
      <input type="range" class="ab-slider" id="abSlider" min="1" max="100" value="100">
      <div class="ab-meta">
        <span>ENT SENDEN: <b id="abSend">—</b></span>
        <span id="abRatio">—</span>
        <span>VERBLEIB: <b id="abRemain">—</b></span>
      </div>
    </div>

    <div class="ab-progress" id="abProgressWrap" style="display:none">
      <div class="ab-progress-bar">
        <div class="ab-progress-fill" id="abProgressFill"></div>
        <div class="ab-progress-text" id="abProgressText">SCHLACHT LÄUFT</div>
      </div>
    </div>

    <div class="ab-info defender">
      <div class="label">VERTEIDIGER</div>
      <div class="name" id="abDefName">—</div>
      <div class="troops" id="abDefTroops">—</div>
    </div>

    <button class="ab-btn" id="abBtn">⚔ ANGRIFF</button>
  </div>
</div>

<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   NATO SYMBOLE
============================================================ */
const NATO_SYMBOLS = {
  infantry: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <line x1="2" y1="2" x2="42" y2="24" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line x1="42" y1="2" x2="2" y2="24" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`,
  armor: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <ellipse cx="22" cy="13" rx="12" ry="7" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`,
  mechanized: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <line x1="2" y1="2" x2="42" y2="24" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <line x1="42" y1="2" x2="2" y2="24" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <ellipse cx="22" cy="13" rx="9" ry="5" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>`
};

/* ============================================================
   STÄDTE
============================================================ */
const CITIES = {

  Hamburg:   {lat: 53.55, lng:  9.99},

  Budapest:  {lat: 47.50, lng: 19.04, capital: true},

};

/* ============================================================
   START-EINHEITEN (mit Flaggen-Code für die Schlacht-Visualisierung)
============================================================ */
const STARTING_UNITS = [
  // ACHSE (Spieler)
  {city:'Berlin',    side:'player', type:'armor',      troops:140, flag:'de'},
  {city:'Hamburg',   side:'player', type:'infantry',   troops:80,  flag:'de'},
  {city:'München',   side:'player', type:'mechanized', troops:95,  flag:'de'},
  {city:'Wien',      side:'player', type:'infantry',   troops:65,  flag:'at'},

  {city:'Mailand',   side:'player', type:'armor',      troops:75,  flag:'it'},
  {city:'Amsterdam', side:'player', type:'infantry',   troops:40,  flag:'nl'},
  {city:'Brüssel',   side:'player', type:'infantry',   troops:35,  flag:'be'},

  // ALLIIERTE (Feind)
  {city:'London',    side:'enemy', type:'armor',       troops:110, flag:'gb'},

  {city:'Paris',     side:'enemy', type:'armor',       troops:130, flag:'fr'},

  {city:'Warschau',  side:'enemy', type:'armor',       troops:120, flag:'pl'},
  {city:'Krakau',    side:'enemy', type:'infantry',    troops:80,  flag:'pl'},
  {city:'Belgrad',   side:'enemy', type:'infantry',    troops:65,  flag:'rs'},
  {city:'Bukarest',  side:'enemy', type:'mechanized',  troops:85,  flag:'ro'},

  {city:'Minsk',     side:'enemy', type:'armor',       troops:150, flag:'by'},

  {city:'Moskau',    side:'enemy', type:'armor',       troops:200, flag:'ru'}
];

/* ============================================================
   STATE
============================================================ */
const state = {
  units: [],
  unitIdCounter: 0,
  selectedUnit: null,
  targetUnit: null,
  battle: null,
  gameOver: false,
  side: 'player',
  battleLayers: []  // Flaggen & Frontlinie — nur während Schlacht aktiv
};

/* ============================================================
   KARTE
============================================================ */
const MAP_CENTER = [52.0, 20.0];
const MAP_BOUNDS = L.latLngBounds(L.latLng(35, -12), L.latLng(72, 45));

const map = L.map("map", {
  zoomControl: false, attributionControl: true,
  minZoom: 4, maxZoom: 9,
  maxBounds: MAP_BOUNDS, maxBoundsViscosity: 1.0,
  worldCopyJump: false, zoomSnap: 0.25, zoomDelta: 0.5,
  preferCanvas: true, zoomAnimation: true
});
map.setView(MAP_CENTER, 5);

/* ============================================================
   LÄNDER LADEN
============================================================ */
const GEOJSON_URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson";

fetch(GEOJSON_URL)
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      filter: f => f.properties.CONTINENT === "Europe",
      style: () => ({
        color: '#1e3025', weight: 1, opacity: 0.9,
        fillColor: '#1a2f22', fillOpacity: 0.7,
        interactive: false
      })
    }).addTo(map);

    L.geoJSON(data, {
      filter: f => f.properties.CONTINENT === "Europe",
      style: () => ({
        color: '#2a4435', weight: 0.5, opacity: 0.4,
        fillColor: '#22392a', fillOpacity: 0.3,
        interactive: false
      })
    }).addTo(map);

    addCities();
    addUnits();
    document.getElementById('loading').classList.add('hidden');
    notify("Einheit auswählen");
  })
  .catch(err => {
    console.error(err);
    document.getElementById('loading').textContent = "FEHLER BEIM LADEN";
  });

/* ============================================================
   STÄDTE
============================================================ */
function addCities() {
  Object.entries(CITIES).forEach(([name, info]) => {
    const icon = L.divIcon({
      className: 'city-marker',
      html: `<div class="city-icon">
        <div class="city-dot ${info.capital ? 'capital' : ''}"></div>
        <div class="city-name">${name}</div>
      </div>`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    L.marker([info.lat, info.lng], { icon, interactive: false }).addTo(map);
  });
}

/* ============================================================
   EINHEITEN
============================================================ */
function addUnits() {
  STARTING_UNITS.forEach(u => {
    const city = CITIES[u.city];
    if (!city) return;
    createUnit(u.side, u.type, u.troops, u.flag, city.lat, city.lng, u.city);
  });
  updateStats();
}

function createUnit(side, type, troops, flag, lat, lng, cityName) {
  const id = ++state.unitIdCounter;
  const unit = { id, side, type, troops, flag, lat, lng, city: cityName, maxTroops: troops };

  unit.marker = L.marker([lat, lng], {
    icon: makeUnitIcon(unit), draggable: false, keyboard: false
  }).addTo(map);

  unit.marker.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    onUnitClick(unit);
  });

  state.units.push(unit);
  return unit;
}

function makeUnitIcon(unit) {
  const level = unit.troops > 150 ? 'XXX'
              : unit.troops > 100 ? 'XX'
              : unit.troops > 60  ? 'X'
              : 'III';
  const symbol = NATO_SYMBOLS[unit.type] || NATO_SYMBOLS.infantry;
  const html = `
    <div class="unit-wrapper">
      <div class="unit-strength">${Math.floor(unit.troops)}K</div>
      <div class="unit-rect">${symbol}</div>
      <div class="unit-level">${level}</div>
    </div>`;
  return L.divIcon({
    className: 'unit-marker ' + unit.side,
    html, iconSize: [56, 56], iconAnchor: [28, 28]
  });
}

function updateUnitIcon(unit) {
  unit.marker.setIcon(makeUnitIcon(unit));
}

/* ============================================================
   KLICK
============================================================ */
function onUnitClick(unit) {
  if (state.battle || state.gameOver) return;

  if (!state.selectedUnit) {
    if (unit.side !== state.side) {
      showToast("Nur eigene Einheiten", "Wähle eine blaue Einheit aus.", "warning");
      return;
    }
    selectUnit(unit);
    return;
  }

  if (unit.side === state.side) {
    unit === state.selectedUnit ? deselectUnit() : selectUnit(unit);
    return;
  }

  state.targetUnit = unit;
  updateTargetable();
  updateAttackBar();
  notify("Ziel: " + unit.city);
}

function selectUnit(unit) {
  state.selectedUnit = unit;
  state.targetUnit = null;
  updateSelection();
  updateTargetable();
  updateAttackBar();
  notify("Ausgewählt: " + unit.city + " — Feind anklicken");
}

function deselectUnit() {
  state.selectedUnit = null;
  state.targetUnit = null;
  updateSelection();
  updateTargetable();
  hideAttackBar();
  notify("Einheit auswählen");
}

function updateSelection() {
  state.units.forEach(u => {
    u.marker.getElement()?.classList.remove('selected');
  });
  state.selectedUnit?.marker.getElement()?.classList.add('selected');
}

function updateTargetable() {
  state.units.forEach(u => {
    u.marker.getElement()?.classList.remove('targetable');
  });
  const selected = state.selectedUnit;
  if (!selected) return;
  state.units.forEach(u => {
    if (u.side === state.side) return;
    const d = map.distance([selected.lat, selected.lng], [u.lat, u.lng]);
    if (d <= 600000) u.marker.getElement()?.classList.add('targetable');
  });
}

/* ============================================================
   ATTACK BAR
============================================================ */
const attackBar = document.getElementById('attackBar');
const attackSlider = document.getElementById('abSlider');

function updateAttackBar() {
  if (!state.selectedUnit || !state.targetUnit) {
    hideAttackBar();
    return;
  }

  const att = state.selectedUnit;
  const def = state.targetUnit;

  document.getElementById('abAttName').textContent = att.city;
  document.getElementById('abAttTroops').textContent = Math.floor(att.troops) + 'K';
  document.getElementById('abDefName').textContent = def.city;
  document.getElementById('abDefTroops').textContent = Math.floor(def.troops) + 'K';

  attackSlider.value = 100;
  attackSlider.disabled = false;
  document.getElementById('abBtn').textContent = '⚔ ANGRIFF';
  document.getElementById('abBtn').disabled = false;
  document.getElementById('abSliderWrap').style.display = 'flex';
  document.getElementById('abProgressWrap').style.display = 'none';

  updateSliderLabels();
  attackBar.classList.remove('hidden');
}

function hideAttackBar() {
  attackBar.classList.add('hidden');
}

function updateSliderLabels() {
  if (!state.selectedUnit || !state.targetUnit) return;
  const att = state.selectedUnit;
  const def = state.targetUnit;

  const pct = parseInt(attackSlider.value);
  const send = Math.floor(att.troops * pct / 100);
  const remain = Math.floor(att.troops) - send;

  document.getElementById('abSend').textContent = send + 'K';
  document.getElementById('abRemain').textContent = remain + 'K';

  const ratio = send / (def.troops || 1);
  let label;
  if (ratio > 1.5) label = '🟢 ÜBERLEGEN';
  else if (ratio > 1.05) label = '🟡 KNAPP';
  else if (ratio > 0.9) label = '🟠 AUSGEGLICHEN';
  else label = '🔴 UNTERLEGEN';
  document.getElementById('abRatio').textContent = label;
}

attackSlider.addEventListener('input', updateSliderLabels);

document.getElementById('abBtn').addEventListener('click', () => {
  if (state.battle) return;
  if (!state.selectedUnit || !state.targetUnit) return;
  startBattle();
});

/* ============================================================
   SCHLACHT — automatisch, mit Flaggen & Frontlinie
============================================================ */
function startBattle() {
  const att = state.selectedUnit;
  const def = state.targetUnit;
  const pct = parseInt(attackSlider.value);
  const send = Math.floor(att.troops * pct / 100);

  if (send < 1) {
    showToast("Zu wenig Truppen", "Mindestens 1K senden.", "warning");
    return;
  }

  att.troops -= send;

  state.battle = {
    attacker: att,
    defender: def,
    attTroops: send,
    defTroops: def.troops,
    initialAtt: send,
    initialDef: def.troops,
    progress: 0,
    lastTick: performance.now(),
    startTime: performance.now()
  };

  // Schlacht-Banner
  const banner = document.getElementById('battleBanner');
  banner.textContent = '⚔ ' + def.city.toUpperCase() + ' ⚔';
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');

  // UI Modus
  attackSlider.disabled = true;
  document.getElementById('abBtn').disabled = true;
  document.getElementById('abBtn').textContent = '⚔ SCHLACHT';
  document.getElementById('abSliderWrap').style.display = 'none';
  document.getElementById('abProgressWrap').style.display = 'flex';

  // Einheiten wackeln
  att.marker.getElement()?.classList.add('in-battle');
  def.marker.getElement()?.classList.add('in-battle');

  // BATTLE VISUALS ERZEUGEN (Flaggen + Frontlinie)
  createBattleVisuals();

  // Kamera auf Schlachtfeld
  const midLat = (att.lat + def.lat) / 2;
  const midLng = (att.lng + def.lng) / 2;
  map.flyTo([midLat, midLng], Math.max(6, map.getZoom()), { duration: 0.8 });

  requestAnimationFrame(battleLoop);
  notify("⚔ SCHLACHT um " + def.city.toUpperCase());
}

/* ============================================================
   BATTLE VISUALS — nur während Schlacht sichtbar
   ------------------------------------------------------------
   - Flaggen beider Seiten (mit Truppenstärke darunter)
   - Frontlinie, die sich zwischen den Flaggen verschiebt
============================================================ */
function createBattleVisuals() {
  const b = state.battle;
  if (!b) return;

  const att = b.attacker;
  const def = b.defender;

  const dLng = def.lng - att.lng;
  const dLat = def.lat - att.lat;
  const len = Math.sqrt(dLng*dLng + dLat*dLat) || 0.001;
  const ux = dLng / len;
  const uy = dLat / len;
  const px = -uy, py = ux;

  // Fünf Flaggen pro Seite, fächerförmig angeordnet
  const numFlags = 5;
  const spread = Math.min(len * 0.5, 2.0);

  const flagLayers = { attacker: [], defender: [] };

  for (let i = 0; i < numFlags; i++) {
    const t = (i - (numFlags - 1) / 2) / numFlags;

    // Angreifer-Flagge
    const attLat = att.lat + py * spread * t;
    const attLng = att.lng + px * spread * t;

    const attIcon = L.divIcon({
      className: 'battle-flag',
      html: `<div class="battle-flag-inner">
        <img class="battle-flag-img attacker"
             src="https://flagcdn.com/w40/${att.flag}.png"
             onerror="this.src='https://flagcdn.com/w40/un.png'">
        <div class="battle-flag-troops attacker" data-side="attacker" data-idx="${i}">—K</div>
      </div>`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    const attMarker = L.marker([attLat, attLng], {
      icon: attIcon, interactive: false, zIndexOffset: 3000
    }).addTo(map);
    flagLayers.attacker.push(attMarker);

    // Verteidiger-Flagge
    const defLat = def.lat + py * spread * t;
    const defLng = def.lng + px * spread * t;

    const defIcon = L.divIcon({
      className: 'battle-flag',
      html: `<div class="battle-flag-inner">
        <img class="battle-flag-img defender"
             src="https://flagcdn.com/w40/${def.flag}.png"
             onerror="this.src='https://flagcdn.com/w40/un.png'">
        <div class="battle-flag-troops defender" data-side="defender" data-idx="${i}">—K</div>
      </div>`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    const defMarker = L.marker([defLat, defLng], {
      icon: defIcon, interactive: false, zIndexOffset: 3000
    }).addTo(map);
    flagLayers.defender.push(defMarker);
  }

  // Frontlinie
  const frontPts = [];
  for (let i = -10; i <= 10; i++) {
    const t = i / 10;
    frontPts.push([
      att.lat + py * spread * t * 0.8,
      att.lng + px * spread * t * 0.8
    ]);
  }
  const frontLine = L.polyline(frontPts, {
    color: '#ffd54f', weight: 3, opacity: 0.9,
    dashArray: '10,8', interactive: false
  }).addTo(map);

  state.battleLayers = [
    ...flagLayers.attacker,
    ...flagLayers.defender,
    frontLine
  ];
  state.battleFlagData = { flagLayers, frontLine, spread, ux, uy, px, py, len };
}

function updateBattleFlagPositions() {
  const b = state.battle;
  const data = state.battleFlagData;
  if (!b || !data) return;

  const att = b.attacker;
  const def = b.defender;
  const { flagLayers, frontLine, spread, ux, uy, px, py, len } = data;

  // Frontposition (0.4 → 0.95)
  const frontPos = 0.4 + b.progress * 0.55;
  const frontLat = att.lat + uy * len * frontPos;
  const frontLng = att.lng + ux * len * frontPos;

  // Angreifer-Flaggen: hinter der Front (leicht zurückversetzt)
  flagLayers.attacker.forEach((marker, i) => {
    const t = (i - (flagLayers.attacker.length - 1) / 2) / flagLayers.attacker.length;
    const lat = frontLat + py * spread * t - uy * 0.08;
    const lng = frontLng + px * spread * t - ux * 0.08;
    marker.setLatLng([lat, lng]);
  });

  // Verteidiger-Flaggen: vor der Front (zurückweichend)
  flagLayers.defender.forEach((marker, i) => {
    const t = (i - (flagLayers.defender.length - 1) / 2) / flagLayers.defender.length;
    const lat = frontLat + py * spread * t + uy * 0.08;
    const lng = frontLng + px * spread * t + ux * 0.08;
    marker.setLatLng([lat, lng]);
  });

  // Frontlinie verschieben
  if (frontLine) {
    const pts = [];
    for (let i = -10; i <= 10; i++) {
      const t = i / 10;
      pts.push([
        frontLat + py * spread * t * 0.8,
        frontLng + px * spread * t * 0.8
      ]);
    }
    frontLine.setLatLngs(pts);
  }

  // Truppenstärken in den Flaggen aktualisieren
  const attEls = document.querySelectorAll('.battle-flag-troops.attacker');
  const defEls = document.querySelectorAll('.battle-flag-troops.defender');
  attEls.forEach(el => el.textContent = Math.floor(b.attTroops) + 'K');
  defEls.forEach(el => el.textContent = Math.floor(b.defTroops) + 'K');
}

function destroyBattleVisuals() {
  state.battleLayers.forEach(l => map.removeLayer(l));
  state.battleLayers = [];
  state.battleFlagData = null;
}

/* ============================================================
   BATTLE LOOP — automatisch
============================================================ */
function battleLoop(now) {
  const b = state.battle;
  if (!b) return;

  const dt = Math.min(0.05, (now - b.lastTick) / 1000);
  b.lastTick = now;

  // Truppenverluste
  b.attTroops = Math.max(0, b.attTroops - b.defTroops * 0.06 * dt);
  b.defTroops = Math.max(0, b.defTroops - b.attTroops * 0.06 * dt);

  b.progress = 1 - b.defTroops / b.initialDef;

  // UI Updates
  document.getElementById('abAttTroops').textContent = Math.floor(b.attTroops) + 'K';
  document.getElementById('abDefTroops').textContent = Math.floor(b.defTroops) + 'K';
  const pct = Math.round(b.progress * 100);
  document.getElementById('abProgressFill').style.width = pct + '%';
  document.getElementById('abProgressText').textContent = 'SCHLACHT — ' + pct + '%';

  // Einheiten-Truppen live
  b.attacker.troops = b.attTroops;
  b.defender.troops = b.defTroops;
  updateUnitIcon(b.attacker);
  updateUnitIcon(b.defender);

  // Flaggen & Front bewegen
  updateBattleFlagPositions();

  if (b.defTroops <= 0.5) { endBattle(true); return; }
  if (b.attTroops <= 0.5) { endBattle(false); return; }

  requestAnimationFrame(battleLoop);
}

function endBattle(attackerWon) {
  const b = state.battle;
  if (!b) return;

  const att = b.attacker;
  const def = b.defender;

  att.marker.getElement()?.classList.remove('in-battle');
  def.marker.getElement()?.classList.remove('in-battle');

  // Battle-Visuals entfernen — Karte wird wieder sauber
  destroyBattleVisuals();

  if (attackerWon) {
    removeUnit(def);
    att.lat = def.lat;
    att.lng = def.lng;
    att.city = def.city;
    att.troops = b.attTroops;
    att.marker.setLatLng([att.lat, att.lng]);
    updateUnitIcon(att);

    showToast("SIEG", def.city + " eingenommen! " + Math.floor(b.attTroops) + "K stationiert.", "success", 5000);
    notify("🏆 " + def.city + " erobert!");
  } else {
    def.troops = b.defTroops;
    att.troops = b.attTroops;
    updateUnitIcon(att);
    updateUnitIcon(def);

    showToast("NIEDERLAGE", def.city + " hält stand.", "error", 5000);
    notify("💀 " + def.city + " nicht eingenommen!");
  }

  state.battle = null;

  // UI zurücksetzen
  document.getElementById('abSliderWrap').style.display = 'flex';
  document.getElementById('abProgressWrap').style.display = 'none';
  document.getElementById('abProgressFill').style.width = '0%';
  attackSlider.disabled = false;
  document.getElementById('abBtn').disabled = false;

  if (attackerWon) {
    state.selectedUnit = null;
    state.targetUnit = null;
    hideAttackBar();
  } else {
    state.targetUnit = null;
  }

  updateSelection();
  updateTargetable();
  updateStats();

  setTimeout(() => {
    map.flyTo(MAP_CENTER, 5, { duration: 1 });
  }, 800);
}

function removeUnit(unit) {
  map.removeLayer(unit.marker);
  state.units = state.units.filter(u => u !== unit);
}

/* ============================================================
   STATS
============================================================ */
function updateStats() {
  const playerTroops = state.units
    .filter(u => u.side === 'player')
    .reduce((s, u) => s + u.troops, 0);
  const enemyTroops = state.units
    .filter(u => u.side === 'enemy')
    .reduce((s, u) => s + u.troops, 0);

  document.getElementById('statPlayer').textContent = Math.floor(playerTroops) + 'K';
  document.getElementById('statEnemy').textContent = Math.floor(enemyTroops) + 'K';
  document.getElementById('statUnits').textContent = state.units.length;
}

/* ============================================================
   MAP CONTROLS
============================================================ */
function zoomMap(dir) { dir > 0 ? map.zoomIn(0.5) : map.zoomOut(0.5); }
function resetMap() { map.flyTo(MAP_CENTER, 5, { duration: 0.8 }); }

/* ============================================================
   TOASTS / NOTIFY
============================================================ */
function notify(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0.7'; }, 3000);
}

function showToast(title, message, type = 'info', duration = 3500) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'toast' + (type !== 'info' ? ' ' + type : '');
  toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${message}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ============================================================
   NACHschub (nur außerhalb von Schlachten)
============================================================ */
setInterval(() => {
  if (state.gameOver || state.battle) return;
  state.units.forEach(u => {
    u.troops += 0.3;
    if (u.troops > u.maxTroops * 1.5) u.troops = u.maxTroops * 1.5;
    updateUnitIcon(u);
  });
  updateStats();
}, 3000);

/* ============================================================
   START
============================================================ */
updateStats();
</script>

</body>
</html>
