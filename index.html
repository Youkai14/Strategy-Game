<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATLAS BLITZ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1510;--panel:#0e1a1c;--border:#1e3025;--border2:#2a4435;
  --text:#e8f0e8;--muted:#6f8577;--green:#5fcc8f;--cyan:#4a90e2;
  --red:#e74c3c;--yellow:#e8c547;--dark-green:#1a2f22;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--text);font-family:'Segoe UI',system-ui,Arial,sans-serif;
  user-select:none}

#game{height:100vh;position:relative}

/* ============ MAP ============ */
#map{width:100%;height:100%;background:#0a1a14}
.leaflet-container{background:#0a1a14;font-family:inherit}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{background:rgba(5,15,10,.8)!important;
  color:#4a5c52!important;font-size:9px!important;font-family:monospace}
.leaflet-control-attribution a{color:#6f8577!important}

/* Country terrain labels - very subtle */
.terrain-label{
  background:transparent!important;border:none!important;
  box-shadow:none!important;
  color:rgba(200,220,200,.35);
  font-size:11px;font-weight:600;
  letter-spacing:3px;text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  padding:0!important;
  white-space:nowrap}
.terrain-label::before{display:none!important}

/* ============ CITY MARKERS ============ */
.city-marker{
  background:transparent!important;border:none!important;
  box-shadow:none!important}
.city-icon{
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-50%);position:relative;
  pointer-events:none}
.city-dot{
  width:8px;height:8px;background:#e8e8e8;
  border:2px solid #0a1a14;border-radius:50%;
  box-shadow:0 0 6px rgba(255,255,255,.4)}
.city-dot.capital{
  width:12px;height:12px;background:#ffd54f;
  box-shadow:0 0 12px rgba(255,213,79,.8)}
.city-name{
  margin-top:4px;font-size:10px;color:#d0e0d0;
  font-weight:600;letter-spacing:.5px;
  white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 6px #000}

/* ============ UNIT MARKERS ============ */
.unit-marker{
  background:transparent!important;border:none!important;
  box-shadow:none!important;cursor:pointer;
  transition:filter .15s}
.unit-wrapper{
  position:relative;
  width:56px;height:56px;
  transform:translate(-50%,-50%);
  pointer-events:auto}
.unit-strength{
  position:absolute;top:-2px;left:50%;
  transform:translateX(-50%);
  padding:1px 6px;
  font-size:10px;font-weight:800;
  font-family:'Consolas',monospace;
  letter-spacing:.5px;
  border-radius:3px;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.7);
  z-index:3}
.unit-rect{
  position:absolute;
  top:14px;left:50%;
  transform:translateX(-50%);
  width:44px;height:26px;
  border:2px solid currentColor;
  border-radius:2px;
  background:rgba(10,20,15,.9);
  z-index:2}
.unit-rect svg{
  position:absolute;inset:0;
  width:100%;height:100%}
.unit-level{
  position:absolute;bottom:-6px;left:50%;
  transform:translateX(-50%);
  font-size:9px;font-weight:800;
  letter-spacing:1px;
  color:#fff;
  text-shadow:0 1px 2px #000;
  background:rgba(10,20,15,.85);
  padding:0 3px;
  border-radius:2px;
  z-index:3}

/* Player units - blue */
.unit-marker.player .unit-rect{color:#4a90e2;border-color:#4a90e2}
.unit-marker.player .unit-strength{
  background:#4a90e2;color:#fff}
.unit-marker.player .unit-rect svg{color:#4a90e2}

/* Enemy units - red */
.unit-marker.enemy .unit-rect{color:#e74c3c;border-color:#e74c3c}
.unit-marker.enemy .unit-strength{
  background:#e74c3c;color:#fff}
.unit-marker.enemy .unit-rect svg{color:#e74c3c}

/* Selected */
.unit-marker.selected .unit-rect{
  box-shadow:0 0 0 2px #ffd54f,0 0 16px rgba(255,213,79,.9);
  border-color:#ffd54f!important}
.unit-marker.selected .unit-rect svg{color:#ffd54f!important}

/* Highlight targetable */
.unit-marker.targetable .unit-rect{
  animation:pulse-red 1s infinite}
@keyframes pulse-red{
  0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}
  50%{box-shadow:0 0 0 6px rgba(231,76,60,.5),0 0 12px rgba(231,76,60,.8)}}

/* In battle */
.unit-marker.in-battle .unit-rect{
  animation:shake .3s infinite}
@keyframes shake{
  0%,100%{transform:translateX(-50%) translateY(0)}
  25%{transform:translateX(-50%) translateY(-1px)}
  75%{transform:translateX(-50%) translateY(1px)}}

/* ============ TOP BAR ============ */
.topbar{
  position:absolute;top:0;left:0;right:0;height:52px;
  background:linear-gradient(180deg,rgba(6,14,10,.96),rgba(6,14,10,.85));
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;
  padding:0 20px;
  z-index:500;
  backdrop-filter:blur(8px)}
.topbar h1{
  font-size:15px;font-weight:800;
  letter-spacing:4px;
  color:#e8f0e8}
.topbar h1 span{color:var(--cyan)}
.topbar .stats{
  margin-left:auto;display:flex;gap:22px;
  font-size:12px;color:var(--muted);
  align-items:center}
.topbar .stats .item{
  display:flex;align-items:center;gap:6px;
  font-variant-numeric:tabular-nums}
.topbar .stats .item b{
  color:#e8f0e8;font-weight:700;font-size:13px}
.topbar .stats .item .dot{
  width:6px;height:6px;border-radius:50%;display:inline-block}
.topbar .stats .item .dot.cyan{background:var(--cyan)}
.topbar .stats .item .dot.red{background:var(--red)}
.topbar .stats .item .dot.green{background:var(--green)}

/* ============ ATTACK BAR ============ */
.attack-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(0deg,rgba(6,14,10,.98),rgba(6,14,10,.88));
  border-top:1px solid var(--border2);
  padding:14px 24px;
  z-index:500;
  display:flex;align-items:center;gap:22px;
  backdrop-filter:blur(10px);
  transform:translateY(0);
  transition:transform .25s cubic-bezier(.34,1.4,.4,1)}
.attack-bar.hidden{transform:translateY(120%)}

.ab-info{flex:0 0 auto;text-align:center;min-width:120px}
.ab-info .label{font-size:9px;letter-spacing:2px;color:var(--muted)}
.ab-info .name{font-size:14px;font-weight:800;margin-top:2px;color:#e8f0e8}
.ab-info .troops{
  font-size:16px;font-weight:800;
  font-family:'Consolas',monospace;
  margin-top:2px}
.ab-info.attacker .troops{color:var(--cyan)}
.ab-info.defender .troops{color:var(--red)}

.ab-slider-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
.ab-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:6px;background:#16261e;
  border-radius:3px;outline:none}
.ab-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:var(--cyan);
  cursor:pointer;border:2px solid #0a1a14;
  box-shadow:0 0 12px rgba(74,144,226,.8)}
.ab-slider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  background:var(--cyan);cursor:pointer;border:2px solid #0a1a14}
.ab-slider:disabled{opacity:.4}

.ab-meta{
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--muted);
  font-family:'Consolas',monospace}
.ab-meta b{color:#ffd54f}

.ab-btn{
  flex:0 0 auto;padding:14px 28px;
  background:linear-gradient(180deg,#c73a3a,#8a1a1a);
  border:1px solid #e05a5a;border-radius:6px;
  color:#fff;font-weight:800;font-size:12px;
  letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;font-family:inherit;
  transition:.15s;
  min-width:160px}
.ab-btn:hover:not(:disabled){
  filter:brightness(1.15);transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(199,58,58,.5)}
.ab-btn:disabled{opacity:.4;cursor:not-allowed}

/* Battle progress (replaces slider during battle) */
.ab-progress{
  flex:1;display:flex;flex-direction:column;gap:8px}
.ab-progress-bar{
  height:16px;background:#050f0a;
  border-radius:8px;overflow:hidden;
  border:1px solid #1a3025;position:relative}
.ab-progress-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#4a90e2,#3a70b2);
  transition:width .1s linear;
  box-shadow:0 0 12px rgba(74,144,226,.7)}
.ab-progress-text{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;letter-spacing:2px;
  color:#fff;text-shadow:0 1px 3px #000}

/* ============ MESSAGE / TOAST ============ */
#message{
  position:absolute;top:64px;left:50%;transform:translateX(-50%);
  background:rgba(6,14,10,.95);
  border:1px solid var(--border2);
  padding:8px 18px;border-radius:5px;
  font-size:12px;color:#d0e0d0;
  z-index:450;
  white-space:nowrap;
  transition:opacity .3s;
  letter-spacing:.5px;
  font-family:'Consolas',monospace}

#toasts{
  position:fixed;top:64px;right:20px;
  z-index:1000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none}
.toast{
  background:rgba(10,26,20,.98);
  border:1px solid var(--border2);
  border-left:3px solid var(--cyan);
  border-radius:6px;
  padding:12px 16px;
  font-size:12px;color:#e8f0e8;
  min-width:240px;max-width:340px;
  box-shadow:0 8px 24px rgba(0,0,0,.7);
  animation:toastIn .3s cubic-bezier(.34,1.4,.4,1);
  pointer-events:auto;
  font-family:'Segoe UI',sans-serif}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast.warning{border-left-color:var(--yellow)}
.toast.fade-out{animation:toastOut .3s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}
  to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast-title{
  font-weight:800;font-size:11px;
  letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;margin-bottom:3px}
.toast-msg{font-size:12px;color:#8fa49a;line-height:1.5}

/* ============ MAP CONTROLS ============ */
.map-controls{
  position:absolute;right:14px;bottom:88px;
  display:flex;flex-direction:column;gap:4px;
  z-index:450}
.map-controls button{
  width:36px;height:36px;
  background:rgba(6,14,10,.9);
  border:1px solid var(--border2);
  color:#c8d8c8;border-radius:4px;
  cursor:pointer;font-size:18px;font-family:inherit;
  transition:.15s;font-weight:600}
.map-controls button:hover{
  border-color:var(--cyan);background:#14261c;color:#fff}

/* ============ LOADING ============ */
#loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#0a1a14;z-index:2000;
  color:var(--muted);
  font-family:'Consolas',monospace;
  letter-spacing:3px;font-size:13px}
#loading.hidden{display:none}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#08120d}
::-webkit-scrollbar-thumb{background:#1e3025;border-radius:3px}
</style>
</head>
<body>

<div id="game">

  <div id="map"></div>

  <div class="topbar">
    <h1>ATLAS<span>//</span>BLITZ</h1>
    <div class="stats">
      <div class="item"><span class="dot cyan"></span>Achse <b id="statPlayer">0K</b></div>
      <div class="item"><span class="dot red"></span>Feind <b id="statEnemy">0K</b></div>
      <div class="item"><span class="dot green"></span>Fronten <b id="statFronts">0</b></div>
    </div>
  </div>

  <div class="map-controls">
    <button onclick="zoomMap(1)">+</button>
    <button onclick="zoomMap(-1)">−</button>
    <button onclick="resetMap()">⌂</button>
  </div>

  <div id="message">Einheit auswählen...</div>

  <div id="loading">KARTE WIRD GELADEN...</div>

  <div class="attack-bar hidden" id="attackBar">
    <div class="ab-info attacker">
      <div class="label">ANGREIFER</div>
      <div class="name" id="abAttName">—</div>
      <div class="troops" id="abAttTroops">—</div>
    </div>

    <div class="ab-slider-wrap" id="abSliderWrap">
      <input type="range" class="ab-slider" id="abSlider" min="1" max="100" value="100">
      <div class="ab-meta">
        <span>ENT SENDEN: <b id="abSend">—</b></span>
        <span id="abRatio">—</span>
        <span>VERBLEIB: <b id="abRemain">—</b></span>
      </div>
    </div>

    <div class="ab-progress" id="abProgressWrap" style="display:none">
      <div class="ab-progress-bar">
        <div class="ab-progress-fill" id="abProgressFill"></div>
        <div class="ab-progress-text" id="abProgressText">SCHLACHT LÄUFT</div>
      </div>
    </div>

    <div class="ab-info defender">
      <div class="label">VERTEIDIGER</div>
      <div class="name" id="abDefName">—</div>
      <div class="troops" id="abDefTroops">—</div>
    </div>

    <button class="ab-btn" id="abBtn">⚔ ANGRIFF</button>
  </div>

</div>

<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   KONFIGURATION
============================================================ */
const MAP_CENTER = [52.0, 20.0];
const MAP_BOUNDS = L.latLngBounds(L.latLng(35, -12), L.latLng(72, 45));

const START_TROOPS_RANGE = [40, 150]; // in K
const BATTLE_RATE = 12; // K Truppen pro Sekunde

/* ============================================================
   NATO-SYMBOLE (SVG)
============================================================ */
const NATO_SYMBOLS = {
  infantry: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <line x1="2" y1="2" x2="42" y2="24" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <line x1="42" y1="2" x2="2" y2="24" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`,
  armor: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <ellipse cx="22" cy="13" rx="12" ry="7" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>`,
  artillery: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <circle cx="22" cy="13" r="5" fill="currentColor"/>
  </svg>`,
  mechanized: `<svg viewBox="0 0 44 26" preserveAspectRatio="none">
    <line x1="2" y1="2" x2="42" y2="24" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <line x1="42" y1="2" x2="2" y2="24" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <ellipse cx="22" cy="13" rx="9" ry="5" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>`
};

/* ============================================================
   STÄDTE — Positionen für Einheiten
============================================================ */
const CITIES = {
  Berlin:    {lat: 52.52, lng: 13.40, capital: true},
  Hamburg:   {lat: 53.55, lng:  9.99},
  München:   {lat: 48.14, lng: 11.58},
  Warschau:  {lat: 52.23, lng: 21.01, capital: true},
  Krakau:    {lat: 50.06, lng: 19.94},
  Paris:     {lat: 48.86, lng:  2.35, capital: true},
  Lyon:      {lat: 45.76, lng:  4.84},
  London:    {lat: 51.51, lng: -0.13, capital: true},
  Rom:       {lat: 41.90, lng: 12.50, capital: true},
  Mailand:   {lat: 45.46, lng:  9.19},
  Madrid:    {lat: 40.42, lng: -3.70, capital: true},
  Lissabon:  {lat: 38.72, lng: -9.14, capital: true},
  Amsterdam: {lat: 52.37, lng:  4.90, capital: true},
  Brüssel:   {lat: 50.85, lng:  4.35, capital: true},
  Wien:      {lat: 48.21, lng: 16.37, capital: true},
  Prag:      {lat: 50.08, lng: 14.44, capital: true},
  Kopenhagen:{lat: 55.68, lng: 12.57, capital: true},
  Oslo:      {lat: 59.91, lng: 10.75, capital: true},
  Stockholm: {lat: 59.33, lng: 18.07, capital: true},
  Helsinki:  {lat: 60.17, lng: 24.94, capital: true},
  Kiew:      {lat: 50.45, lng: 30.52, capital: true},
  Minsk:     {lat: 53.90, lng: 27.57, capital: true},
  Moskau:    {lat: 55.75, lng: 37.62, capital: true},
  Bukarest:  {lat: 44.43, lng: 26.10, capital: true},
  Budapest:  {lat: 47.50, lng: 19.04, capital: true},
  Belgrad:   {lat: 44.79, lng: 20.45, capital: true},
  Athen:     {lat: 37.98, lng: 23.73, capital: true},
  Sofia:     {lat: 42.70, lng: 23.32, capital: true},
  Istanbul:  {lat: 41.01, lng: 28.98},
  Bern:      {lat: 46.95, lng:  7.45, capital: true},
  Dublin:    {lat: 53.35, lng: -6.26, capital: true},
  Reykjavik: {lat: 64.15, lng:-21.94, capital: true}
};

/* ============================================================
   START-EINHEITEN
============================================================ */
const STARTING_UNITS = [
  // ===== SPIELER (Achse - Deutschland & Verbündete) =====
  {city:'Berlin',    side:'player', type:'armor',      troops:140},
  {city:'Hamburg',   side:'player', type:'infantry',   troops:80},
  {city:'München',   side:'player', type:'mechanized', troops:95},
  {city:'Wien',      side:'player', type:'infantry',   troops:65},
  {city:'Rom',       side:'player', type:'infantry',   troops:70},
  {city:'Mailand',   side:'player', type:'armor',      troops:75},
  {city:'Amsterdam', side:'player', type:'infantry',   troops:40},
  {city:'Brüssel',   side:'player', type:'infantry',   troops:35},
  {city:'Kopenhagen',side:'player', type:'infantry',   troops:30},
  {city:'Oslo',      side:'player', type:'infantry',   troops:35},
  {city:'Stockholm', side:'player', type:'infantry',   troops:45},
  {city:'Helsinki',  side:'player', type:'infantry',   troops:40},
  {city:'Budapest',  side:'player', type:'mechanized', troops:55},

  // ===== FEIND (Alliierte) =====
  {city:'London',    side:'enemy', type:'armor',       troops:110},
  {city:'Dublin',    side:'enemy', type:'infantry',    troops:30},
  {city:'Paris',     side:'enemy', type:'armor',       troops:130},
  {city:'Lyon',      side:'enemy', type:'infantry',    troops:70},
  {city:'Madrid',    side:'enemy', type:'infantry',    troops:80},
  {city:'Lissabon',  side:'enemy', type:'infantry',    troops:40},
  {city:'Bern',      side:'enemy', type:'infantry',    troops:50},
  {city:'Prag',      side:'enemy', type:'infantry',    troops:75},
  {city:'Warschau',  side:'enemy', type:'armor',       troops:120},
  {city:'Krakau',    side:'enemy', type:'infantry',    troops:80},
  {city:'Belgrad',   side:'enemy', type:'infantry',    troops:65},
  {city:'Bukarest',  side:'enemy', type:'mechanized',  troops:85},
  {city:'Sofia',     side:'enemy', type:'infantry',    troops:55},
  {city:'Athen',     side:'enemy', type:'infantry',    troops:60},
  {city:'Istanbul',  side:'enemy', type:'infantry',    troops:70},
  {city:'Minsk',     side:'enemy', type:'armor',       troops:150},
  {city:'Kiew',      side:'enemy', type:'mechanized',  troops:135},
  {city:'Moskau',    side:'enemy', type:'armor',       troops:200}
];

/* ============================================================
   STATE
============================================================ */
const state = {
  units: [],
  unitIdCounter: 0,
  selectedUnit: null,
  targetUnit: null,
  battle: null,
  fronts: [],
  gameOver: false,
  side: 'player' // Spieler-Seite
};

/* ============================================================
   KARTE
============================================================ */
const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  minZoom: 4,
  maxZoom: 9,
  maxBounds: MAP_BOUNDS,
  maxBoundsViscosity: 1.0,
  worldCopyJump: false,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  preferCanvas: true,
  zoomAnimation: true
});
map.setView(MAP_CENTER, 5);

/* ============================================================
   LÄNDER LADEN (dunkle taktische Karte)
============================================================ */
const GEOJSON_URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson";

fetch(GEOJSON_URL)
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      filter: f => f.properties.CONTINENT === "Europe",
      style: () => ({
        color: '#1e3025',
        weight: 1,
        opacity: 0.9,
        fillColor: '#1a2f22',
        fillOpacity: 0.6,
        interactive: false
      })
    }).addTo(map);

    // Zweite Ebene: etwas hellere Highlights
    L.geoJSON(data, {
      filter: f => f.properties.CONTINENT === "Europe",
      style: () => ({
        color: '#2a4435',
        weight: 0.5,
        opacity: 0.4,
        fillColor: '#22392a',
        fillOpacity: 0.35,
        interactive: false
      })
    }).addTo(map);

    addCities();
    addUnits();
    document.getElementById('loading').classList.add('hidden');
    notify("Einheit auswählen");
  })
  .catch(err => {
    console.error(err);
    document.getElementById('loading').textContent = "FEHLER BEIM LADEN";
  });

/* ============================================================
   STÄDTE ZEICHNEN
============================================================ */
function addCities() {
  Object.entries(CITIES).forEach(([name, info]) => {
    const icon = L.divIcon({
      className: 'city-marker',
      html: `<div class="city-icon">
        <div class="city-dot ${info.capital ? 'capital' : ''}"></div>
        <div class="city-name">${name}</div>
      </div>`,
      iconSize: [0, 0],
      iconAnchor: [0, 0]
    });
    L.marker([info.lat, info.lng], { icon, interactive: false }).addTo(map);
  });
}

/* ============================================================
   EINHEITEN ERZEUGEN
============================================================ */
function addUnits() {
  STARTING_UNITS.forEach(u => {
    const city = CITIES[u.city];
    if (!city) return;
    createUnit(u.side, u.type, u.troops, city.lat, city.lng, u.city);
  });
  updateFronts();
}

function createUnit(side, type, troops, lat, lng, cityName) {
  const id = ++state.unitIdCounter;
  const unit = {
    id, side, type, troops, lat, lng, city: cityName,
    maxTroops: troops
  };

  unit.marker = L.marker([lat, lng], {
    icon: makeUnitIcon(unit),
    draggable: false,
    keyboard: false
  }).addTo(map);

  unit.marker.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    onUnitClick(unit);
  });

  state.units.push(unit);
  return unit;
}

function makeUnitIcon(unit) {
  const level = unit.troops > 150 ? 'XXX'
              : unit.troops > 100 ? 'XX'
              : unit.troops > 60  ? 'X'
              : 'III';
  const symbol = NATO_SYMBOLS[unit.type] || NATO_SYMBOLS.infantry;
  const html = `
    <div class="unit-wrapper">
      <div class="unit-strength">${Math.floor(unit.troops)}K</div>
      <div class="unit-rect">${symbol}</div>
      <div class="unit-level">${level}</div>
    </div>`;
  return L.divIcon({
    className: 'unit-marker ' + unit.side,
    html,
    iconSize: [56, 56],
    iconAnchor: [28, 28]
  });
}

function updateUnitIcon(unit) {
  unit.marker.setIcon(makeUnitIcon(unit));
}

/* ============================================================
   KLICK-LOGIK
============================================================ */
function onUnitClick(unit) {
  if (state.battle || state.gameOver) return;

  // Wenn nichts ausgewählt → eigene Einheit auswählen
  if (!state.selectedUnit) {
    if (unit.side !== state.side) {
      showToast("Nur eigene Einheiten", "Wähle eine blaue Einheit aus.", "warning");
      return;
    }
    selectUnit(unit);
    return;
  }

  // Wenn eigene Einheit angeklickt → umwählen
  if (unit.side === state.side) {
    if (unit === state.selectedUnit) {
      deselectUnit();
    } else {
      selectUnit(unit);
    }
    return;
  }

  // Feind angeklickt → Ziel setzen
  state.targetUnit = unit;
  updateTargetable();
  updateAttackBar();
  notify("Ziel: " + unit.city + " (" + unit.side.toUpperCase() + ")");
}

function selectUnit(unit) {
  state.selectedUnit = unit;
  state.targetUnit = null;
  updateSelection();
  updateTargetable();
  updateAttackBar();
  notify("Ausgewählt: " + unit.city + " — jetzt Feind anklicken");
}

function deselectUnit() {
  state.selectedUnit = null;
  state.targetUnit = null;
  updateSelection();
  updateTargetable();
  hideAttackBar();
  notify("Einheit auswählen");
}

function updateSelection() {
  state.units.forEach(u => {
    u.marker.getElement()?.classList.remove('selected');
  });
  if (state.selectedUnit) {
    state.selectedUnit.marker.getElement()?.classList.add('selected');
  }
}

function updateTargetable() {
  const selected = state.selectedUnit;
  // Alle markierungen entfernen
  state.units.forEach(u => {
    u.marker.getElement()?.classList.remove('targetable');
  });

  // Angreifbare Einheiten markieren
  if (!selected) return;
  state.units.forEach(u => {
    if (u.side === state.side) return;
    if (u === selected) return;
    // Nur in Reichweite
    const d = map.distance([selected.lat, selected.lng], [u.lat, u.lng]);
    if (d <= 600000) { // 600 km
      u.marker.getElement()?.classList.add('targetable');
    }
  });
}

/* ============================================================
   ATTACK BAR
============================================================ */
const attackBar = document.getElementById('attackBar');
const attackSlider = document.getElementById('abSlider');

function updateAttackBar() {
  if (!state.selectedUnit || !state.targetUnit) {
    hideAttackBar();
    return;
  }

  const att = state.selectedUnit;
  const def = state.targetUnit;

  document.getElementById('abAttName').textContent = att.city;
  document.getElementById('abAttTroops').textContent = Math.floor(att.troops) + 'K';
  document.getElementById('abDefName').textContent = def.city;
  document.getElementById('abDefTroops').textContent = Math.floor(def.troops) + 'K';

  attackSlider.value = 100;
  attackSlider.disabled = false;
  document.getElementById('abBtn').textContent = '⚔ ANGRIFF';
  document.getElementById('abBtn').disabled = false;
  document.getElementById('abSliderWrap').style.display = 'flex';
  document.getElementById('abProgressWrap').style.display = 'none';

  updateSliderLabels();
  attackBar.classList.remove('hidden');
}

function hideAttackBar() {
  attackBar.classList.add('hidden');
}

function updateSliderLabels() {
  if (!state.selectedUnit || !state.targetUnit) return;
  const att = state.selectedUnit;
  const def = state.targetUnit;

  const pct = parseInt(attackSlider.value);
  const send = Math.floor(att.troops * pct / 100);
  const remain = Math.floor(att.troops) - send;

  document.getElementById('abSend').textContent = send + 'K';
  document.getElementById('abRemain').textContent = remain + 'K';

  const ratio = send / (def.troops || 1);
  let label;
  if (ratio > 1.5) label = '🟢 ÜBERLEGEN';
  else if (ratio > 1.05) label = '🟡 KNAPP';
  else if (ratio > 0.9) label = '🟠 AUSGEGLICHEN';
  else label = '🔴 UNTERLEGEN';
  document.getElementById('abRatio').textContent = label;
}

attackSlider.addEventListener('input', updateSliderLabels);

document.getElementById('abBtn').addEventListener('click', () => {
  if (state.battle) return;
  if (!state.selectedUnit || !state.targetUnit) return;
  startBattle();
});

/* ============================================================
   SCHLACHT
============================================================ */
function startBattle() {
  const att = state.selectedUnit;
  const def = state.targetUnit;
  const pct = parseInt(attackSlider.value);
  const send = Math.floor(att.troops * pct / 100);

  if (send < 1) {
    showToast("Zu wenig Truppen", "Mindestens 1K senden.", "warning");
    return;
  }

  att.troops -= send;

  state.battle = {
    attacker: att,
    defender: def,
    attTroops: send,
    defTroops: def.troops,
    initialAtt: send,
    initialDef: def.troops,
    progress: 0,
    lastTick: performance.now()
  };

  // UI wechselt in Schlacht-Modus
  attackSlider.disabled = true;
  document.getElementById('abBtn').disabled = true;
  document.getElementById('abBtn').textContent = '⚔ SCHLACHT';
  document.getElementById('abSliderWrap').style.display = 'none';
  document.getElementById('abProgressWrap').style.display = 'flex';

  // Markierungen
  att.marker.getElement()?.classList.add('in-battle');
  def.marker.getElement()?.classList.add('in-battle');

  // Kamera folgt
  const midLat = (att.lat + def.lat) / 2;
  const midLng = (att.lng + def.lng) / 2;
  map.flyTo([midLat, midLng], Math.max(6, map.getZoom()), { duration: 0.8 });

  updateFrontLines();
  requestAnimationFrame(battleLoop);

  notify("⚔ SCHLACHT um " + def.city.toUpperCase());
}

function battleLoop(now) {
  const b = state.battle;
  if (!b) return;

  const dt = Math.min(0.05, (now - b.lastTick) / 1000);
  b.lastTick = now;

  // Truppenverluste proportional
  b.attTroops = Math.max(0, b.attTroops - b.defTroops * 0.05 * dt);
  b.defTroops = Math.max(0, b.defTroops - b.attTroops * 0.05 * dt);

  b.progress = 1 - b.defTroops / b.initialDef;

  // UI Updates
  document.getElementById('abAttTroops').textContent = Math.floor(b.attTroops) + 'K';
  document.getElementById('abDefTroops').textContent = Math.floor(b.defTroops) + 'K';
  const pct = Math.round(b.progress * 100);
  document.getElementById('abProgressFill').style.width = pct + '%';
  document.getElementById('abProgressText').textContent = 'SCHLACHT — ' + pct + '%';

  // Einheiten-Truppen aktualisieren
  b.attacker.troops = b.attTroops;
  b.defender.troops = b.defTroops;
  updateUnitIcon(b.attacker);
  updateUnitIcon(b.defender);

  // Frontbewegung während Schlacht
  updateFrontLines();

  // Ende?
  if (b.defTroops <= 0.5) { endBattle(true); return; }
  if (b.attTroops <= 0.5) { endBattle(false); return; }

  requestAnimationFrame(battleLoop);
}

function endBattle(attackerWon) {
  const b = state.battle;
  if (!b) return;

  const att = b.attacker;
  const def = b.defender;

  // Markierungen entfernen
  att.marker.getElement()?.classList.remove('in-battle');
  def.marker.getElement()?.classList.remove('in-battle');

  if (attackerWon) {
    // Verteidiger entfernen
    removeUnit(def);

    // Angreifer zieht in die Stadt
    att.lat = def.lat;
    att.lng = def.lng;
    att.city = def.city;
    att.troops = b.attTroops;
    att.marker.setLatLng([att.lat, att.lng]);
    updateUnitIcon(att);

    showToast("SIEG", att.city + " eingenommen! " + Math.floor(b.attTroops) + "K stationiert.", "success", 5000);
    notify("🏆 " + def.city + " erobert!");
  } else {
    // Verteidiger überlebt
    def.troops = b.defTroops;
    att.troops = b.attTroops;
    updateUnitIcon(att);
    updateUnitIcon(def);

    showToast("NIEDERLAGE", def.city + " hält stand.", "error", 5000);
    notify("💀 " + def.city + " nicht eingenommen!");
  }

  state.battle = null;

  // UI zurücksetzen
  document.getElementById('abSliderWrap').style.display = 'flex';
  document.getElementById('abProgressWrap').style.display = 'none';
  document.getElementById('abProgressFill').style.width = '0%';
  attackSlider.disabled = false;
  document.getElementById('abBtn').disabled = false;

  // Auswahl aufheben
  if (attackerWon) {
    state.selectedUnit = null;
    state.targetUnit = null;
    hideAttackBar();
  } else {
    state.targetUnit = null;
  }

  updateSelection();
  updateTargetable();
  updateFronts();
  updateStats();

  // Kamera zurück
  setTimeout(() => {
    map.flyTo(MAP_CENTER, 5, { duration: 1 });
  }, 800);
}

function removeUnit(unit) {
  map.removeLayer(unit.marker);
  state.units = state.units.filter(u => u !== unit);
}

/* ============================================================
   FRONTLINIEN
============================================================ */
let frontLayers = [];

function updateFronts() {
  // Alle alten Fronten löschen
  frontLayers.forEach(l => map.removeLayer(l));
  frontLayers = [];

  // Für jedes Paar gegnerischer Einheiten in Reichweite eine Frontlinie zeichnen
  const processed = new Set();

  for (let i = 0; i < state.units.length; i++) {
    const a = state.units[i];
    for (let j = i + 1; j < state.units.length; j++) {
      const b = state.units[j];
      if (a.side === b.side) continue;

      const key = Math.min(a.id, b.id) + '-' + Math.max(a.id, b.id);
      if (processed.has(key)) continue;
      processed.add(key);

      const d = map.distance([a.lat, a.lng], [b.lat, b.lng]);
      if (d > 600000) continue; // 600 km Reichweite

      // Frontlinie: senkrechte Linie zwischen den beiden Einheiten
      const midLat = (a.lat + b.lat) / 2;
      const midLng = (a.lng + b.lng) / 2;

      const dLng = b.lng - a.lng;
      const dLat = b.lat - a.lat;
      const len = Math.sqrt(dLng*dLng + dLat*dLat) || 1;
      const px = -dLat / len;
      const py = dLng / len;

      const perpLength = 0.8; // Grad
      const p1 = [midLat + px * perpLength, midLng + py * perpLength];
      const p2 = [midLat - px * perpLength, midLng - py * perpLength];

      const line = L.polyline([p1, p2], {
        color: '#ffd54f',
        weight: 2,
        opacity: 0.5,
        dashArray: '6,6',
        interactive: false
      }).addTo(map);

      frontLayers.push(line);
    }
  }

  state.fronts = frontLayers.length;
  updateStats();
}

/* ============================================================
   STATS
============================================================ */
function updateStats() {
  const playerTroops = state.units
    .filter(u => u.side === 'player')
    .reduce((s, u) => s + u.troops, 0);
  const enemyTroops = state.units
    .filter(u => u.side === 'enemy')
    .reduce((s, u) => s + u.troops, 0);

  document.getElementById('statPlayer').textContent = Math.floor(playerTroops) + 'K';
  document.getElementById('statEnemy').textContent = Math.floor(enemyTroops) + 'K';
  document.getElementById('statFronts').textContent = state.fronts;
}

/* ============================================================
   MAP CONTROLS
============================================================ */
function zoomMap(dir) {
  dir > 0 ? map.zoomIn(0.5) : map.zoomOut(0.5);
}
function resetMap() {
  map.flyTo(MAP_CENTER, 5, { duration: 0.8 });
}

/* ============================================================
   TOASTS / NOTIFY
============================================================ */
function notify(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0.7'; }, 3000);
}

function showToast(title, message, type = 'info', duration = 3500) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'toast' + (type !== 'info' ? ' ' + type : '');
  toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${message}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ============================================================
   RESSOURCEN-PRODUKTION (alle 3 Sekunden etwas Truppen aufstocken)
============================================================ */
setInterval(() => {
  if (state.gameOver || state.battle) return;
  state.units.forEach(u => {
    // Alle Einheiten erhalten leichten Nachschub
    const rate = u.side === 'player' ? 0.3 : 0.25;
    u.troops += rate;
    if (u.troops > u.maxTroops * 1.5) u.troops = u.maxTroops * 1.5;
    updateUnitIcon(u);
  });
  updateStats();
}, 3000);

/* ============================================================
   START
============================================================ */
updateStats();
</script>
