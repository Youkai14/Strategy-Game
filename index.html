/* =========================================================
   FORMAT
========================================================= */

function format(number){

    number = Math.floor(Number(number) || 0);

    if(number >= 1000000000)
        return (number / 1000000000).toFixed(1)+"B";

    if(number >= 1000000)
        return (number / 1000000).toFixed(1)+"M";

    if(number >= 1000)
        return (number / 1000).toFixed(1)+"K";

    return number.toLocaleString("de-DE");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimeout = null;

function showToast(message){

    const toast = document.getElementById("toast");

    if(!toast)
        return;

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(()=>{

        toast.style.display = "none";

    },3000);

}

/* =========================================================
   LOAD GAME
========================================================= */

function loadGame(){

    const save = localStorage.getItem("ironNationsSave");

    if(!save){

        showToast("📂 No saved game.");

        return;

    }

    try{

        const data = JSON.parse(save);

        if(
            !data ||
            !data.player ||
            !data.player.nation
        ){

            throw new Error("Invalid save");

        }

        player = data.player;

        year = data.year || 1936;
        month = data.month || 1;

        conquered = data.conquered || {};
        wars = data.wars || [];

        selected = player.nation;

        closeModal();
        showGame();

        updateUI();
        updateMap();
        redrawWars();

        showToast("📂 Game loaded");

    }
    catch(error){

        console.error(error);

        showToast(
            "❌ Save could not be loaded."
        );

    }

}


/* =========================================================
   SAVE GAME
========================================================= */

function saveGame(){

    if(!player.nation){

        showToast("No game to save.");
        return;

    }

    const saveData = {

        player:player,

        year:year,

        month:month,

        conquered:conquered,

        wars:wars

    };

    localStorage.setItem(
        "ironNationsSave",
        JSON.stringify(saveData)
    );

    showToast("💾 Game saved");


}

function stopGame(){

    }

}


/* =========================================================
   GAME TIME
========================================================= */

function setSpeed(value, button){

    speed = value;

    document
        .querySelectorAll(".speedBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(button)
        button.classList.add("active");

    if(timer){

        clearInterval(timer);
        timer = null;

    }

    if(speed === 0)
        return;

    timer = setInterval(

        advanceMonth,

        3500 / speed

    );

}


/* =========================================================
   ADVANCE MONTH
========================================================= */

function advanceMonth(){

    if(!player.nation)
        return;

    month++;

    if(month > 12){

        month = 1;
        year++;

    }


    /* ECONOMY */

    const factoryIncome =
        player.factories * 5;

    player.money +=
        player.income +
        factoryIncome;


    /* MANPOWER */

    player.manpower += Math.floor(
        player.population * 0.00008
    );


    /* RESEARCH */

    player.research += Math.max(
        1,
        Math.floor(player.factories * 0.12)
    );

    if(player.research > 100)
        player.research = 100;


    /* WAR */

    wars.forEach(war=>{

        if(war.active)
            battle(war);

    });


    updateUI();
    updateMap();

}


/* =========================================================
   BATTLE
========================================================= */

function battle(war){

    if(!war.active)
        return;

    if(player.army <= 0){

        war.active = false;
        removeWarGraphics(war);

        return;

    }

    if(war.enemyArmy <= 0){

        victory(war);
        return;

    }


    const myPower =
        player.army *
        (1 + player.technology * 0.10);


    const enemyPower =
        war.enemyArmy *
        (1 + war.enemyTechnology * 0.05);


    const ratio =
        myPower /
        (myPower + enemyPower);


    const totalCasualties =
        Math.floor(
            1200 +
            Math.random()*1800
        );


    let myLoss =
        Math.floor(
            totalCasualties *
            (1-ratio) *
            .85
        );


    let enemyLoss =
        Math.floor(
            totalCasualties *
            ratio
        );


    myLoss = Math.max(20,myLoss);
    enemyLoss = Math.max(20,enemyLoss);


    player.army = Math.max(
        0,
        player.army - myLoss
    );


    war.enemyArmy = Math.max(
        0,
        war.enemyArmy - enemyLoss
    );


    war.myLosses += myLoss;
    war.enemyLosses += enemyLoss;


    /*
       FRONT MOVEMENT

       Stronger armies advance faster.
    */

    let movement =
        (ratio - 0.5) * 5;


    movement +=
        (Math.random()-0.5)*0.8;


    war.progress += movement;


    war.progress =
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    drawWar(war);


    if(war.enemyArmy <= 0){

        victory(war);
        return;

    }


    if(player.army <= 0){

        war.active = false;

        removeWarGraphics(war);

        showToast(
            "💀 Your army was destroyed."
        );

    }

}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(iso){

    if(!countries[iso])
        return;

    if(iso === player.nation){

        showToast("You cannot declare war on yourself.");
        return;

    }


    const existing =
        wars.find(
            war =>
            war.active &&
            war.enemy === iso
        );


    if(existing){

        showToast("You are already at war.");
        showWar(existing);

        return;

    }


    const enemy = countries[iso];


    const war = {

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };


    wars.push(war);


    drawWar(war);

    updateMap();

    showToast(
        `⚔️ War against ${enemy.flag} ${enemy.name}`
    );

}


/* =========================================================
   VICTORY
========================================================= */

function victory(war){

    war.active = false;

    conquered[war.enemy] = true;


    const enemy =
        countries[war.enemy];


    player.factories += Math.max(
        1,
        Math.floor(enemy.factories * 0.20)
    );


    player.income += Math.max(
        10,
        Math.floor(enemy.income * 0.40)
    );


    removeWarGraphics(war);

    updateMap();
    updateUI();


    showToast(
        `🏳️ ${enemy.flag} ${enemy.name} defeated`
    );

}


/* =========================================================
   MAP
========================================================= */

let svg = null;
let countryLayer = null;
let frontLayer = null;
let armyLayer = null;
let labelLayer = null;
let capitalLayer = null;

let projection = null;
let path = null;


/* =========================================================
   INIT MAP
========================================================= */

function initMap(){

    if(typeof d3 === "undefined"){

        console.error("D3 is missing!");
        showToast("❌ Map engine missing.");
        return;

    }


    svg = d3.select("#world");

    countryLayer =
        d3.select("#countriesLayer");

    frontLayer =
        d3.select("#frontLayer");

    armyLayer =
        d3.select("#armyLayer");

    labelLayer =
        d3.select("#labelLayer");

    capitalLayer =
        d3.select("#capitalLayer");


    projection =
        d3.geoNaturalEarth1();


    path =
        d3.geoPath()
        .projection(projection);


    setupMapControls();


    fetch(
        "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
    )
    .then(response=>{

        if(!response.ok)
            throw new Error("Map request failed");

        return response.json();

    })
    .then(world=>{

        projection.fitExtent(
            [[10,10],[1190,640]],
            world
        );


        countryLayer
            .selectAll("path")
            .data(world.features)
            .enter()
            .append("path")
            .attr("class","land neutralLand")
            .attr("d",path)
            .attr(
                "data-iso",
                d=>getISO(d)
            )
            .on("click",(event,d)=>{

                const iso =
                    getISO(d);

                if(countries[iso])
                    selectCountry(iso);

            });


        drawLabels();
        drawCapitals();


        mapReady = true;

        updateMap();
        redrawWars();

    })
    .catch(error=>{

        console.error(error);

        showToast(
            "⚠️ World map could not load."
        );

    });

}


/* =========================================================
   GET ISO
========================================================= */

function getISO(feature){

    if(!feature || !feature.properties)
        return "";

    return (
        feature.properties.ADM0_A3 ||
        feature.properties.ISO_A3 ||
        feature.properties.SOV_A3 ||
        ""
    );

}


/* =========================================================
   UPDATE MAP
========================================================= */

function updateMap(){

    if(!countryLayer)
        return;


    countryLayer
        .selectAll("path")
        .each(function(feature){

            const iso =
                getISO(feature);


            let className =
                "land neutralLand";


            if(iso === player.nation)
                className =
                    "land playerLand";


            if(conquered[iso])
                className =
                    "land conqueredLand";


            const atWar =
                wars.some(
                    war =>
                    war.active &&
                    war.enemy === iso
                );


            if(atWar)
                className =
                    "land enemyLand";


            if(selected === iso)
                className =
                    "land selectedLand";


            d3.select(this)
                .attr(
                    "class",
                    className
                );

        });

}


/* =========================================================
   LABELS
========================================================= */

function drawLabels(){

    if(!labelLayer)
        return;


    labelLayer
        .selectAll("*")
        .remove();


    Object.entries(countries)
    .forEach(([iso,country])=>{

        const p =
            projection(country.pos);


        if(!p)
            return;


        const group =
            labelLayer
            .append("g");


        group
            .append("text")
            .attr("class","flagLabel")
            .attr("x",p[0])
            .attr("y",p[1]-8)
            .text(country.flag);


        group
            .append("text")
            .attr("class","countryLabel")
            .attr("x",p[0])
            .attr("y",p[1]+13)
            .text(country.name);

    });

}


/* =========================================================
   CAPITALS
========================================================= */

function drawCapitals(){

    if(!capitalLayer)
        return;


    capitalLayer
        .selectAll("*")
        .remove();


    Object.entries(countries)
    .forEach(([iso,country])=>{

        const p =
            projection(country.pos);


        if(!p)
            return;


        const group =
            capitalLayer
            .append("g");


        group
            .append("circle")
            .attr("class","capital")
            .attr("cx",p[0])
            .attr("cy",p[1])
            .attr("r",3);


        group
            .append("text")
            .attr("class","capitalText")
            .attr("x",p[0]+6)
            .attr("y",p[1]+3)
            .text(country.capital);

    });

}


/* =========================================================
   POSITION
========================================================= */

function getPosition(iso){

    const country =
        countries[iso];

    if(!country)
        return [600,330];


    return projection(country.pos);

}


/* =========================================================
   DRAW WAR
========================================================= */

function drawWar(war){

    if(!mapReady)
        return;


    removeWarGraphics(war);


    const start =
        getPosition(player.nation);


    const end =
        getPosition(war.enemy);


    const progress =
        war.progress / 100;


    /*
       Army moves along front.
    */

    const fx =
        start[0] +
        (end[0]-start[0]) *
        (0.12 + progress*0.76);


    const fy =
        start[1] +
        (end[1]-start[1]) *
        (0.12 + progress*0.76);


    const dx =
        end[0]-start[0];


    const dy =
        end[1]-start[1];


    const length =
        Math.sqrt(
            dx*dx+
            dy*dy
        ) || 1;


    const px =
        -dy/length;


    const py =
        dx/length;


    const frontLength = 45;


    const x1 =
        fx + px*frontLength;


    const y1 =
        fy + py*frontLength;


    const x2 =
        fx - px*frontLength;


    const y2 =
        fy - py*frontLength;


    /* GLOW */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontGlow")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /* FRONT */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontLine")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /* ARMY */

    const group =
        armyLayer
        .append("g")
        .attr(
            "data-war",
            war.id
        )
        .attr(
            "class",
            "armyGroup"
        )
        .attr(
            "transform",
            `translate(${fx},${fy})`
        )
        .on(
            "click",
            ()=>showWar(war)
        );


    group
        .append("circle")
        .attr("class","armyCircle")
        .attr("r",22);


    group
        .append("text")
        .attr("class","armyIcon")
        .attr("y",-6)
        .text("🪖");


    group
        .append("text")
        .attr("class","armyNumber")
        .attr("y",10)
        .text(format(war.enemyArmy));


    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","battleIcon")
        .attr("x",fx)
        .attr("y",fy-35)
        .text("⚔️");

}

function removeWarGraphics(war){

    if(!frontLayer || !armyLayer)
        return;


    frontLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();


    armyLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();

}


/* =========================================================
   REDRAW WARS
========================================================= */

function redrawWars(){

    if(!mapReady)
        return;


    frontLayer.selectAll("*").remove();
    armyLayer.selectAll("*").remove();


    wars.forEach(war=>{

        if(war.active)
            drawWar(war);

    });

}

    rightPanel.style.display = "block";


    const war =

            w =>

            w.enemy === iso

        : country.army;

/* =========================================================
   MAP CONTROLS
========================================================= */

let zoom = 1;

let offsetX = 0;
let offsetY = 0;

let dragging = false;

let lastX = 0;
let lastY = 0;


function setupMapControls(){

    if(!svg)
        return;


    svg.on("wheel",function(event){

        event.preventDefault();


        const oldZoom = zoom;


        zoom +=
            event.deltaY > 0
            ? -0.12
            : 0.12;


        zoom =
            Math.max(
                0.75,
                Math.min(
                    3,
                    zoom
                )
            );


        const rect =
            document
            .getElementById("world")
            .getBoundingClientRect();


        const mouseX =
            event.clientX -
            rect.left;


        const mouseY =
            event.clientY -
            rect.top;


        offsetX -=
            (mouseX-offsetX) *
            (zoom/oldZoom-1);


        offsetY -=
            (mouseY-offsetY) *
            (zoom/oldZoom-1);


        applyMapTransform();

    });


    svg.on("mousedown",function(event){

        dragging = true;

        lastX = event.clientX;
        lastY = event.clientY;

    });


    window.addEventListener(
        "mouseup",
        function(){

            dragging = false;

        }
    );


    window.addEventListener(
        "mousemove",
        function(event){

            if(!dragging)
                return;


            offsetX +=
                event.clientX-lastX;


            offsetY +=
                event.clientY-lastY;


            lastX =
                event.clientX;


            lastY =
                event.clientY;


            applyMapTransform();

        }
    );

}


function applyMapTransform(){

    const transform =
        `translate(${offsetX} ${offsetY}) scale(${zoom})`;


    if(countryLayer)
        countryLayer.attr(
            "transform",
            transform
        );


    if(frontLayer)
        frontLayer.attr(
            "transform",
            transform
        );


    if(armyLayer)
        armyLayer.attr(
            "transform",
            transform
        );


    if(labelLayer)
        labelLayer.attr(
            "transform",
            transform
        );


    if(capitalLayer)
        capitalLayer.attr(
            "transform",
            transform
        );

}
