<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IRON NATIONS</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#7fa9c1;
    color:#222;
}

/* =========================================================
   START
========================================================= */

#start{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(22,32,34,.35),
            rgba(22,32,34,.65)
        ),
        #30434a;
}

.startBox{
    width:470px;
    max-width:92%;
    padding:42px;

    background:#d8d3b8;

    border:4px solid #45483c;
    border-radius:4px;

    box-shadow:
        0 15px 40px #0008;

    text-align:center;
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:5px;
    color:#282b25;

    text-shadow:
        2px 2px 0 #eee7ca;
}

.subtitle{
    margin:12px 0 30px;
    color:#5f6254;
}

.startButton{
    width:100%;
    padding:14px;
    margin-top:10px;

    border:2px solid #565a4b;
    border-radius:3px;

    background:#879c6d;
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 3px 0 #4f5942;
}

.startButton:hover{
    background:#9db783;
}

/* =========================================================
   GAME
========================================================= */

#game{
    display:none;

    position:fixed;
    inset:0;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:64px;

    z-index:200;

    display:flex;
    align-items:center;
    gap:22px;

    padding:8px 16px;

    background:#272d27;
    color:#eee8cf;

    border-bottom:3px solid #171b17;

    box-shadow:
        0 3px 10px #0006;
}

.gameTitle{
    font-weight:900;
    letter-spacing:3px;
    font-size:18px;

    margin-right:10px;
}

.stat{
    display:flex;
    flex-direction:column;
    min-width:75px;
}

.stat small{
    color:#9da594;
    font-size:9px;
}

.stat b{
    color:#eee8cf;
    font-size:13px;
    margin-top:2px;
}

.date{
    margin-left:auto;
    font-weight:bold;
    color:#eee8cf;
}

.speedBox{
    display:flex;
    gap:3px;
}

.speedBtn{
    border:1px solid #596052;
    background:#394036;
    color:#e8e4ce;

    padding:7px 10px;

    border-radius:2px;
    cursor:pointer;
}

.speedBtn:hover,
.speedBtn.active{
    background:#83966b;
}

/* =========================================================
   LEFT MENU
========================================================= */

.leftbar{
    position:absolute;

    left:12px;
    top:76px;

    z-index:150;

    width:155px;

    display:flex;
    flex-direction:column;
    gap:6px;
}

.menuBtn{
    border:2px solid #666957;

    background:#d4d0b5;
    color:#303329;

    padding:9px 11px;

    border-radius:2px;

    cursor:pointer;
    text-align:left;

    font-weight:bold;

    box-shadow:
        0 2px 4px #0004;
}

.menuBtn:hover{
    background:#e3dfc4;
}

/* =========================================================
   MAP
========================================================= */

#mapContainer{
    position:absolute;
    inset:64px 0 0;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #a9c4c0,
            #d7d4b9 48%,
            #9fbea7
        );
}

#world{
    width:100%;
    height:100%;

    cursor:grab;

    display:block;
}

#world.dragging{
    cursor:grabbing;
}

/* =========================================================
   MAP COLORS
========================================================= */

.land{
    stroke:#878878;
    stroke-width:1;

    vector-effect:non-scaling-stroke;

    transition:
        fill .15s;
}

.neutralLand{
    fill:#d6d4b9;
}

.playerLand{
    fill:#78a45d;
}

.enemyLand{
    fill:#b97465;
}

.conqueredLand{
    fill:#78a45d;
}

.selectedLand{
    fill:#91b86e;

    stroke:#34382d;
    stroke-width:2;

    vector-effect:non-scaling-stroke;
}

/* =========================================================
   WATER
========================================================= */

.water{
    fill:#5f98b8;
}

/* =========================================================
   COUNTRY LABELS
========================================================= */

.countryLabel{
    pointer-events:none;
}

.countryName{
    font-size:14px;
    font-weight:900;

    fill:#394133;

    paint-order:stroke;
    stroke:#d9d7bb;
    stroke-width:4px;
    stroke-linejoin:round;
}

.countryArmy{
    font-size:10px;
    font-weight:bold;

    fill:#48503d;

    paint-order:stroke;
    stroke:#d9d7bb;
    stroke-width:3px;
}

/* =========================================================
   OCCUPATION
========================================================= */

.occupiedTerritory{
    fill:#d45e54;
    opacity:.48;

    pointer-events:none;
}

.occupationFront{
    stroke:#fff3d8;
    stroke-width:2;

    stroke-dasharray:6 4;

    pointer-events:none;

    vector-effect:non-scaling-stroke;
}

/* =========================================================
   FRONT
========================================================= */

.frontGlow{
    stroke:#d72e2e;
    stroke-width:12;

    opacity:.15;

    pointer-events:none;

    vector-effect:non-scaling-stroke;
}

.frontLine{
    stroke:#a82b2b;
    stroke-width:3;

    stroke-dasharray:8 5;

    pointer-events:none;

    vector-effect:non-scaling-stroke;
}

.frontDot{
    fill:#c73535;
    stroke:#f4e9cf;
    stroke-width:1;

    vector-effect:non-scaling-stroke;
}

/* =========================================================
   ARMY
========================================================= */

.armyGroup{
    cursor:pointer;
}

.armyCircle{
    fill:#ded9bd;

    stroke:#4c5144;
    stroke-width:2;

    vector-effect:non-scaling-stroke;
}

.armyIcon{
    font-size:16px;

    text-anchor:middle;
}

.armyNumber{
    fill:#292d26;

    font-size:10px;
    font-weight:900;

    text-anchor:middle;
}

.battleIcon{
    fill:#8e2929;

    font-size:10px;
    font-weight:bold;

    text-anchor:middle;

    pointer-events:none;

    paint-order:stroke;
    stroke:#e0dcc0;
    stroke-width:3px;
}

.frontProgress{
    fill:#363b30;

    font-size:10px;
    font-weight:900;

    text-anchor:middle;

    pointer-events:none;

    paint-order:stroke;
    stroke:#d8d4b9;
    stroke-width:3px;
}

/* =========================================================
   RIGHT PANEL
========================================================= */

#right{
    display:none;

    position:absolute;

    right:14px;
    top:78px;

    width:280px;

    z-index:180;

    background:#d8d4b9;

    border:3px solid #55594b;
    border-radius:3px;

    padding:14px;

    box-shadow:
        0 10px 30px #0007;
}

.header{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:12px;

    padding-bottom:10px;

    border-bottom:2px solid #aaa991;
}

.flag{
    font-size:32px;
}

.name{
    font-weight:900;
    font-size:16px;
    color:#30342a;
}

.tag{
    color:#6b705f;
    font-size:10px;
}

.row{
    display:flex;
    justify-content:space-between;

    padding:7px 0;

    border-bottom:1px solid #b8b49b;

    color:#4d5145;
}

.row b{
    color:#292d25;
}

.action{
    width:100%;

    margin-top:10px;

    padding:10px;

    border:2px solid #58604e;

    border-radius:2px;

    background:#7f9c65;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.action:hover{
    background:#94ad78;
}

.warBtn{
    background:#a84c4c;
    border-color:#713838;
}

.warBtn:hover{
    background:#bf5d5d;
}

/* =========================================================
   BOXES
========================================================= */

.armyBox,
.frontBox{
    background:#c9c6aa;

    border:2px solid #aaa991;

    border-radius:2px;

    padding:11px;

    margin:9px 0;
}

.armyTitle{
    color:#666b5c;
    font-size:10px;
}

.armyNumber{
    font-size:20px;
    font-weight:900;

    margin-top:3px;

    color:#30342a;
}

.bar{
    height:8px;

    background:#9e9c89;

    overflow:hidden;

    margin-top:8px;
}

.fill{
    height:100%;
    background:#6e9658;
}

.redFill{
    background:#bd4f4f;
}

.bigFront{
    font-size:30px;
    text-align:center;

    margin-bottom:4px;
}

/* =========================================================
   MODAL
========================================================= */

#overlay{
    display:none;

    position:fixed;
    inset:0;

    z-index:500;

    background:#0008;

    align-items:center;
    justify-content:center;
}

.modal{
    width:700px;
    max-width:92vw;
    max-height:85vh;

    overflow:auto;

    padding:24px;

    background:#d8d4b9;

    border:3px solid #55594b;

    box-shadow:
        0 20px 60px #000;

    color:#30342a;
}

.close{
    float:right;

    border:2px solid #656957;

    background:#c4c1a7;

    color:#34372d;

    border-radius:2px;

    padding:4px 9px;

    cursor:pointer;
}

/* =========================================================
   COUNTRY GRID
========================================================= */

.countryGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;
}

.country{
    display:flex;
    align-items:center;
    gap:10px;

    padding:9px;

    background:#c9c6aa;

    border:2px solid #aaa991;

    cursor:pointer;
}

.country:hover{
    background:#ded9bd;
}

.countryFlag{
    font-size:25px;
}

.countryName{
    font-weight:bold;
}

.countryPower{
    color:#6d725f;
    font-size:10px;
    margin-top:2px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
    display:none;

    position:fixed;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    z-index:900;

    background:#292e28;

    color:#eee8cf;

    border:2px solid #5b6253;

    padding:10px 17px;

    border-radius:2px;

    box-shadow:
        0 6px 20px #0008;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .stat{
        display:none;
    }

    .gameTitle{
        font-size:13px;
    }

    #right{
        width:230px;
    }

    .leftbar{
        width:130px;
    }

    .countryGrid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="start">

    <div class="startBox">

        <div class="logo">
            IRON NATIONS
        </div>

        <div class="subtitle">
            Build your nation. Research. Fight. Conquer.
        </div>

        <button class="startButton"
                onclick="newGame()">
            🌍 NEW GAME
        </button>

        <button class="startButton"
                onclick="loadGame()">
            📂 LOAD GAME
        </button>

        <button class="startButton"
                onclick="settings()">
            ⚙️ SETTINGS
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="game">

    <div class="topbar">

        <div class="gameTitle">
            IRON NATIONS
        </div>

        <div class="stat">
            <small>💰 MONEY</small>
            <b id="money">0</b>
        </div>

        <div class="stat">
            <small>👥 POPULATION</small>
            <b id="population">0</b>
        </div>

        <div class="stat">
            <small>🪖 ARMY</small>
            <b id="army">0</b>
        </div>

        <div class="stat">
            <small>👨 MANPOWER</small>
            <b id="manpower">0</b>
        </div>

        <div class="stat">
            <small>🏭 FACTORIES</small>
            <b id="factories">0</b>
        </div>

        <div class="date"
             id="date">
            January 1936
        </div>

        <div class="speedBox">

            <button class="speedBtn active"
                    onclick="setSpeed(0,this)">
                ⏸
            </button>

            <button class="speedBtn"
                    onclick="setSpeed(1,this)">
                ▶
            </button>

            <button class="speedBtn"
                    onclick="setSpeed(2,this)">
                ▶▶
            </button>

            <button class="speedBtn"
                    onclick="setSpeed(4,this)">
                ▶▶▶
            </button>

        </div>

    </div>


    <!-- =================================================
         LEFT MENU
    ================================================= -->

    <div class="leftbar">

        <button class="menuBtn"
                onclick="openNations()">
            🌍 Nations
        </button>

        <button class="menuBtn"
                onclick="openArmy()">
            🪖 Army
        </button>

        <button class="menuBtn"
                onclick="construction()">
            🏭 Construction
        </button>

        <button class="menuBtn"
                onclick="research()">
            🔬 Research
        </button>

        <button class="menuBtn"
                onclick="diplomacy()">
            🤝 Diplomacy
        </button>

        <button class="menuBtn"
                onclick="taxes()">
            💰 Collect Taxes
        </button>

        <button class="menuBtn"
                onclick="saveGame()">
            💾 Save
        </button>

        <button class="menuBtn"
                onclick="mainMenu()">
            🏠 Main Menu
        </button>

    </div>


    <!-- =================================================
         MAP
    ================================================= -->

    <div id="mapContainer">

        <svg id="world"
             viewBox="0 0 1200 650"
             preserveAspectRatio="xMidYMid slice">

            <defs id="defs"></defs>

            <g id="countriesLayer"></g>

            <g id="occupationLayer"></g>

            <g id="frontLayer"></g>

            <g id="armyLayer"></g>

            <g id="labelLayer"></g>

        </svg>

    </div>


    <!-- =================================================
         RIGHT COUNTRY PANEL
    ================================================= -->

    <div id="right"></div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="overlay">

    <div class="modal">

        <button class="close"
                onclick="closeModal()">
            ✕
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   COUNTRIES
========================================================= */

const countries={

    DEU:{
        name:"Germany",
        flag:"🇩🇪",
        army:100000,
        pop:69000000,
        manpower:1200000,
        factories:35,
        money:2500,
        income:250,
        pos:[10,51]
    },

    POL:{
        name:"Poland",
        flag:"🇵🇱",
        army:50000,
        pop:34000000,
        manpower:650000,
        factories:18,
        money:1500,
        income:120,
        pos:[19,52]
    },

    FRA:{
        name:"France",
        flag:"🇫🇷",
        army:85000,
        pop:41000000,
        manpower:800000,

        pos:[2,46]
    },

    GBR:{
        name:"United Kingdom",
        flag:"🇬🇧",
        army:90000,
        pop:48000000,
        manpower:900000,
        factories:40,

        income:280,
        pos:[-2,54]
    },

    ITA:{
        name:"Italy",
        flag:"🇮🇹",
        army:75000,
        pop:44000000,
        manpower:850000,
        factories:25,
        money:2000,
        income:180,
        pos:[12,42]
    },

    ESP:{
        name:"Spain",
        flag:"🇪🇸",
        army:45000,
        pop:25000000,
        manpower:500000,
        factories:14,
        money:1300,
        income:100,
        pos:[-4,40]
    },

    RUS:{
        name:"Russia",
        flag:"🇷🇺",
        army:180000,
        pop:108000000,
        manpower:2500000,
        factories:55,
        money:3500,
        income:300,
        pos:[37,56]
    },

    UKR:{
        name:"Ukraine",
        flag:"🇺🇦",
        army:65000,
        pop:30000000,
        manpower:700000,
        factories:20,
        money:1600,
        income:130,
        pos:[32,49]
    },

    TUR:{
        name:"Turkey",
        flag:"🇹🇷",
        army:70000,
        pop:35000000,
        manpower:750000,
        factories:20,
        money:1800,
        income:150,
        pos:[35,39]
    },

    SWE:{
        name:"Sweden",
        flag:"🇸🇪",
        army:35000,
        pop:6000000,
        manpower:180000,
        factories:14,
        money:1600,
        income:130,
        pos:[15,62]
    },

    NOR:{
        name:"Norway",
        flag:"🇳🇴",
        army:22000,
        pop:3000000,
        manpower:90000,
        factories:8,
        money:1300,
        income:90,
        pos:[12,65]
    },

    FIN:{
        name:"Finland",
        flag:"🇫🇮",
        army:30000,
        pop:3500000,
        manpower:120000,
        factories:9,
        money:1300,
        income:100,
        pos:[26,64]
    },

    CZE:{
        name:"Czechoslovakia",
        flag:"🇨🇿",
        army:45000,
        pop:10000000,
        manpower:250000,
        factories:16,
        money:1400,
        income:110,
        pos:[15.5,49.8]
    },

    ROU:{
        name:"Romania",
        flag:"🇷🇴",
        army:40000,
        pop:19000000,
        manpower:300000,
        factories:12,
        money:1200,
        income:100,
        pos:[25,46]
    },

    GRC:{
        name:"Greece",
        flag:"🇬🇷",
        army:28000,
        pop:7000000,
        manpower:140000,
        factories:8,
        money:1000,
        income:80,
        pos:[22,39]
    },

    NLD:{
        name:"Netherlands",
        flag:"🇳🇱",
        army:28000,
        pop:8500000,
        manpower:150000,
        factories:12,
        money:1500,
        income:120,
        pos:[5,52]
    },

    BEL:{
        name:"Belgium",
        flag:"🇧🇪",
        army:25000,
        pop:8500000,
        manpower:140000,
        factories:10,
        money:1300,
        income:100,
        pos:[4.5,50.8]
    }

};


/* =========================================================
   GAME STATE
========================================================= */

let player={
    nation:null,
    money:0,
    population:0,
    manpower:0,
    army:0,
    factories:0,
    income:0,
    technology:1,
    research:0,
    stability:80
};

let year=1936;
let month=1;

let speed=0;
let timer=null;

let selected=null;

let conquered={};

let wars=[];


/* =========================================================
   MAP STATE
========================================================= */

let svg;
let countryLayer;
let occupationLayer;
let frontLayer;
let armyLayer;
let labelLayer;

let projection;
let path;

let mapReady=false;

let zoom=1;
let offsetX=0;
let offsetY=0;

let dragging=false;

let lastX=0;
let lastY=0;


/* =========================================================
   DOM
========================================================= */

const startScreen=
    document.getElementById("start");

const gameScreen=
    document.getElementById("game");

const overlay=
    document.getElementById("overlay");

const modalContent=
    document.getElementById("modalContent");

const rightPanel=
    document.getElementById("right");


/* =========================================================
   FORMAT
========================================================= */

function format(n){

    n=Math.floor(Number(n)||0);

    if(n>=1000000000)
        return (n/1000000000).toFixed(1)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("de-DE");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast=
        document.getElementById("toast");

    toast.textContent=text;

    toast.style.display="block";

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        toast.style.display="none";
    },2500);
}


/* =========================================================
   START / GAME
========================================================= */

function showStart(){

    startScreen.style.display="flex";
    gameScreen.style.display="none";

}

function showGame(){

    startScreen.style.display="none";
    gameScreen.style.display="block";

}


/* =========================================================
   MODAL
========================================================= */

function openModal(){

    overlay.style.display="flex";

}

function closeModal(){

    overlay.style.display="none";

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    openModal();

    modalContent.innerHTML=`

        <h2>🌍 Choose your nation</h2>

        <p>
            Select the nation you want to control.
        </p>

        <div class="countryGrid">

            ${Object.entries(countries).map(
                ([iso,c])=>`

                <div class="country"
                     onclick="chooseNation('${iso}')">

                    <div class="countryFlag">
                        ${c.flag}
                    </div>

                    <div>

                        <div class="countryName">
                            ${c.name}
                        </div>

                        <div class="countryPower">
                            🪖 ${format(c.army)}
                            · 🏭 ${c.factories}
                        </div>

                    </div>

                </div>

            `).join("")}

        </div>
    `;
}


/* =========================================================
   CHOOSE NATION
========================================================= */

function chooseNation(iso){

    const c=countries[iso];

    player={
        nation:iso,
        money:c.money,
        population:c.pop,
        manpower:c.manpower,
        army:c.army,
        factories:c.factories,
        income:c.income,
        technology:1,
        research:0,
        stability:80
    };

    year=1936;
    month=1;

    speed=0;

    selected=iso;

    conquered={};
    conquered[iso]=true;

    wars=[];

    if(timer)
        clearInterval(timer);

    timer=null;

    closeModal();

/* =========================================================
   TIME
========================================================= */

function setSpeed(value,button){

    speed=value;

    document
        .querySelectorAll(".speedBtn")
        .forEach(b=>
            b.classList.remove("active")
        );

    if(button)
        button.classList.add("active");

    if(timer)
        clearInterval(timer);

    timer=null;

    if(speed===0)
        return;

    timer=setInterval(
        advanceMonth,
        3500/speed
    );
}


function advanceMonth(){

    if(!player.nation)
        return;

    month++;

    if(month>12){

        month=1;
        year++;

    }

    player.money +=
        player.income+
        player.factories*5;

    player.manpower +=
        Math.floor(
            player.population*.00008
        );

    player.research +=
        Math.max(
            1,
            Math.floor(
                player.factories*.12
            )
        );

    if(player.research>100)
        player.research=100;


    wars.forEach(war=>{

        if(war.active)
            battle(war);

    });


    updateUI();
}


/* =========================================================
   BATTLE
========================================================= */

function battle(war){

    if(!war.active)
        return;

    if(player.army<=0){

        war.active=false;

        removeWarGraphics(war);

        showToast(
            "💀 Your army was destroyed."
        );

        return;
    }

    if(war.enemyArmy<=0){

        victory(war);

        return;
    }


    const myPower=
        player.army*
        (1+player.technology*.10);

    const enemyPower=
        war.enemyArmy*
        (1+war.enemyTechnology*.05);

    const ratio=
        myPower/
        (myPower+enemyPower);


    const total=
        Math.floor(
            500+
            Math.random()*700
        );


    let myLoss=
        Math.floor(
            total*
            (1-ratio)*
            .65
        );

    let enemyLoss=
        Math.floor(
            total*
            ratio*
            .65
        );


    myLoss=Math.max(5,myLoss);
    enemyLoss=Math.max(5,enemyLoss);


    player.army=
        Math.max(
            0,
            player.army-myLoss
        );

    war.enemyArmy=
        Math.max(
            0,
            war.enemyArmy-enemyLoss
        );


    war.myLosses+=myLoss;
    war.enemyLosses+=enemyLoss;


    let movement=0;

    if(ratio>.5){

        movement=
            .10+
            (ratio-.5)*1.5;

    }else{

        movement=
            -(
                .04+
                (.5-ratio)*.8
            );
    }


    movement=
        Math.max(
            -.45,
            Math.min(
                .65,
                movement
            )
        );


    war.progress+=movement;

    war.progress=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    drawOccupation(war);
    drawWar(war);


    if(war.enemyArmy<=0){

        victory(war);

    }
}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(iso){

    if(!countries[iso])
        return;

    if(iso===player.nation){

        showToast(
            "Du kannst dich nicht selbst angreifen."
        );

        return;
    }


    const existing=
        wars.find(
            w=>
                w.active &&
                w.enemy===iso
        );

    if(existing){

        showWar(existing);

        return;
    }


    const enemy=countries[iso];


    const war={

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };


    wars.push(war);

    drawWar(war);
    drawOccupation(war);

    updateMap();

    showToast(
        `⚔️ War against ${enemy.flag} ${enemy.name}`
    );
}

/* =========================================================
   OCCUPATION
========================================================= */

function drawOccupation(war){

    if(!mapReady)
        return;


    occupationLayer
        .selectAll(
            `[data-occupation="${war.id}"]`
        )
        .remove();


    if(war.progress<=0)
        return;


    const countryPath=
        countryLayer.select(
            `path[data-iso="${war.enemy}"]`
        );


    if(countryPath.empty())
        return;


    const node=
        countryPath.node();

    const bbox=
        node.getBBox();


    const start=
        getPosition(player.nation);

    const end=
        getPosition(war.enemy);


    const fromLeft=
        start[0]<end[0];


    const percentage=
        war.progress/100;


    let x;
    let width;


    if(fromLeft){

        x=bbox.x;

        width=
            bbox.width*
            percentage;

    }else{

        width=
            bbox.width*
            percentage;

        x=
            bbox.x+
            bbox.width-
            width;
    }


    const clipId=
        "occupation_"+war.id;


    d3.select("#defs")
        .select("#"+clipId)
        .remove();


    const clip=
        d3.select("#defs")
            .append("clipPath")
            .attr(
                "id",
                clipId
            );


    clip.append("path")
        .attr(
            "d",
            countryPath.attr("d")
        );


    occupationLayer
        .append("rect")
        .attr(
            "data-occupation",
            war.id
        )
        .attr(
            "class",
            "occupiedTerritory"
        )
        .attr("x",x)
        .attr(
            "y",
            bbox.y-5
        )
        .attr(
            "width",
            Math.max(0,width)
        )
        .attr(
            "height",
            bbox.height+10
        )
        .attr(
            "clip-path",
            `url(#${clipId})`
        );


    const frontX=
        fromLeft
        ?
        bbox.x+
        bbox.width*
        percentage
        :
        bbox.x+
        bbox.width*
        (1-percentage);


    occupationLayer
        .append("line")
        .attr(
            "data-occupation",
            war.id
        )
        .attr(
            "class",
            "occupationFront"
        )
        .attr("x1",frontX)
        .attr("x2",frontX)
        .attr("y1",bbox.y)
        .attr(
            "y2",
            bbox.y+bbox.height
        )
        .attr(
            "clip-path",
            `url(#${clipId})`
        );
}


/* =========================================================
   FRONT
========================================================= */

function drawWar(war){

    if(!mapReady || !war.active)
        return;


    removeWarGraphics(war);


    const start=
        getPosition(player.nation);

    const end=
        getPosition(war.enemy);


    const p=
        war.progress/100;


    const t=
        .12+
        p*.76;


    const fx=
        start[0]+
        (end[0]-start[0])*t;


    const fy=
        start[1]+
        (end[1]-start[1])*t;


    const dx=end[0]-start[0];
    const dy=end[1]-start[1];


    const length=
        Math.sqrt(
            dx*dx+
            dy*dy
        )||1;


    const px=-dy/length;
    const py=dx/length;


    const frontLength=55;


    const x1=
        fx+
        px*frontLength;

    const y1=
        fy+
        py*frontLength;

    const x2=
        fx-
        px*frontLength;

    const y2=
        fy-
        py*frontLength;


    frontLayer
        .append("line")
        .attr(
            "data-war",
            war.id
        )
        .attr(
            "class",
            "frontGlow"
        )
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    frontLayer
        .append("line")
        .attr(
            "data-war",
            war.id
        )
        .attr(
            "class",
            "frontLine"
        )
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    for(let i=0;i<5;i++){

        const q=i/4;

        frontLayer
            .append("circle")
            .attr(
                "data-war",
                war.id
            )
            .attr(
                "class",
                "frontDot"
            )
            .attr(
                "cx",
                x1+
                (x2-x1)*q
            )
            .attr(
                "cy",
                y1+
                (y2-y1)*q
            )
            .attr(
                "r",
                3
            );
    }


    const group=
        armyLayer
            .append("g")
            .attr(
                "data-war",
                war.id
            )
            .attr(
                "class",
                "armyGroup"
            )
            .attr(
                "transform",
                `translate(${fx},${fy})`
            )
            .on(
                "click",
                ()=>showWar(war)
            );


    group
        .append("circle")
        .attr(
            "class",
            "armyCircle"
        )
        .attr(
            "r",
            23
        );


    group
        .append("text")
        .attr(
            "class",
            "armyIcon"
        )
        .attr(
            "y",
            -4
        )
        .text("🪖");


    group
        .append("text")
        .attr(
            "class",
            "armyNumber"
        )
        .attr(
            "y",
            11
        )
        .text(
            format(player.army)
        );


    armyLayer
        .append("text")
        .attr(
            "data-war",
            war.id
        )
        .attr(
            "class",
            "battleIcon"
        )
        .attr(
            "x",
            fx
        )
        .attr(
            "y",
            fy-35
        )
        .text(
            "⚔️ "+
            format(war.enemyArmy)
        );


    armyLayer
        .append("text")
        .attr(
            "data-war",
            war.id
        )
        .attr(
            "class",
            "frontProgress"
        )
        .attr(
            "x",
            fx
        )
        .attr(
            "y",
            fy+40
        )
        .text(
            Math.floor(war.progress)+"%"
        );
}

/* =========================================================
   VICTORY
========================================================= */

function victory(war){

    war.active=false;
    war.progress=100;


    conquered[war.enemy]=true;


    const enemy=
        countries[war.enemy];


    player.factories +=
        Math.max(
            1,
            Math.floor(
                enemy.factories*.2
            )
        );


    player.income +=
        Math.max(
            10,
            Math.floor(
                enemy.income*.4
            )
        );


    drawOccupation(war);

    removeWarGraphics(war);

    updateMap();

    drawLabels();

    updateUI();


    showToast(
        `🏳️ ${enemy.flag} ${enemy.name} conquered`
    );
}


/* =========================================================
   UPDATE MAP
========================================================= */

function updateMap(){

    if(!countryLayer)
        return;


    countryLayer
        .selectAll("path")
        .each(function(feature){

            const iso=
                getISO(feature);


            let cls=
                "land neutralLand";


            if(iso===player.nation)
                cls=
                    "land playerLand";


            if(conquered[iso])
                cls=
                    "land conqueredLand";


            const atWar=
                wars.some(
                    w=>
                        w.active &&
                        w.enemy===iso
                );


            if(atWar)
                cls=
                    "land enemyLand";


            if(selected===iso)
                cls=
                    "land selectedLand";


            d3.select(this)
                .attr(
                    "class",
                    cls
                );

        });
}


/* =========================================================
   ISO
========================================================= */

function getISO(feature){

    if(!feature ||
       !feature.properties)
        return "";


    return (
        feature.properties.ADM0_A3 ||
        feature.properties.ISO_A3 ||
        ""
    );
}


/* =========================================================
   INIT MAP
========================================================= */

function initMap(){

    svg=
        d3.select("#world");


    countryLayer=
        d3.select("#countriesLayer");

    occupationLayer=
        d3.select("#occupationLayer");

    frontLayer=
        d3.select("#frontLayer");

    armyLayer=
        d3.select("#armyLayer");

    labelLayer=
        d3.select("#labelLayer");


    projection=
        d3.geoNaturalEarth1();


    path=
        d3.geoPath()
            .projection(projection);


    setupMapControls();


    fetch(
        "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
    )
    .then(response=>{

        if(!response.ok)
            throw new Error("Map failed");

        return response.json();

    })
    .then(world=>{

        projection.fitExtent(
            [
                [30,10],
                [1170,640]
            ],
            world
        );


        countryLayer
            .selectAll("path")
            .data(world.features)
            .enter()
            .append("path")
            .attr(
                "class",
                "land neutralLand"
            )
            .attr(
                "d",
                path
            )
            .attr(
                "data-iso",
                d=>getISO(d)
            )
            .on(
                "click",
                (event,d)=>{

                    const iso=
                        getISO(d);

                    if(countries[iso])
                        selectCountry(iso);

                }
            );


        mapReady=true;


        updateMap();
        drawLabels();
        redrawWars();

    })
    .catch(error=>{

        console.error(error);

        showToast(
            "⚠️ World map could not load."
        );

    });
}


/* =========================================================
   REDRAW WARS
========================================================= */

function redrawWars(){

    if(!mapReady)
        return;


    frontLayer
        .selectAll("*")
        .remove();

    armyLayer
        .selectAll("*")
        .remove();

    occupationLayer
        .selectAll("*")
        .remove();


    wars.forEach(war=>{

        if(war.active){

            drawOccupation(war);
            drawWar(war);

        }else if(war.progress>=100){

            drawOccupation(war);

        }

    });
}

    player.research=0;

    player.technology++;


    updateUI();

    research();
}


/* =========================================================
   DIPLOMACY
========================================================= */

function diplomacy(){

    openModal();


    modalContent.innerHTML=`

        <h2>🤝 Diplomacy</h2>


        <div class="armyBox">

            <div class="row">
                <span>Stability</span>
                <b>${player.stability}%</b>
            </div>

            <div class="row">
                <span>Technology</span>
                <b>${player.technology}</b>
            </div>

        </div>

    `;
}


/* =========================================================
   TAXES
========================================================= */

function taxes(){

    const amount=
        player.income+
        Math.floor(
            player.population*
            .00001
        );


    player.money+=amount;


    updateUI();


    showToast(
        `💰 +${format(amount)}`
    );
}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    if(!player.nation){

        showToast(
            "No game to save."
        );

        return;
    }


    localStorage.setItem(
        "ironNationsSave",
        JSON.stringify({

            player,
            year,
            month,
            conquered,
            wars

        })
    );


    showToast(
        "💾 Game saved"
    );
}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const save=
        localStorage.getItem(
            "ironNationsSave"
        );


    if(!save){

        showToast(
            "📂 No saved game."
        );

        return;
    }


    try{

        const data=
            JSON.parse(save);


        player=data.player;

        year=
            data.year ||
            1936;

        month=
            data.month ||
            1;

        conquered=
            data.conquered ||
            {};

        wars=
            data.wars ||
            [];


        selected=
            player.nation;


        showGame();

        closeModal();

        updateUI();


        if(mapReady){

            updateMap();

            drawLabels();

            redrawWars();

        }


        showToast(
            "📂 Game loaded"
        );

    }catch(error){

        console.error(error);

        showToast(
            "❌ Save error"
        );

    }
}


/* =========================================================
   MAIN MENU
========================================================= */

function mainMenu(){

    if(player.nation)
        saveGame();


    if(timer)
        clearInterval(timer);


    timer=null;

    speed=0;


    showStart();
}

/* =========================================================
   MAP CONTROLS
========================================================= */

function setupMapControls(){

    svg.on(
        "wheel",
        function(event){

            event.preventDefault();


            const oldZoom=zoom;


            zoom +=
                event.deltaY>0
                ?
                -.12
                :
                .12;


            zoom=
                Math.max(
                    .75,
                    Math.min(
                        3,
                        zoom
                    )
                );


            const rect=
                document
                    .getElementById(
                        "world"
                    )
                    .getBoundingClientRect();


            const mouseX=
                event.clientX-
                rect.left;


            const mouseY=
                event.clientY-
                rect.top;


            offsetX -=
                (mouseX-offsetX)*
                (zoom/oldZoom-1);


            offsetY -=
                (mouseY-offsetY)*
                (zoom/oldZoom-1);


            applyMapTransform();

        }
    );


    svg.on(
        "mousedown",
        function(event){

            dragging=true;

            lastX=event.clientX;
            lastY=event.clientY;

            document
                .getElementById("world")
                .classList.add(
                    "dragging"
                );

        }
    );


    window.addEventListener(
        "mouseup",
        ()=>{

            dragging=false;

            document
                .getElementById("world")
                .classList.remove(
                    "dragging"
                );

        }
    );


    window.addEventListener(
        "mousemove",
        function(event){

            if(!dragging)
                return;


            offsetX +=
                event.clientX-lastX;

            offsetY +=
                event.clientY-lastY;


            lastX=event.clientX;
            lastY=event.clientY;


            applyMapTransform();

        }
    );
}


/* =========================================================
   MAP TRANSFORM
========================================================= */

function applyMapTransform(){

    const transform=
        `translate(${offsetX} ${offsetY}) scale(${zoom})`;


    countryLayer
        .attr(
            "transform",
            transform
        );


    occupationLayer
        .attr(
            "transform",
            transform
        );


    frontLayer
        .attr(
            "transform",
            transform
        );


    armyLayer
        .attr(
            "transform",
            transform
        );


    labelLayer
        .attr(
            "transform",
            transform
        );
}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        showStart();

        initMap();

    }
);
