<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IRON NATIONS</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1117;
    color:#e8edf2;
}

/* =========================
   START
========================= */

#start{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 40%,#263746 0,#131c25 40%,#080c11 100%);
}

.startBox{
    width:540px;
    padding:45px;
    text-align:center;
    background:#151e27;
    border:1px solid #3a4a58;
    border-radius:14px;
    box-shadow:0 30px 100px #000b;
}

.logo{
    font-size:46px;
    font-weight:900;
    letter-spacing:5px;
}

.logoLine{
    width:100px;
    height:3px;
    margin:12px auto;
    background:#718ba3;
}

.subtitle{
    color:#8997a5;
    margin-bottom:32px;
}

.menuBtn{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:1px solid #3d4d5c;
    border-radius:7px;
    background:#202d39;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.menuBtn:hover{
    background:#304252;
}

.menuBtn.main{
    background:#3b607f;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at center,#182a36,#0d1820 70%);
}

#world{
    width:100%;
    height:100%;
    cursor:grab;
}

#world:active{
    cursor:grabbing;
}

.land{
    stroke:#566675;
    stroke-width:.7;
    vector-effect:non-scaling-stroke;
    transition:.15s;
}

.land:hover{
    stroke:#c9d4dd;
    stroke-width:1.5;
}

.playerLand{
    fill:#416f96;
}

.enemyLand{
    fill:#854d4d;
}

.conqueredLand{
    fill:#557fa2;
}

.neutralLand{
    fill:#37434d;
}

.selectedLand{
    fill:#b18b45;
}

/* =========================
   MAP LABELS
========================= */

.countryLabel{
    pointer-events:none;
    fill:#d9e1e7;
    font-size:11px;
    font-weight:bold;
    text-anchor:middle;
    text-shadow:
        0 1px 3px #000,
        0 0 4px #000;
}

/* =========================
   FRONT
========================= */

.frontLine{
    fill:none;
    stroke:#e2b34f;
    stroke-width:4;
    stroke-dasharray:9 7;
    filter:drop-shadow(0 0 5px #000);
}

.frontGlow{
    fill:none;
    stroke:#d96d57;
    stroke-width:9;
    opacity:.18;
}

.armyIcon{
    font-size:23px;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
    filter:drop-shadow(0 2px 3px #000);
}

.battleIcon{
    font-size:25px;
    text-anchor:middle;
    dominant-baseline:middle;
    pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:60px;
    z-index:20;

    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;

    background:#121a22ee;
    border-bottom:1px solid #3b4a57;
    box-shadow:0 5px 25px #0008;
}

.gameLogo{
    font-weight:900;
    letter-spacing:2px;
    margin-right:15px;
}

.stat{
    background:#202b35;
    border:1px solid #34434f;
    padding:8px 11px;
    border-radius:6px;
    font-size:12px;
}

/* =========================
   LEFT
========================= */

#left{
    position:absolute;
    z-index:20;
    left:10px;
    top:70px;
    bottom:10px;
    width:220px;

    padding:10px;

    background:#141d26f5;
    border:1px solid #394956;
    border-radius:9px;

    box-shadow:0 10px 35px #0008;
}

.section{
    color:#7f8d9a;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:9px 5px 6px;
}

.sideBtn{
    width:100%;
    padding:10px;
    margin-bottom:5px;

    background:#202b35;
    color:#dfe6eb;

    border:1px solid #34424e;
    border-radius:6px;

    cursor:pointer;
    text-align:left;
}

.sideBtn:hover{
    background:#2b3a47;
}

.sideBtn.danger{
    color:#ed9999;
}

/* =========================
   RIGHT
========================= */

#right{
    display:none;

    position:absolute;
    z-index:20;

    right:10px;
    top:70px;

    width:310px;
    max-height:calc(100vh - 80px);

    overflow:auto;

    padding:15px;

    background:#141d26f7;
    border:1px solid #3d4c59;
    border-radius:9px;

    box-shadow:0 10px 35px #0008;
}

.header{
    display:flex;
    gap:12px;
    align-items:center;
}

.flag{
    font-size:38px;
}

.name{
    font-size:20px;
    font-weight:bold;
}

.tag{
    color:#81909d;
    font-size:11px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #293640;
    font-size:13px;
}

.action{
    width:100%;
    padding:11px;
    margin-top:8px;
    border:0;
    border-radius:6px;
    background:#355672;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.action:hover{
    background:#467393;
}

.warBtn{
    background:#713f42;
}

.warBtn:hover{
    background:#914f52;
}

/* =========================
   BOTTOM
========================= */

#speed{
    position:absolute;
    z-index:30;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);

    padding:6px;

    background:#131b23f5;
    border:1px solid #3b4a56;
    border-radius:8px;

    display:flex;
    gap:5px;
}

.speedBtn{
    width:48px;
    padding:8px;

    background:#202b35;
    color:white;

    border:1px solid #34434f;
    border-radius:5px;

    cursor:pointer;
}

.speedBtn.active{
    background:#466b89;
}

/* =========================
   MODAL
========================= */

#overlay{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000b;
}

.modal{
    width:650px;
    max-height:85vh;
    overflow:auto;

    background:#151e27;
    border:1px solid #425361;
    border-radius:11px;

    padding:22px;

    box-shadow:0 30px 100px #000;
}

.close{
    float:right;
    border:0;
    background:#303c47;
    color:white;
    border-radius:5px;
    padding:7px 10px;
    cursor:pointer;
}

/* =========================
   COUNTRY CHOICE
========================= */

.countryGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
}

.country{
    display:flex;
    align-items:center;
    gap:9px;

    padding:11px;

    background:#202b35;
    border:1px solid #354450;
    border-radius:7px;

    cursor:pointer;
}

.country:hover{
    background:#2d3c49;
    transform:translateY(-1px);
}

.countryFlag{
    font-size:27px;
}

.countryName{
    font-weight:bold;
    font-size:12px;
}

.countryPower{
    color:#81909d;
    font-size:10px;
    margin-top:3px;
}

/* =========================
   ARMY BOX
========================= */

.armyBox{
    padding:13px;
    margin-top:10px;

    background:#202b35;
    border:1px solid #34434f;
    border-radius:7px;
}

.armyTitle{
    color:#8997a4;
    font-size:11px;
    text-transform:uppercase;
}

.armyNumber{
    font-size:28px;
    font-weight:bold;
    margin-top:5px;
}

.bar{
    width:100%;
    height:9px;
    margin-top:8px;

    background:#0b1015;
    border-radius:5px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#6188a9;
    transition:.4s;
}

.redFill{
    background:#9b5555;
}

.frontBox{
    margin-top:12px;
    padding:14px;

    text-align:center;

    background:#111920;
    border:1px solid #33414c;
    border-radius:7px;
}

.bigFront{
    font-size:30px;
}

/* =========================
   TOAST
========================= */

#toast{
    display:none;

    position:fixed;
    z-index:5000;

    left:50%;
    bottom:70px;

    transform:translateX(-50%);

    background:#202c36;
    border:1px solid #475866;

    padding:12px 18px;

    border-radius:7px;

    box-shadow:0 10px 30px #0008;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    #left{
        width:190px;
    }

    #right{
        width:280px;
    }

    .stat{
        display:none;
    }

    .countryGrid{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<!-- START -->
<div id="start">

    <div class="startBox">

        <div class="logo">
            IRON NATIONS
        </div>

        <div class="logoLine"></div>

        <div class="subtitle">
            Build your nation. Command your armies. Change history.
        </div>

        <button class="menuBtn main" onclick="newGame()">
            NEW GAME
        </button>

        <button class="menuBtn" onclick="loadGame()">
            CONTINUE
        </button>

        <button class="menuBtn" onclick="settings()">
            SETTINGS
        </button>

    </div>

</div>


<!-- GAME -->
<div id="game">

    <div id="map">

        <svg id="world"
             viewBox="0 0 1200 650"
             preserveAspectRatio="xMidYMid slice">

            <g id="countriesLayer"></g>

            <g id="frontLayer"></g>

            <g id="armyLayer"></g>

            <g id="labelLayer"></g>

        </svg>

    </div>


    <!-- TOP -->
    <div id="topbar">

        <div class="gameLogo">
            IRON NATIONS
        </div>

        <div class="stat">
            💰 <b id="money">0</b>
        </div>

        <div class="stat">
            👥 <b id="population">0</b>
        </div>

        <div class="stat">
            🪖 <b id="army">0</b>
        </div>

        <div class="stat">
            👨‍✈️ <b id="manpower">0</b>
        </div>

        <div class="stat">
            🏭 <b id="factories">0</b>
        </div>

        <div class="stat">
            📅 <b id="date">January 1936</b>
        </div>

    </div>


    <!-- LEFT -->
    <div id="left">

        <div class="section">
            Nation
        </div>

        <button class="sideBtn" onclick="openNations()">
            🌍 Nations
        </button>

        <button class="sideBtn" onclick="openArmy()">
            🪖 Army
        </button>

        <button class="sideBtn" onclick="construction()">
            🏭 Construction
        </button>

        <button class="sideBtn" onclick="research()">
            🔬 Research
        </button>

        <button class="sideBtn" onclick="diplomacy()">
            🤝 Diplomacy
        </button>

        <div class="section">
            Economy
        </div>

        <button class="sideBtn" onclick="taxes()">
            💰 Collect Taxes
        </button>

        <div class="section">
            Game
        </div>

        <button class="sideBtn" onclick="saveGame()">
            💾 Save
        </button>

        <button class="sideBtn" onclick="loadGame()">
            📂 Load
        </button>

        <button class="sideBtn danger" onclick="mainMenu()">
            ⬅ Main Menu
        </button>

    </div>


    <!-- RIGHT -->
    <div id="right"></div>


    <!-- SPEED -->
    <div id="speed">

        <button class="speedBtn active"
                onclick="setSpeed(0,this)">
            Ⅱ
        </button>

        <button class="speedBtn"
                onclick="setSpeed(1,this)">
            1×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(2,this)">
            2×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(4,this)">
            4×
        </button>

        <button class="speedBtn"
                onclick="setSpeed(8,this)">
            8×
        </button>

    </div>

</div>


<!-- MODAL -->
<div id="overlay">

    <div class="modal">

        <button class="close"
                onclick="closeModal()">
            ✕
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   COUNTRY DATA
========================================================= */

const countries={

DEU:{name:"Germany",flag:"🇩🇪",army:100000,pop:69000000,manpower:1200000,factories:35,money:2500,income:250},
POL:{name:"Poland",flag:"🇵🇱",army:50000,pop:34000000,manpower:650000,factories:18,money:1500,income:120},
FRA:{name:"France",flag:"🇫🇷",army:85000,pop:41000000,manpower:800000,factories:30,money:2200,income:210},
GBR:{name:"United Kingdom",flag:"🇬🇧",army:90000,pop:48000000,manpower:900000,factories:40,money:3000,income:280},
ITA:{name:"Italy",flag:"🇮🇹",army:75000,pop:44000000,manpower:850000,factories:25,money:2000,income:180},
ESP:{name:"Spain",flag:"🇪🇸",army:45000,pop:25000000,manpower:500000,factories:14,money:1300,income:100},
RUS:{name:"Russia",flag:"🇷🇺",army:180000,pop:108000000,manpower:2500000,factories:55,money:3500,income:300},
UKR:{name:"Ukraine",flag:"🇺🇦",army:65000,pop:30000000,manpower:700000,factories:20,money:1600,income:130},
USA:{name:"United States",flag:"🇺🇸",army:140000,pop:128000000,manpower:2500000,factories:80,money:6000,income:500},
CAN:{name:"Canada",flag:"🇨🇦",army:30000,pop:11000000,manpower:250000,factories:12,money:1500,income:110},
MEX:{name:"Mexico",flag:"🇲🇽",army:35000,pop:19000000,manpower:400000,factories:10,money:1100,income:90},
BRA:{name:"Brazil",flag:"🇧🇷",army:60000,pop:40000000,manpower:800000,factories:18,money:1700,income:140},
ARG:{name:"Argentina",flag:"🇦🇷",army:40000,pop:13000000,manpower:300000,factories:12,money:1200,income:90},
TUR:{name:"Turkey",flag:"🇹🇷",army:70000,pop:35000000,manpower:750000,factories:20,money:1800,income:150},
EGY:{name:"Egypt",flag:"🇪🇬",army:55000,pop:16000000,manpower:400000,factories:12,money:1000,income:80},
SAU:{name:"Saudi Arabia",flag:"🇸🇦",army:30000,pop:7000000,manpower:150000,factories:8,money:2500,income:180},
IRN:{name:"Iran",flag:"🇮🇷",army:50000,pop:14000000,manpower:350000,factories:14,money:1300,income:100},
IND:{name:"India",flag:"🇮🇳",army:120000,pop:350000000,manpower:4000000,factories:35,money:3000,income:280},
CHN:{name:"China",flag:"🇨🇳",army:220000,pop:500000000,manpower:5000000,factories:45,money:3000,income:260},
JPN:{name:"Japan",flag:"🇯🇵",army:110000,pop:70000000,manpower:1300000,factories:35,money:2800,income:250},
KOR:{name:"South Korea",flag:"🇰🇷",army:45000,pop:20000000,manpower:500000,factories:18,money:1800,income:160},
AUS:{name:"Australia",flag:"🇦🇺",army:35000,pop:7000000,manpower:200000,factories:14,money:1800,income:140},
SWE:{name:"Sweden",flag:"🇸🇪",army:35000,pop:6000000,manpower:180000,factories:14,money:1600,income:130},
NOR:{name:"Norway",flag:"🇳🇴",army:22000,pop:3000000,manpower:90000,factories:8,money:1300,income:90},
FIN:{name:"Finland",flag:"🇫🇮",army:30000,pop:3500000,manpower:120000,factories:9,money:1300,income:100},
NLD:{name:"Netherlands",flag:"🇳🇱",army:28000,pop:8500000,manpower:150000,factories:12,money:1500,income:120},
BEL:{name:"Belgium",flag:"🇧🇪",army:25000,pop:8500000,manpower:140000,factories:10,money:1300,income:100},
CZE:{name:"Czechoslovakia",flag:"🇨🇿",army:45000,pop:10000000,manpower:250000,factories:16,money:1400,income:110},
ROU:{name:"Romania",flag:"🇷🇴",army:40000,pop:19000000,manpower:300000,factories:12,money:1200,income:100},
GRC:{name:"Greece",flag:"🇬🇷",army:28000,pop:7000000,manpower:140000,factories:8,money:1000,income:80}

};


/* =========================================================
   GAME STATE
========================================================= */

let player={
    nation:null,
    money:0,
    population:0,
    manpower:0,
    army:0,
    factories:0,
    income:0,
    technology:1,
    research:0,
    stability:80
};

let year=1936;
let month=1;
let speed=0;
let timer=null;

let selected=null;
let conquered={};
let wars=[];

let countryElements={};


/* =========================================================
   SVG MAP
========================================================= */

const svg=d3.select("#world");

const countryLayer=d3.select("#countriesLayer");
const frontLayer=d3.select("#frontLayer");
const armyLayer=d3.select("#armyLayer");
const labelLayer=d3.select("#labelLayer");

const projection=d3.geoNaturalEarth1()
    .scale(190)
    .translate([600,330]);

const path=d3.geoPath()
    .projection(projection);


/* =========================================================
   LOAD WORLD
========================================================= */

fetch(
"https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
)
.then(r=>r.json())
.then(world=>{

    countryLayer
        .selectAll("path")
        .data(world.features)
        .enter()
        .append("path")
        .attr("class","land neutralLand")
        .attr("d",path)
        .attr("data-iso",d=>getISO(d))
        .on("click",(event,d)=>{

            const iso=getISO(d);

            if(countries[iso]){
                selectCountry(iso);
            }

        })
        .on("mouseover",function(){

            d3.select(this)
              .raise();

        });

    updateMap();

})
.catch(error=>{

    console.error(error);

    showToast("Die Weltkarte konnte nicht geladen werden.");

});


/* =========================================================
   ISO
========================================================= */

function getISO(d){

    return d.properties.ADM0_A3 ||
           d.properties.ISO_A3 ||
           d.properties.SOV_A3;

}


/* =========================================================
   MAP UPDATE
========================================================= */

function updateMap(){

    countryElements={};

    countryLayer
        .selectAll("path")
        .each(function(d){

            const iso=getISO(d);

            countryElements[iso]=this;

            let cls="land neutralLand";

            if(iso===player.nation){
                cls="land playerLand";
            }

            if(conquered[iso]){
                cls="land conqueredLand";
            }

            if(
                wars.some(
                    w=>w.active&&w.enemy===iso
                )
            ){
                cls="land enemyLand";
            }

            if(selected===iso){
                cls="land selectedLand";
            }

            d3.select(this)
                .attr("class",cls);

        });

}


/* =========================================================
   START GAME
========================================================= */

function newGame(){

    document.getElementById("overlay").style.display="flex";

    document.getElementById("modalContent").innerHTML=`

        <h2>🌍 Choose your nation</h2>

        <p style="color:#82909d">
            Choose a country to begin your campaign.
        </p>

        <div class="countryGrid">

        ${
            Object.entries(countries).map(
                ([iso,c])=>`

                <div class="country"
                     onclick="chooseNation('${iso}')">

                    <div class="countryFlag">
                        ${c.flag}
                    </div>

                    <div>

                        <div class="countryName">
                            ${c.name}
                        </div>

                        <div class="countryPower">
                            🪖 ${format(c.army)}
                        </div>

                    </div>

                </div>

            `).join("")
        }

        </div>

    `;

}


/* =========================================================
   CHOOSE
========================================================= */

function chooseNation(iso){

    const c=countries[iso];

    player={
        nation:iso,
        money:c.money,
        population:c.pop,
        manpower:c.manpower,
        army:c.army,
        factories:c.factories,
        income:c.income,
        technology:1,
        research:0,
        stability:80
    };

    conquered={};
    conquered[iso]=true;

    wars=[];

    year=1936;
    month=1;

    selected=iso;

    document.getElementById("overlay").style.display="none";
    document.getElementById("start").style.display="none";
    document.getElementById("game").style.display="block";

    updateUI();
    updateMap();

    startTimer();

    showToast(
        `${c.flag} ${c.name} is ready.`
    );

}


/* =========================================================
   TIME
========================================================= */

function startTimer(){

    if(timer)
        clearInterval(timer);

    timer=setInterval(()=>{

        if(speed===0)
            return;

        advanceMonth();

    },3500/speed);

}


function advanceMonth(){

    month++;

    if(month>12){
        month=1;
        year++;
    }

    player.money+=player.income;

    player.manpower+=
        Math.floor(player.population*.00008);

    player.research+=2;

    wars.forEach(w=>{
        if(w.active)
            battle(w);
    });

    updateUI();
    updateMap();

}


/* =========================================================
   BATTLE
========================================================= */

function battle(war){

    if(player.army<=0)
        return;


    const enemy=countries[war.enemy];

    /*
       Army power
    */

    const myPower=
        player.army*
        (1+player.technology*.10);

    const enemyPower=
        war.enemyArmy*
        (1+war.enemyTechnology*.05);


    const ratio=
        myPower/
        (myPower+enemyPower);


    /*
       Casualties
    */

    const total=
        Math.floor(
            1800+
            Math.random()*2600
        );


    let myLoss=
        Math.floor(
            total*(1-ratio)*.9
        );

    let enemyLoss=
        Math.floor(
            total*ratio
        );


    myLoss=Math.max(100,myLoss);
    enemyLoss=Math.max(100,enemyLoss);


    player.army=
        Math.max(
            0,
            player.army-myLoss
        );


    war.enemyArmy=
        Math.max(
            0,
            war.enemyArmy-enemyLoss
        );


    war.myLosses+=myLoss;
    war.enemyLosses+=enemyLoss;


    /*
       Front movement
    */

    let movement=
        (ratio-.5)*7;

    movement+=
        (Math.random()-.5)*1.5;


    war.progress+=movement;

    war.progress=
        Math.max(
            0,
            Math.min(
                100,
                war.progress
            )
        );


    drawWar(war);


    /*
       Victory
    */

    if(war.enemyArmy<=0){

        victory(war);

        return;

    }


    /*
       Defeat
    */

    if(player.army<=0){

        war.active=false;

        removeWar(war);

        showToast(
            "💀 Your army has been destroyed."
        );

    }

}


/* =========================================================
   DECLARE WAR
========================================================= */

function declareWar(iso){

    if(iso===player.nation)
        return;


    if(
        wars.some(
            w=>w.active&&w.enemy===iso
        )
    ){

        showToast(
            "You are already at war."
        );

        return;

    }


    const enemy=countries[iso];


    const war={

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };


    wars.push(war);

    drawWar(war);

    updateMap();

    showToast(
        `⚔️ War against ${enemy.flag} ${enemy.name}`
    );

    showWar(war);

}


/* =========================================================
   MAP POSITIONS
========================================================= */

const positions={

DEU:[10,51],
POL:[19,52],
FRA:[2,46],
GBR:[-2,54],
ITA:[12,42],
ESP:[-4,40],
RUS:[90,60],

ROU:[25,46],

};


function position(iso){

    const p=positions[iso];

    if(!p)
        return [600,330];

    return projection(p);

}


/* =========================================================
   DRAW WAR
========================================================= */

function drawWar(war){

    const start=position(player.nation);
    const end=position(war.enemy);


    /*
       Current front position
    */

    const progress=
        war.progress/100;


    const fx=
        start[0]+
        (end[0]-start[0])*
        progress*.88;


    const fy=
        start[1]+
        (end[1]-start[1])*
        progress*.88;


    /*
       perpendicular front
    */

    const dx=end[0]-start[0];
    const dy=end[1]-start[1];

    const length=Math.sqrt(dx*dx+dy*dy)||1;

    const px=-dy/length;
    const py=dx/length;

    const frontLength=35;


    const x1=fx+px*frontLength;
    const y1=fy+py*frontLength;

    const x2=fx-px*frontLength;
    const y2=fy-py*frontLength;


    /*
       Remove old
    */

    frontLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();

    armyLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();


    /*
       Front glow
    */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontGlow")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /*
       Front line
    */

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontLine")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);


    /*
       Army
    */

    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","armyIcon")
        .attr("x",fx)
        .attr("y",fy)
        .text("🪖");


    /*
       Battle symbol
    */

    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","battleIcon")
        .attr("x",fx)
        .attr("y",fy-30)
        .text("⚔️");

}


/* =========================================================
   REMOVE WAR
========================================================= */

function removeWar(war){

    frontLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();

    armyLayer
        .selectAll(`[data-war="${war.id}"]`)
        .remove();

}


/* =========================================================
   VICTORY
========================================================= */

function victory(war){

    war.active=false;

    conquered[war.enemy]=true;

    player.income+=
        Math.floor(
            countries[war.enemy].income*.4
        );

    player.factories+=
        Math.max(
            1,
            Math.floor(
                countries[war.enemy].factories*.2
            )
        );


    removeWar(war);

    updateMap();

    showToast(
        `🏳️ ${countries[war.enemy].flag} ${countries[war.enemy].name} defeated`
    );


    setTimeout(()=>{
        victoryWindow(war);
    },300);

}

            wars
        })

/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    const raw=
        localStorage.getItem(
            "ironNationsSave"
        );


    if(!raw){

        newGame();

        return;

    }


    const data=JSON.parse(raw);

    player=data.player;
    year=data.year;
    month=data.month;
    conquered=data.conquered||{};
    wars=data.wars||[];

    document.getElementById("start").style.display="none";
    document.getElementById("game").style.display="block";


    wars.forEach(w=>{

        if(w.active)
            drawWar(w);

    });


    updateUI();
    updateMap();
    startTimer();

    showToast("📂 Game loaded.");

}

/* =========================================================
   FORMAT
========================================================= */

function format(n){

    n=Math.floor(n);

    if(n>=1000000000)
        return (n/1000000000).toFixed(1)+"B";

    if(n>=1000000)
        return (n/1000000).toFixed(1)+"M";

    if(n>=1000)
        return (n/1000).toFixed(1)+"K";

    return n.toLocaleString("de-DE");

}


/* =========================================================
   MAP ZOOM / PAN
========================================================= */

let zoom=1;
let offsetX=0;
let offsetY=0;

let dragging=false;
let lastX=0;
let lastY=0;


svg.on("wheel",event=>{

    event.preventDefault();

    zoom+=event.deltaY>0?-0.1:0.1;

    zoom=Math.max(.8,Math.min(2.5,zoom));

    applyTransform();

});


svg.on("mousedown",event=>{

    dragging=true;

    lastX=event.clientX;
    lastY=event.clientY;

});


window.addEventListener("mouseup",()=>{
    dragging=false;
});


window.addEventListener("mousemove",event=>{

    if(!dragging)
        return;

    offsetX+=event.clientX-lastX;
    offsetY+=event.clientY-lastY;

    lastX=event.clientX;
    lastY=event.clientY;

    applyTransform();

});


function applyTransform(){

    const transform=
        `translate(${offsetX} ${offsetY}) scale(${zoom})`;

    countryLayer.attr("transform",transform);
    frontLayer.attr("transform",transform);
    armyLayer.attr("transform",transform);
    labelLayer.attr("transform",transform);

}
