  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">IRON NATIONS</h2>
      <div class="close" onclick="closeModal()">✕</div>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   COUNTRY DATA
============================================================ */
const countryData = {
  ALB:{name:"Albania",german:"Albanien",flag:"al",color:"#894a4e",population:2.8,military:10},
  AUT:{name:"Austria",german:"Österreich",flag:"at",color:"#955052",population:9,military:20},
  BEL:{name:"Belgium",german:"Belgien",flag:"be",color:"#7c6b39",population:12,military:20},
  BGR:{name:"Bulgaria",german:"Bulgarien",flag:"bg",color:"#637a4a",population:6,military:20},
  BIH:{name:"Bosnia",german:"Bosnien",flag:"ba",color:"#4f6792",population:3,military:10},
  BLR:{name:"Belarus",german:"Weißrussland",flag:"by",color:"#7a4a4a",population:9,military:40},
  CHE:{name:"Switzerland",german:"Schweiz",flag:"ch",color:"#955050",population:9,military:15},
  CZE:{name:"Czechia",german:"Tschechien",flag:"cz",color:"#4f6a94",population:11,military:25},
  DEU:{name:"Germany",german:"Deutschland",flag:"de",color:"#3d6f96",population:84,military:80},
  DNK:{name:"Denmark",german:"Dänemark",flag:"dk",color:"#9e4e4e",population:6,military:15},
  ESP:{name:"Spain",german:"Spanien",flag:"es",color:"#987a3d",population:48,military:55},
  EST:{name:"Estonia",german:"Estland",flag:"ee",color:"#4b7390",population:1.3,military:10},
  FIN:{name:"Finland",german:"Finnland",flag:"fi",color:"#5c7996",population:6,military:25},
  FRA:{name:"France",german:"Frankreich",flag:"fr",color:"#4a608f",population:68,military:85},
  GBR:{name:"United Kingdom",german:"Großbritannien",flag:"gb",color:"#4a5d92",population:69,military:75},
  GRC:{name:"Greece",german:"Griechenland",flag:"gr",color:"#4a7d9c",population:10,military:25},
  HRV:{name:"Croatia",german:"Kroatien",flag:"hr",color:"#4f6a94",population:4,military:15},
  HUN:{name:"Hungary",german:"Ungarn",flag:"hu",color:"#87624a",population:10,military:25},
  IRL:{name:"Ireland",german:"Irland",flag:"ie",color:"#52855a",population:5,military:10},
  ISL:{name:"Iceland",german:"Island",flag:"is",color:"#4f7396",population:0.4,military:5},
  ITA:{name:"Italy",german:"Italien",flag:"it",color:"#4a835c",population:59,military:60},
  LTU:{name:"Lithuania",german:"Litauen",flag:"lt",color:"#718a44",population:3,military:12},
  LUX:{name:"Luxembourg",german:"Luxemburg",flag:"lu",color:"#627894",population:0.7,military:4},
  LVA:{name:"Latvia",german:"Lettland",flag:"lv",color:"#835050",population:2,military:10},
  MDA:{name:"Moldova",german:"Moldau",flag:"md",color:"#816446",population:2.5,military:8},
  MKD:{name:"N. Macedonia",german:"Nordmazedonien",flag:"mk",color:"#9a6a3b",population:1.8,military:8},
  MLT:{name:"Malta",german:"Malta",flag:"mt",color:"#945454",population:0.6,military:5},
  MNE:{name:"Montenegro",german:"Montenegro",flag:"me",color:"#7d5248",population:0.6,military:6},
  NLD:{name:"Netherlands",german:"Niederlande",flag:"nl",color:"#a3674f",population:18,military:25},
  NOR:{name:"Norway",german:"Norwegen",flag:"no",color:"#8a4d4d",population:6,military:20},
  POL:{name:"Poland",german:"Polen",flag:"pl",color:"#9c5454",population:38,military:70},
  PRT:{name:"Portugal",german:"Portugal",flag:"pt",color:"#5a8756",population:10,military:20},
  ROU:{name:"Romania",german:"Rumänien",flag:"ro",color:"#756294",population:19,military:35},
  SRB:{name:"Serbia",german:"Serbien",flag:"rs",color:"#70568a",population:7,military:25},
  SVK:{name:"Slovakia",german:"Slowakei",flag:"sk",color:"#5e6892",population:5,military:15},
  SVN:{name:"Slovenia",german:"Slowenien",flag:"si",color:"#567a94",population:2,military:10},
  SWE:{name:"Sweden",german:"Schweden",flag:"se",color:"#6f8a3f",population:11,military:30},
  TUR:{name:"Turkey",german:"Türkei",flag:"tr",color:"#8a4a4a",population:85,military:60},
  UKR:{name:"Ukraine",german:"Ukraine",flag:"ua",color:"#a1853b",population:37,military:65},
  RUS:{name:"Russia",german:"Russland",flag:"ru",color:"#7a3a3a",population:144,military:120}
};

/* ============================================================
   STATE
============================================================ */
let player = {
  nation: null,
  money: 1000,
  territories: 0,
  population: 0,
  income: 50
};

let selectedOwn = null;
let selectedEnemy = null;
let war = null;
let warFlags = [];        // Layer für Flaggen + Frontlinie
let warFlagData = null;

const countryLayers = {};      // iso -> Leaflet Layer
const countryLabels = {};      // iso -> Label Marker
const conqueredCountries = new Set();
const currentTroops = {};      // iso -> Truppen

// Starttruppen
Object.keys(countryData).forEach(iso => {
  currentTroops[iso] = countryData[iso].military * 10000;
});

/* ============================================================
   HELPERS
============================================================ */
const isPlayerOwned = iso =>
  player.nation && (player.nation.iso === iso || conqueredCountries.has(iso));

function formatTroops(n) {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toString();
}

function interpolateColor(c1, c2, t) {
  t = Math.max(0, Math.min(1, t));
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(r1 + (r2-r1)*t);
  const g = Math.round(g1 + (g2-g1)*t);
  const b = Math.round(b1 + (b2-b1)*t);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

/* ============================================================
   KARTE
============================================================ */
const EUROPE_CENTER = [50.5, 14];
const EUROPE_BOUNDS = L.latLngBounds(L.latLng(33, -15), L.latLng(72, 50));

const map = L.map("map", {
  zoomControl: false,
  attributionControl: true,
  minZoom: 4,
  maxZoom: 8,
  maxBounds: EUROPE_BOUNDS,
  maxBoundsViscosity: 1.0,
  worldCopyJump: false,
  zoomSnap: 0.25,
  zoomDelta: 0.5,
  preferCanvas: true
});
map.setView(EUROPE_CENTER, 4.5);

const GEOJSON_URL = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson";

fetch(GEOJSON_URL)
  .then(r => { if (!r.ok) throw new Error("GeoJSON Fehler"); return r.json(); })
  .then(data => {
    L.geoJSON(data, {
      filter: f => f.properties.CONTINENT === "Europe",
      style: f => getCountryStyle(getISO(f)),
      onEachFeature: (feature, layer) => {
        const iso = getISO(feature);
        if (!iso) return;
        countryLayers[iso] = layer;

        layer.on({
          mouseover: function() {
            if (!countryData[iso] || war) return;
            const st = getCountryStyle(iso);
            this.setStyle({ ...st, weight: 3, color: "#ffd54f", opacity: 1 });
          },
          mouseout: function() { refreshCountry(iso); },
          click: function() {
            if (war) return;
            onCountryClick(iso);
          }
        });

        createCountryLabel(iso, layer);
      }
    }).addTo(map);

    refreshAllCountries();
    refreshAllLabels();
    notify("Wähle ein eigenes Land auf der Karte.");
  })
  .catch(err => {
    console.error(err);
    showToast("Fehler", "Europakarte konnte nicht geladen werden.", "error");
  });

function getISO(feature) {
  const p = feature.properties || {};
  let iso = p.ISO_A3 || p.ADM0_A3 || p.SOV_A3;
  if (!iso) return null;
  const aliases = { "-99": null, "KOS": "UNK" };
  if (aliases.hasOwnProperty(iso)) iso = aliases[iso];
  return iso;
}

/* ============================================================
   STYLING — Grenzen verschmelzen bei gleichem Besitzer
============================================================ */
function getCountryStyle(iso) {
  const info = countryData[iso];
  let color = info ? info.color : "#1e2b35";
  let border = "#122330";
  let weight = 1.2;

  const isOwned = isPlayerOwned(iso);
  const isSelectedOwn = selectedOwn === iso;
  const isSelectedEnemy = selectedEnemy === iso;

  if (isOwned) {
    color = "#22d3ee";
    border = "#22d3ee";   // gleiche Farbe → interne Grenzen unsichtbar
    weight = 0.5;
  }

  if (isSelectedOwn) {
    border = "#ffd54f";
    weight = 3;
  }

  if (isSelectedEnemy) {
    color = "#f87171";
    border = "#ffffff";
    weight = 3;
  }

  return {
    color: border,
    weight: weight,
    opacity: 0.95,
    fillColor: color,
    fillOpacity: 0.88
  };
}

function refreshCountry(iso) {
  const layer = countryLayers[iso];
  if (layer) layer.setStyle(getCountryStyle(iso));
}
function refreshAllCountries() {
  Object.keys(countryLayers).forEach(refreshCountry);
}

/* ============================================================
   LABELS — divIcons, keine Tooltips
============================================================ */
function createCountryLabel(iso, layer) {
  const info = countryData[iso];
  if (!info) return;

  // Alten Label entfernen
  if (countryLabels[iso]) {
    map.removeLayer(countryLabels[iso]);
    delete countryLabels[iso];
  }

  const center = layer.getBounds().getCenter();
  const isHome = player.nation && player.nation.iso === iso;
  const isOwned = isPlayerOwned(iso);

  let flagCode, labelText, extraClass = '';
  if (isHome) {
    flagCode = player.nation.flag;
    labelText = player.nation.german;
    extraClass = 'home';
  } else if (isOwned) {
    flagCode = player.nation.flag;
    labelText = player.nation.german;
    extraClass = 'owned';
  } else {
    flagCode = info.flag;
    labelText = info.german;
  }

  const icon = L.divIcon({
    className: 'country-label-wrap',
    html: `<div class="country-label-pin ${extraClass}">
      <img src="https://flagcdn.com/w40/${flagCode}.png"
           onerror="this.src='https://flagcdn.com/w40/un.png'">
      <span>${labelText}</span>
    </div>`,
    iconSize: [0, 0],
    iconAnchor: [0, 0]
  });

  countryLabels[iso] = L.marker(center, {
    icon, interactive: false, zIndexOffset: 500
  }).addTo(map);
}

function updateCountryLabel(iso) {
  const layer = countryLayers[iso];
  if (layer) createCountryLabel(iso, layer);
}
function refreshAllLabels() {
  Object.keys(countryLayers).forEach(updateCountryLabel);
}

/* ============================================================
   KLICK-LOGIK
============================================================ */
function onCountryClick(iso) {
  const info = countryData[iso];
  if (!info || war) return;

  // Nation wählen
  if (!player.nation) {
    player.nation = {
      iso, name: info.name, german: info.german,
      flag: info.flag, color: info.color,
      population: info.population
    };
    player.population = info.population;
    player.territories = 1;
    selectedOwn = iso;
    selectedEnemy = null;
    showToast("Nation gewählt", `${info.german}`, "success");
    refreshAllCountries();
    refreshAllLabels();
    updateUI();
    updateAttackBar();
    return;
  }

  // Eigenes Land → Auswahl
  if (isPlayerOwned(iso)) {
    selectedOwn = iso;
    selectedEnemy = null;
    refreshAllCountries();
    updateUI();
    updateAttackBar();
    notify("Eigenes Gebiet: " + info.german);
    return;
  }

  // Feindliches Land → Ziel
  if (!selectedOwn) {
    notify("Wähle zuerst ein eigenes Land.");
    return;
  }

  selectedEnemy = iso;
  refreshAllCountries();
  updateUI();
  updateAttackBar();
  notify("Ziel: " + info.german);
}

/* ============================================================
   ATTACK BAR
============================================================ */
const attackBar = document.getElementById('attackBar');
const attackSlider = document.getElementById('attackSlider');
const attackBtn = document.getElementById('attackBtn');

function updateAttackBar() {
  if (war) return;

  if (!selectedOwn || !selectedEnemy) {
    attackBar.classList.add('hidden');
    return;
  }

  const own = countryData[selectedOwn];
  const enemy = countryData[selectedEnemy];
  const ownTroops = Math.floor(currentTroops[selectedOwn]);
  const enemyTroops = Math.floor(currentTroops[selectedEnemy]);

  document.getElementById('abAttackerFlag').innerHTML =
    `<img src="https://flagcdn.com/w40/${own.flag}.png" onerror="this.src='https://flagcdn.com/w40/un.png'">`;
  document.getElementById('abAttackerName').textContent = own.german;
  document.getElementById('abAttackerTroops').textContent = formatTroops(ownTroops);

  document.getElementById('abDefenderFlag').innerHTML =
    `<img src="https://flagcdn.com/w40/${enemy.flag}.png" onerror="this.src='https://flagcdn.com/w40/un.png'">`;
  document.getElementById('abDefenderName').textContent = enemy.german;
  document.getElementById('abDefenderTroops').textContent = formatTroops(enemyTroops);

  attackSlider.disabled = false;
  attackBtn.disabled = false;
  attackBtn.textContent = '⚔ ANGRIFF';
  document.getElementById('warProgressWrap').style.display = 'none';

  updateSliderLabels();
  attackBar.classList.remove('hidden');
}

function updateSliderLabels() {
  if (!selectedOwn || !selectedEnemy) return;
  const ownTroops = Math.floor(currentTroops[selectedOwn]);
  const enemyTroops = Math.floor(currentTroops[selectedEnemy]);

  const pct = parseInt(attackSlider.value);
  const send = Math.floor(ownTroops * pct / 100);
  const remain = ownTroops - send;

  document.getElementById('abSendLabel').textContent = formatTroops(send);
  document.getElementById('abRemainLabel').textContent = formatTroops(remain);

  const ratio = send / (enemyTroops || 1);
  let label;
  if (ratio > 1.5) label = '🟢 Überlegen';
  else if (ratio > 1.05) label = '🟡 Knapp überlegen';
  else if (ratio > 0.9) label = '🟠 Ausgeglichen';
  else label = '🔴 Unterlegen';
  document.getElementById('abRatioLabel').textContent = label;
}

attackSlider.addEventListener('input', updateSliderLabels);

attackBtn.addEventListener('click', () => {
  if (!war && selectedOwn && selectedEnemy) startBattle();
});

/* ============================================================
   SCHLACHT
============================================================ */
function startBattle() {
  const ownTroops = Math.floor(currentTroops[selectedOwn]);
  const enemyTroops = Math.floor(currentTroops[selectedEnemy]);
  const pct = parseInt(attackSlider.value);
  const send = Math.floor(ownTroops * pct / 100);

  if (send < 1) {
    showToast("Zu wenig Truppen", "Mindestens 1K entsenden.", "warning");
    return;
  }

  currentTroops[selectedOwn] -= send;

  war = {
    attacker: selectedOwn,
    defender: selectedEnemy,
    attTroops: send,
    defTroops: enemyTroops,
    initialAtt: send,
    initialDef: enemyTroops,
    progress: 0,
    lastTick: performance.now()
  };

  // UI in Battle-Modus
  attackSlider.disabled = true;
  attackBtn.disabled = true;
  attackBtn.textContent = '⚔ SCHLACHT';
  document.getElementById('warProgressWrap').style.display = 'block';

  // Flaggen + Front erzeugen
  createWarFlags();

  // Kamera mittig
  const attLayer = countryLayers[war.attacker];
  const defLayer = countryLayers[war.defender];
  const attC = attLayer.getBounds().getCenter();
  const defC = defLayer.getBounds().getCenter();
  map.flyTo([(attC.lat + defC.lat) / 2, (attC.lng + defC.lng) / 2], 5.5, { duration: 0.8 });

  requestAnimationFrame(battleLoop);
  notify("⚔ SCHLACHT um " + countryData[war.defender].german.toUpperCase());
}

function createWarFlags() {
  if (!war) return;

  const att = countryData[war.attacker];
  const def = countryData[war.defender];
  const attC = countryLayers[war.attacker].getBounds().getCenter();
  const defC = countryLayers[war.defender].getBounds().getCenter();

  const dLng = defC.lng - attC.lng;
  const dLat = defC.lat - attC.lat;
  const len = Math.sqrt(dLng * dLng + dLat * dLat) || 0.001;
  const ux = dLng / len, uy = dLat / len;
  const px = -uy, py = ux;

  const numFlags = 5;
  const spread = Math.min(len * 0.5, 2.5);
  const flagLayers = { attacker: [], defender: [] };

  for (let i = 0; i < numFlags; i++) {
    const t = (i - (numFlags - 1) / 2) / numFlags;

    // Angreifer-Flagge
    const attLat = attC.lat + py * spread * t;
    const attLng = attC.lng + px * spread * t;
    const attIcon = L.divIcon({
      className: 'war-flag-wrap',
      html: `<img class="war-flag-img attacker"
                  src="https://flagcdn.com/w40/${att.flag}.png"
                  onerror="this.src='https://flagcdn.com/w40/un.png'">`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    flagLayers.attacker.push(L.marker([attLat, attLng], {
      icon: attIcon, interactive: false, zIndexOffset: 3000
    }).addTo(map));

    // Verteidiger-Flagge
    const defLat = defC.lat + py * spread * t;
    const defLng = defC.lng + px * spread * t;
    const defIcon = L.divIcon({
      className: 'war-flag-wrap',
      html: `<img class="war-flag-img defender"
                  src="https://flagcdn.com/w40/${def.flag}.png"
                  onerror="this.src='https://flagcdn.com/w40/un.png'">`,
      iconSize: [0, 0], iconAnchor: [0, 0]
    });
    flagLayers.defender.push(L.marker([defLat, defLng], {
      icon: defIcon, interactive: false, zIndexOffset: 3000
    }).addTo(map));
  }

  // Frontlinie
  const pts = [];
  for (let i = -10; i <= 10; i++) {
    const t = i / 10;
    pts.push([attC.lat + py * spread * t * 0.8, attC.lng + px * spread * t * 0.8]);
  }
  const frontLine = L.polyline(pts, {
    color: '#ffd54f', weight: 3, opacity: 0.9,
    dashArray: '10,8', interactive: false
  }).addTo(map);

  warFlags = [
    ...flagLayers.attacker,
    ...flagLayers.defender,
    frontLine
  ];

  warFlagData = {
    flagLayers, frontLine, spread,
    ux, uy, px, py, len,
    attLat: attC.lat, attLng: attC.lng
  };
}

function updateWarFlags() {
  if (!war || !warFlagData) return;

  const { flagLayers, frontLine, spread, ux, uy, px, py, len, attLat, attLng } = warFlagData;
  const frontPos = 0.4 + war.progress * 0.55;
  const frontLat = attLat + uy * len * frontPos;
  const frontLng = attLng + ux * len * frontPos;

  flagLayers.attacker.forEach((m, i) => {
    const t = (i - (flagLayers.attacker.length - 1) / 2) / flagLayers.attacker.length;
    m.setLatLng([
      frontLat + py * spread * t - uy * 0.08,
      frontLng + px * spread * t - ux * 0.08
    ]);
  });
  flagLayers.defender.forEach((m, i) => {
    const t = (i - (flagLayers.defender.length - 1) / 2) / flagLayers.defender.length;
    m.setLatLng([
      frontLat + py * spread * t + uy * 0.08,
      frontLng + px * spread * t + ux * 0.08
    ]);
  });

  if (frontLine) {
    const pts = [];
    for (let i = -10; i <= 10; i++) {
      const t = i / 10;
      pts.push([
        frontLat + py * spread * t * 0.8,
        frontLng + px * spread * t * 0.8
      ]);
    }
    frontLine.setLatLngs(pts);
  }
}

function destroyWarFlags() {
  warFlags.forEach(l => map.removeLayer(l));
  warFlags = [];
  warFlagData = null;
}

function battleLoop(now) {
  if (!war) return;

  const dt = Math.min(0.05, (now - war.lastTick) / 1000);
  war.lastTick = now;

  // Truppenverluste
  war.attTroops = Math.max(0, war.attTroops - war.defTroops * 0.06 * dt);
  war.defTroops = Math.max(0, war.defTroops - war.attTroops * 0.06 * dt);
  war.progress = 1 - war.defTroops / war.initialDef;

  // UI Update
  document.getElementById('abAttackerTroops').textContent = formatTroops(war.attTroops);
  document.getElementById('abDefenderTroops').textContent = formatTroops(war.defTroops);
  const pct = Math.round(war.progress * 100);
  document.getElementById('warProgressFill').style.width = pct + '%';
  document.getElementById('warProgressText').textContent = 'SCHLACHT — ' + pct + '% erobert';

  // Verteidiger-Land färbt sich graduell
  const defLayer = countryLayers[war.defender];
  if (defLayer) {
    const defColor = countryData[war.defender].color;
    const mixed = interpolateColor(defColor, "#22d3ee", war.progress);
    defLayer.setStyle({
      fillColor: mixed, fillOpacity: 0.88,
      color: mixed, weight: 0.5, opacity: 0.9
    });
  }

  updateWarFlags();

  if (war.defTroops <= 0.5) { endBattle(true); return; }
  if (war.attTroops <= 0.5) { endBattle(false); return; }

  requestAnimationFrame(battleLoop);
}

function endBattle(attackerWon) {
  if (!war) return;

  const attackerIso = war.attacker;
  const defenderIso = war.defender;
  const attackerInfo = countryData[attackerIso];
  const defenderInfo = countryData[defenderIso];

  const survivors = Math.floor(war.attTroops);
  const defendersLeft = Math.floor(war.defTroops);

  destroyWarFlags();

  if (attackerWon) {
    conqueredCountries.add(defenderIso);
    currentTroops[defenderIso] = survivors;
    player.territories = conqueredCountries.size + 1;
    player.money += 200;

    showToast("SIEG!",
      `${attackerInfo.german} erobert ${defenderInfo.german}! ${formatTroops(survivors)} stationiert.`,
      "success", 5000);
    notify("🏆 " + defenderInfo.german + " erobert!");
  } else {
    currentTroops[defenderIso] = defendersLeft;
    showToast("NIEDERLAGE",
      `${defenderInfo.german} hat standgehalten! ${formatTroops(defendersLeft)} überleben.`,
      "error", 5000);
    notify("💀 Angriff auf " + defenderInfo.german + " gescheitert!");
  }

  war = null;
  selectedEnemy = null;
  attackBar.classList.remove('war-mode');
  attackBar.classList.add('hidden');
  document.getElementById('warProgressWrap').style.display = 'none';
  document.getElementById('warProgressFill').style.width = '0%';

  refreshAllCountries();
  refreshAllLabels();
  updateUI();
  updateAttackBar();

  setTimeout(() => map.flyTo(EUROPE_CENTER, 4.5, { duration: 1 }), 800);
}

/* ============================================================
   UI UPDATE
============================================================ */
function updateUI() {
  const n = player.nation;
  document.getElementById('nationName').textContent = n ? n.german : 'No Nation';

  const flagEl = document.getElementById('flag');
  if (n) {
    flagEl.innerHTML = `<img src="https://flagcdn.com/w80/${n.flag}.png" onerror="this.src='https://flagcdn.com/w80/un.png'">`;
  } else {
    flagEl.innerHTML = `<span style="font-size:24px">🌐</span>`;
  }

  document.getElementById('population').textContent = player.population + 'M';
  document.getElementById('money').textContent = Math.floor(player.money);
  document.getElementById('moneyTop').textContent = Math.floor(player.money);
  const terr = n ? conqueredCountries.size + 1 : 0;
  document.getElementById('territories').textContent = terr;
  document.getElementById('terrTop').textContent = terr;

  let total = 0;
  if (n) {
    total += currentTroops[n.iso] || 0;
    conqueredCountries.forEach(iso => total += currentTroops[iso] || 0);
  }
  document.getElementById('totalTroops').textContent = formatTroops(total);
  document.getElementById('troopsTop').textContent = formatTroops(total);

  updateTarget();
  updateSourceInfo();
}

function updateTarget() {
  const el = document.getElementById('target');
  if (!selectedEnemy) {
    el.innerHTML = '<span class="small">Klicke ein Feindland auf der Karte.</span>';
    return;
  }
  const info = countryData[selectedEnemy];
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px">
      <img src="https://flagcdn.com/w40/${info.flag}.png" style="width:24px;height:16px;border-radius:2px">
      ${info.german}
    </div>
    <div class="stat"><span>Truppen</span><span class="red">${formatTroops(currentTroops[selectedEnemy])}</span></div>
    <div class="stat"><span>Bevölkerung</span><span>${info.population}M</span></div>`;
}

function updateSourceInfo() {
  const el = document.getElementById('sourceInfo');
  if (!selectedOwn) {
    el.innerHTML = '<span class="small">Klicke ein eigenes Land auf der Karte.</span>';
    return;
  }
  const info = countryData[selectedOwn];
  const isHome = player.nation && player.nation.iso === selectedOwn;
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px">
      <img src="https://flagcdn.com/w40/${info.flag}.png" style="width:24px;height:16px;border-radius:2px">
      ${info.german} ${isHome ? '🏛️' : ''}
    </div>
    <div class="stat"><span>Truppen</span><span class="cyan">${formatTroops(currentTroops[selectedOwn])}</span></div>
    ${isHome ? '' : `<div class="stat"><span>Status</span><span class="yellow">Erobert</span></div>`}`;
}

/* ============================================================
   AKTIONEN
============================================================ */
function collectTaxes() {
  if (!player.nation) return showToast("Aktion blockiert", "Wähle zuerst eine Nation.", "warning");
  const gain = 50 * (conqueredCountries.size + 1);
  player.money += gain;
  updateUI();
  showToast("Steuern eingezogen", `+${gain} 💰`, "success");
}

function recruit() {
  if (!player.nation) return showToast("Aktion blockiert", "Wähle zuerst eine Nation.", "warning");
  if (player.money < 100) return showToast("Zu wenig Geld", "Rekrutierung kostet 100 💰.", "error");
  player.money -= 100;
  currentTroops[player.nation.iso] += 50000;
  updateUI();
  showToast("Rekrutiert", "+50K Truppen in " + player.nation.german, "success");
}

function buildFactory() {
  if (!player.nation) return showToast("Aktion blockiert", "Wähle zuerst eine Nation.", "warning");
  if (player.money < 500) return showToast("Zu wenig Geld", "Fabrik kostet 500 💰.", "error");
  player.money -= 500;
  player.income += 30;
  updateUI();
  showToast("Fabrik gebaut", "+30 💰 monatlich", "success");
}

/* ============================================================
   MENUS
============================================================ */
function openCountryMenu() {
  let html = '';
  Object.keys(countryData).forEach(iso => {
    const c = countryData[iso];
    const owned = isPlayerOwned(iso);
    html += `
      <div class="country" onclick="onCountryClick('${iso}');closeModal()">
        <img class="flag-mini" src="https://flagcdn.com/w40/${c.flag}.png"
             onerror="this.src='https://flagcdn.com/w40/un.png'">
        <div class="country-body">
          <div class="country-name">${c.german} ${owned ? '🔵' : ''}</div>
          <div class="country-info">Truppen: ${formatTroops(currentTroops[iso])} · Pop: ${c.population}M</div>
        </div>
      </div>`;
  });
  openModal("EUROPEAN NATIONS", html);
}

function openBuildMenu() {
  openModal("CONSTRUCTION", `
    <div class="country" onclick="buildFactory();closeModal()">
      <div class="country-body">
        <div class="country-name">🏭 Factory</div>
        <div class="country-info">Cost: 500 💰 — +30 monthly income</div>
      </div>
    </div>`);
}

function openMilitary() {
  openModal("MILITARY", `
    <div class="box">
      <div class="big">⚔ ${formatTroops(player.nation ? currentTroops[player.nation.iso] : 0)}</div>
      <div class="small">HOME TROOPS</div>
    </div>
    <div class="country" onclick="recruit();closeModal()">
      <div class="country-body">
        <div class="country-name">🪖 Recruit +50K</div>
        <div class="country-info">Cost: 100 💰</div>
      </div>
    </div>`);
}

function openModal(title, content) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

/* ============================================================
   MAP CONTROLS
============================================================ */
function zoomMap(dir) { dir > 0 ? map.zoomIn(0.5) : map.zoomOut(0.5); }
function resetMap() { map.flyTo(EUROPE_CENTER, 4.5, { duration: 0.8 }); }

/* ============================================================
   TOASTS / NOTIFY
============================================================ */
function notify(text) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0.85'; }, 3000);
}

function showToast(title, message, type = 'info', duration = 3500) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'toast' + (type !== 'info' ? ' ' + type : '');
  toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-msg">${message}</div>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

/* ============================================================
   SPEED / TIME
============================================================ */
let speed = 1;
function setSpeed(v) {
  speed = v;
  document.getElementById('speedText').textContent = v === 0 ? 'PAUSED' : v + '×';
}

let year = 2026, month = 0;
const months = ["January","February","March","April","May","June",
  "July","August","September","October","November","December"];

setInterval(() => {
  if (!player.nation || speed === 0 || war) return;
  month += speed;
  while (month >= 12) { month -= 12; year++; }

  document.getElementById('year').textContent = year;
  document.getElementById('month').textContent = months[month];
  document.getElementById('mapYear').textContent = year;
  document.getElementById('mapMonth').textContent = months[month].toUpperCase();

  player.money += player.income * speed;
  updateUI();
}, 5000);

/* ============================================================
   SAVE / LOAD / NEW
============================================================ */
function saveGame() {
  localStorage.setItem("ironNationsSave", JSON.stringify({
    player,
    conquered: [...conqueredCountries],
    currentTroops,
    year, month
  }));
  showToast("Gespeichert", "Fortschritt gesichert.", "success");
}

function loadGame() {
  const raw = localStorage.getItem("ironNationsSave");
  if (!raw) return showToast("Kein Save", "Kein Spielstand gefunden.", "warning");
  try {
    const d = JSON.parse(raw);
    player = d.player;
    conqueredCountries.clear();
    (d.conquered || []).forEach(iso => conqueredCountries.add(iso));
    if (d.currentTroops) Object.assign(currentTroops, d.currentTroops);
    year = d.year; month = d.month;
    selectedOwn = null; selectedEnemy = null; war = null;

    document.getElementById('year').textContent = year;
    document.getElementById('month').textContent = months[month];
    document.getElementById('mapYear').textContent = year;
    document.getElementById('mapMonth').textContent = months[month].toUpperCase();

    refreshAllCountries();
    refreshAllLabels();
    updateUI();
    attackBar.classList.add('hidden');
    showToast("Geladen", "Spielstand wiederhergestellt.", "success");
  } catch (e) {
    console.error(e);
    showToast("Fehler", "Spielstand beschädigt.", "error");
  }
}

function newGame() {
  player = { nation: null, money: 1000, territories: 0, population: 0, income: 50 };
  selectedOwn = null; selectedEnemy = null; war = null;
  conqueredCountries.clear();
  Object.keys(countryData).forEach(iso => {
    currentTroops[iso] = countryData[iso].military * 10000;
  });
  year = 2026; month = 0; speed = 1;
  document.getElementById('year').textContent = '2026';
  document.getElementById('month').textContent = 'January';
  document.getElementById('mapYear').textContent = '2026';
  document.getElementById('mapMonth').textContent = 'JANUARY';
  document.getElementById('speedText').textContent = '1×';

  refreshAllCountries();
  refreshAllLabels();
  updateUI();
  resetMap();
  destroyWarFlags();
  attackBar.classList.add('hidden');
  showToast("Neues Spiel", "Wähle eine Nation auf der Karte.", "info");
}

/* ============================================================
   START
============================================================ */
updateUI();
</script>

</body>
</html>
