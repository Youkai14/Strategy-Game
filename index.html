<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WW2 Taktik</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #2a3138, #14181c 70%);
    color: #e6e6e6;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #game {
    display: flex; gap: 18px;
    background: #23282e;
    padding: 18px;
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.7);
    border: 1px solid #333a42;
  }
  canvas { border-radius: 8px; display: block; cursor: crosshair; }

  #sidebar { width: 250px; display: flex; flex-direction: column; gap: 10px; }

  h1 {
    font-size: 15px; margin: 0; letter-spacing: 2px;
    text-transform: uppercase; color: #8fb8e8;
  }

  .turn {
    padding: 9px 12px; border-radius: 8px; font-weight: 700;
    font-size: 13px; letter-spacing: 1px; text-align: center;
    text-transform: uppercase; transition: .2s;
  }
  .turn.player { background: #1c3d66; color: #7fb6ff; border: 1px solid #2f6fd0; }
  .turn.enemy  { background: #5a1c1c; color: #ff9b9b; border: 1px solid #c0392b; }

  .panel {
    background: #1a1f24; border: 1px solid #2e363e;
    border-radius: 8px; padding: 12px; font-size: 13px;
    min-height: 140px;
  }
  .panel .unit-name {
    font-weight: 700; font-size: 15px; margin-bottom: 8px;
    color: #9fd0ff; letter-spacing: .5px;
  }
  .panel .unit-name.enemy { color: #ff9b9b; }
  .stat { display: flex; justify-content: space-between; padding: 3px 0; color: #a8b4bf; }
  .stat b { color: #e6e6e6; font-variant-numeric: tabular-nums; }
  .hint { color: #6e7a86; line-height: 1.5; font-size: 12px; }

  button {
    padding: 11px; border-radius: 8px; border: 1px solid #2f6fd0;
    background: linear-gradient(#2f6fd0, #2357a8); color: #fff;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    text-transform: uppercase; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.2); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .log {
    background: #16191d; border: 1px solid #262d34; border-radius: 8px;
    padding: 8px 10px; font-size: 11px; line-height: 1.5;
    height: 130px; overflow-y: auto; color: #8b98a5;
    font-family: 'Consolas', monospace;
  }
  .log div { padding: 1px 0; }
  .log .hl { color: #ffd27f; }
  .log .kill { color: #ff7b7b; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" width="600" height="500"></canvas>
  <div id="sidebar">
    <h1>⚔ WW2 Taktik</h1>
    <div id="turn" class="turn player">Dein Zug</div>
    <div id="info" class="panel"></div>
    <button id="endTurn">Zug beenden</button>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
/* ============================================================
   KONSTANTEN
   ============================================================ */
const COLS = 12, ROWS = 10, TILE = 50;

const TERRAIN = {
  plain:  { name: 'Ebene',    cost: 1,        def: 0.00, color: '#7ea85f' },
  forest: { name: 'Wald',     cost: 2,        def: 0.25, color: '#3f6b3a' },
  hills:  { name: 'Hügel',    cost: 2,        def: 0.30, color: '#a8925f' },
  water:  { name: 'Wasser',   cost: Infinity, def: 0.00, color: '#3d6fa5' },
  city:   { name: 'Stadt',    cost: 1,        def: 0.40, color: '#9c9c9c' }
};

const UNIT_TYPES = {
  infantry:  { name: 'Infanterie', hp: 100, move: 3, range: 1, dmg: 35, symbol: 'I' },
  tank:      { name: 'Panzer',     hp: 160, move: 4, range: 1, dmg: 55, symbol: 'P' },
  artillery: { name: 'Artillerie', hp: 80,  move: 2, range: 3, dmg: 60, symbol: 'A' }
};

const PLAYER_COLOR = '#2f6fd0';
const ENEMY_COLOR  = '#c0392b';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  map: [],
  units: [],
  turn: 'player',
  selected: null,
  moveTiles: new Set(),
  attackTiles: new Set(),
  busy: false,
  gameOver: false,
  logs: []
};

let unitIdCounter = 0;

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
const key = (x, y) => x + ',' + y;
const unkey = k => k.split(',').map(Number);
const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function unitAt(x, y) {
  return state.units.find(u => u.x === x && u.y === y && u.hp > 0);
}

/* ============================================================
   KARTEN-GENERIERUNG
   ============================================================ */
function generateMap() {
  let m;
  let attempts = 0;
  do {
    m = [];
    for (let y = 0; y < ROWS; y++) m.push(new Array(COLS).fill('plain'));

    // Symmetrische Zufallskarte (linke Hälfte wird gespiegelt)
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS / 2; x++) {
        let t = 'plain';
        const r = Math.random();
        if (r < 0.20) t = 'forest';
        else if (r < 0.32) t = 'hills';
        else if (r < 0.38) t = 'water';
        m[y][x] = t;
        m[y][COLS - 1 - x] = t;
      }
    }

    // Aufstellungszonen freiräumen
    for (let y = 0; y < ROWS; y++) {
      for (const x of [0, 1, COLS - 2, COLS - 1]) {
        if (m[y][x] === 'water') m[y][x] = 'plain';
      }
    }

    // Städte (symmetrisch, in der Nähe der Mitte)
    for (const [cx, cy] of [[4, 2], [4, 7]]) {
      m[cy][cx] = 'city';
      m[cy][COLS - 1 - cx] = 'city';
    }

    attempts++;
  } while (!mapIsConnected(m) && attempts < 30);

  return m;
}

function mapIsConnected(m) {
  const seen = new Set();
  const start = [1, Math.floor(ROWS / 2)];
  const stack = [start];
  while (stack.length) {
    const [x, y] = stack.pop();
    const k = key(x, y);
    if (seen.has(k)) continue;
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) continue;
    if (TERRAIN[m[y][x]].cost === Infinity) continue;
    seen.add(k);
    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  return seen.has(key(COLS - 2, Math.floor(ROWS / 2)));
}

/* ============================================================
   EINHEITEN ERZEUGEN
   ============================================================ */
function createUnit(side, typeKey, x, y) {
  const t = UNIT_TYPES[typeKey];
  return {
    id: ++unitIdCounter,
    side, type: typeKey,
    name: t.name,
    x, y,
    hp: t.hp, maxHp: t.hp,
    move: t.move, range: t.range, dmg: t.dmg,
    symbol: t.symbol,
    hasMoved: false,
    acted: false
  };
}

function setupUnits() {
  state.units = [];
  const layout = [
    ['infantry',  1],
    ['tank',      3],
    ['infantry',  5],
    ['artillery', 6],
    ['tank',      8]
  ];
  for (const [type, y] of layout) {
    state.units.push(createUnit('player', type, 1, y));
    state.units.push(createUnit('enemy',  type, COLS - 2, y));
  }
}

/* ============================================================
   BEWEGUNGSBERECHNUNG (Dijkstra auf Grid)
   ============================================================ */
function computeReachable(unit) {
  const dist = {};
  dist[key(unit.x, unit.y)] = 0;

  const occupied = new Set(
    state.units
      .filter(u => u.hp > 0 && u !== unit)
      .map(u => key(u.x, u.y))
  );

  const frontier = [[0, unit.x, unit.y]];

  while (frontier.length) {
    frontier.sort((a, b) => a[0] - b[0]);
    const [cost, x, y] = frontier.shift();
    if (cost > dist[key(x, y)]) continue;

    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;

      const terr = TERRAIN[state.map[ny][nx]];
      if (terr.cost === Infinity) continue;

      const k = key(nx, ny);
      if (occupied.has(k)) continue;

      const nc = cost + terr.cost;
      if (nc <= unit.move && (dist[k] === undefined || nc < dist[k])) {
        dist[k] = nc;
        frontier.push([nc, nx, ny]);
      }
    }
  }
  return dist;
}

function attackTargets(unit) {
  return state.units.filter(o =>
    o.side !== unit.side && o.hp > 0 && manhattan(unit, o) <= unit.range
  );
}

/* ============================================================
   RENDERING
   ============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function draw() {
  // --- Gelände ---
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = TERRAIN[state.map[y][x]];
      ctx.fillStyle = t.color;
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);

      // leichte Textur
      if (t === TERRAIN.forest) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        for (let i = 0; i < 3; i++) {
          const px = x * TILE + 10 + i * 14;
          const py = y * TILE + 18 + (i % 2) * 12;
          ctx.beginPath();
          ctx.arc(px, py, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (t === TERRAIN.hills) {
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x * TILE + 8,  y * TILE + 34);
        ctx.quadraticCurveTo(x * TILE + 25, y * TILE + 12, x * TILE + 42, y * TILE + 34);
        ctx.stroke();
      } else if (t === TERRAIN.water) {
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 2; i++) {
          const wy = y * TILE + 18 + i * 16;
          ctx.beginPath();
          ctx.moveTo(x * TILE + 10, wy);
          ctx.quadraticCurveTo(x * TILE + 25, wy - 5, x * TILE + 40, wy);
          ctx.stroke();
        }
      } else if (t === TERRAIN.city) {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x * TILE + 12, y * TILE + 14, 12, 22);
        ctx.fillRect(x * TILE + 26, y * TILE + 20, 12, 16);
      }
    }
  }

  // --- Raster ---
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * TILE, 0); ctx.lineTo(x * TILE, ROWS * TILE); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * TILE); ctx.lineTo(COLS * TILE, y * TILE); ctx.stroke();
  }

  // --- Bewegungsfelder ---
  ctx.fillStyle = 'rgba(80,160,255,0.30)';
  for (const k of state.moveTiles) {
    const [x, y] = unkey(k);
    ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
  }

  // --- Angriffsfelder ---
  ctx.fillStyle = 'rgba(255,70,70,0.35)';
  for (const k of state.attackTiles) {
    const [x, y] = unkey(k);
    ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
  }

  // --- Einheiten ---
  for (const u of state.units) if (u.hp > 0) drawUnit(u);

  // --- Auswahlring ---
  if (state.selected) {
    const u = state.selected;
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(u.x * TILE + TILE / 2, u.y * TILE + TILE / 2, TILE * 0.42, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawUnit(u) {
  const cx = u.x * TILE + TILE / 2;
  const cy = u.y * TILE + TILE / 2;
  const r = TILE * 0.34;
  const col = u.side === 'player' ? PLAYER_COLOR : ENEMY_COLOR;

  // Schatten
  ctx.beginPath();
  ctx.arc(cx, cy + 3, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();

  // Körper
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.stroke();

  // Symbol
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 17px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(u.symbol, cx, cy + 1);

  // HP-Balken
  const bw = TILE * 0.72, bh = 5;
  const bx = cx - bw / 2;
  const by = u.y * TILE + TILE - 9;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bx, by, bw, bh);
  const pct = Math.max(0, u.hp / u.maxHp);
  ctx.fillStyle = pct > 0.5 ? '#4caf50' : pct > 0.25 ? '#ffb300' : '#e53935';
  ctx.fillRect(bx, by, bw * pct, bh);

  // "Bereits gehandelt"-Verdunkelung
  if (u.acted && u.side === 'player' && !state.busy) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fill();
  }
}

/* ============================================================
   UI
   ============================================================ */
const turnEl = document.getElementById('turn');
const infoEl = document.getElementById('info');
const logEl  = document.getElementById('log');
const btnEnd = document.getElementById('endTurn');

function log(msg, cls = '') {
  state.logs.push({ msg, cls });
  if (state.logs.length > 40) state.logs.shift();
  logEl.innerHTML = state.logs
    .slice(-14)
    .map(l => `<div class="${l.cls}">${l.msg}</div>`)
    .join('');
  logEl.scrollTop = logEl.scrollHeight;
}

function updateUI() {
  // Zug-Anzeige
  if (state.gameOver) {
    turnEl.className = 'turn ' + (state.winner === 'player' ? 'player' : 'enemy');
    turnEl.textContent = state.winner === 'player' ? '🏆 Sieg!' : '💀 Niederlage';
  } else {
    turnEl.className = 'turn ' + state.turn;
    turnEl.textContent = state.turn === 'player'
      ? (state.busy ? 'Feindzug...' : 'Dein Zug')
      : 'Feindzug...';
  }

  // Info-Panel
  const u = state.selected;
  if (u) {
    const terr = TERRAIN[state.map[u.y][u.x]];
    infoEl.innerHTML = `
      <div class="unit-name ${u.side === 'enemy' ? 'enemy' : ''}">${u.name}</div>
      <div class="stat"><span>Trefferpunkte</span><b>${u.hp} / ${u.maxHp}</b></div>
      <div class="stat"><span>Bewegung</span><b>${u.move}</b></div>
      <div class="stat"><span>Reichweite</span><b>${u.range}</b></div>
      <div class="stat"><span>Schaden</span><b>${u.dmg}</b></div>
      <div class="stat"><span>Gelände</span><b>${terr.name} (${Math.round(terr.def * 100)}%)</b></div>
    `;
  } else {
    infoEl.innerHTML = `<div class="hint">
      Klicke eine <b style="color:#7fb6ff">blaue Einheit</b>, um sie auszuwählen.<br><br>
      ▸ <b>Blaue Felder</b> = Bewegungsreichweite<br>
      ▸ <b>Rote Felder</b> = Angriffsziele<br>
      ▸ Einheiten können sich bewegen <i>und</i> angreifen.<br><br>
      Gelände gibt Verteidigungsboni: Wald +25%, Hügel +30%, Stadt +40%.<br>
      Wasser ist unpassierbar.
    </div>`;
  }

  btnEnd.disabled = state.turn !== 'player' || state.busy || state.gameOver;
}

/* ============================================================
   SPIELER-AKTIONEN
   ============================================================ */
function selectUnit(u) {
  state.selected = u;
  state.moveTiles = new Set(u.hasMoved ? [] : Object.keys(computeReachable(u)));
  state.attackTiles = new Set(attackTargets(u).map(t => key(t.x, t.y)));
  updateUI();
  draw();
}

function deselect() {
  state.selected = null;
  state.moveTiles.clear();
  state.attackTiles.clear();
  updateUI();
  draw();
}

function onTileClick(x, y) {
  if (state.turn !== 'player' || state.busy || state.gameOver) return;

  const clicked = unitAt(x, y);
  const k = key(x, y);

  // 1) Angriff ausführen
  if (state.selected && state.attackTiles.has(k) && clicked && clicked.side === 'enemy') {
    doAttack(state.selected, clicked);
    return;
  }

  // 2) Eigene Einheit auswählen
  if (clicked && clicked.side === 'player') {
    if (clicked.acted) return; // schon gehandelt
    if (state.selected && state.selected !== clicked && state.selected.hasMoved) {
      state.selected.acted = true;
    }
    selectUnit(clicked);
    return;
  }

  // 3) Bewegung
  if (state.selected && !state.selected.hasMoved && state.moveTiles.has(k)) {
    moveUnit(state.selected, x, y);
    return;
  }

  // 4) Auswahl aufheben
  if (state.selected) {
    if (state.selected.hasMoved) state.selected.acted = true;
    deselect();
  }
}

function moveUnit(u, x, y) {
  u.x = x;
  u.y = y;
  u.hasMoved = true;

  state.moveTiles.clear();
  state.attackTiles = new Set(attackTargets(u).map(t => key(t.x, t.y)));

  if (state.attackTiles.size === 0) {
    // Keine Ziele in Reichweite → Einheit ist fertig
    u.acted = true;
    deselect();
  } else {
    updateUI();
    draw();
  }
}

function doAttack(attacker, defender) {
  resolveAttack(attacker, defender);
  cleanupDead();

  attacker.acted = true;
  deselect();

  if (checkGameOver()) return;
  updateUI();
  draw();
}

function resolveAttack(a, d) {
  const dTerr = TERRAIN[state.map[d.y][d.x]];
  let dmg = Math.round(a.dmg * (0.85 + Math.random() * 0.3) * (1 - dTerr.def));
  dmg = Math.max(1, dmg);
  d.hp -= dmg;
  log(`${a.name} → ${d.name}: ${dmg} Schaden`, 'hl');

  // Gegenangriff
  if (d.hp > 0 && d.range >= manhattan(a, d)) {
    const aTerr = TERRAIN[state.map[a.y][a.x]];
    let ctr = Math.round(d.dmg * 0.5 * (0.85 + Math.random() * 0.3) * (1 - aTerr.def));
    ctr = Math.max(1, ctr);
    a.hp -= ctr;
    log(`${d.name} kontert: ${ctr} Schaden`, '');
  }
}

function cleanupDead() {
  const dead = state.units.filter(u => u.hp <= 0);
  for (const u of dead) {
    log(`☠ ${u.name} (${u.side === 'player' ? 'Blau' : 'Rot'}) zerstört!`, 'kill');
  }
  state.units = state.units.filter(u => u.hp > 0);
}

function checkGameOver() {
  const hasPlayer = state.units.some(u => u.side === 'player');
  const hasEnemy  = state.units.some(u => u.side === 'enemy');
  if (hasPlayer && hasEnemy) return false;

  state.gameOver = true;
  state.winner = hasPlayer ? 'player' : 'enemy';
  state.selected = null;
  state.moveTiles.clear();
  state.attackTiles.clear();
  log(state.winner === 'player'
    ? '🏆 SIEG! Alle feindlichen Einheiten vernichtet.'
    : '💀 NIEDERLAGE. Deine Armee wurde aufgerieben.', 'hl');
  updateUI();
  draw();
  return true;
}

/* ============================================================
   ZUGWECHSEL & KI
   ============================================================ */
function endTurn() {
  if (state.gameOver || state.busy) return;

  if (state.turn === 'player') {
    // Auswahl aufräumen
    if (state.selected && state.selected.hasMoved) state.selected.acted = true;
    deselect();

    state.turn = 'enemy';
    state.units.filter(u => u.side === 'enemy').forEach(u => {
      u.acted = false; u.hasMoved = false;
    });
    updateUI();
    draw();
    aiTurn();
  } else {
    state.turn = 'player';
    state.units.filter(u => u.side === 'player').forEach(u => {
      u.acted = false; u.hasMoved = false;
    });
    log('— Dein Zug —', '');
    updateUI();
    draw();
  }
}

async function aiTurn() {
  state.busy = true;
  updateUI();

  const enemies = state.units.filter(u => u.side === 'enemy');

  for (const unit of enemies) {
    if (unit.hp <= 0 || state.gameOver) continue;
    await aiActUnit(unit);
    await sleep(220);
    if (checkGameOver()) { state.busy = false; return; }
  }

  state.busy = false;
  endTurn();
}

async function aiActUnit(unit) {
  const targets = state.units.filter(u => u.side === 'player' && u.hp > 0);
  if (!targets.length) return;

  // --- Ziel wählen: nah, verwundbar, hoher Wert ---
  let target = null, bestScore = Infinity;
  for (const t of targets) {
    const d = manhattan(unit, t);
    let score = d;
    if (t.hp <= unit.dmg) score -= 25;              // kann wahrscheinlich töten
    if (t.type === 'artillery') score -= 8;         // wertvolles Ziel
    if (score < bestScore) { bestScore = score; target = t; }
  }

  // --- Direkt angreifen, wenn bereits in Reichweite? ---
  if (manhattan(unit, target) <= unit.range) {
    await sleep(120);
    resolveAttack(unit, target);
    cleanupDead();
    unit.acted = true;
    draw();
    return;
  }

  // --- Beste Position finden ---
  const reach = computeReachable(unit);
  let best = null, bestPosScore = Infinity;

  for (const k in reach) {
    const [x, y] = unkey(k);
    const d = Math.abs(x - target.x) + Math.abs(y - target.y);

    // In Reichweite = stark bevorzugt; sonst näher heranrücken
    let score = d <= unit.range ? (unit.range - d) : 100 + d;
    score -= TERRAIN[state.map[y][x]].def * 8; // Deckung bevorzugen

    if (score < bestPosScore) { bestPosScore = score; best = { x, y }; }
  }

  if (best && (best.x !== unit.x || best.y !== unit.y)) {
    unit.x = best.x;
    unit.y = best.y;
    unit.hasMoved = true;
    draw();
    await sleep(220);
  }

  // --- Angriff nach Bewegung ---
  const newTargets = attackTargets(unit);
  if (newTargets.length) {
    // Bevorzugt das Ziel, das getötet werden kann
    newTargets.sort((a, b) => (a.hp - b.hp));
    await sleep(120);
    resolveAttack(unit, newTargets[0]);
    cleanupDead();
    draw();
  }

  unit.acted = true;
}

/* ============================================================
   INITIALISIERUNG
   ============================================================ */
function newGame() {
  state.map = generateMap();
  state.turn = 'player';
  state.selected = null;
  state.moveTiles.clear();
  state.attackTiles.clear();
  state.busy = false;
  state.gameOver = false;
  state.winner = null;
  state.logs = [];
  logEl.innerHTML = '';

  setupUnits();

  log('— Dein Zug —', '');
  log('Wähle eine Einheit und rücke vor.', '');
  updateUI();
  draw();
}

/* ============================================================
   EVENTS
   ============================================================ */
cv.addEventListener('click', e => {
  const rect = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * (cv.width / rect.width) / TILE);
  const y = Math.floor((e.clientY - rect.top) * (cv.height / rect.height) / TILE);
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  onTileClick(x, y);
});

btnEnd.addEventListener('click', endTurn);

document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    endTurn();
  }
  if (e.code === 'Escape') {
    if (state.selected) {
      if (state.selected.hasMoved) state.selected.acted = true;
      deselect();
    }
  }
});

newGame();
</script>
