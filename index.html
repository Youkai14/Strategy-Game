<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#eef3f8;
    --panel:#ffffff;
    --panel2:#f7f9fc;
    --border:#d8e0e9;
    --text:#172231;
    --muted:#687789;
    --blue:#1976d2;
    --blue2:#42a5f5;
    --green:#21a366;
    --red:#e53935;
    --orange:#f39c12;
    --purple:#7e57c2;
    --shadow:0 8px 30px rgba(30,55,80,.12);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
        radial-gradient(circle at 20% 20%,rgba(66,165,245,.18),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(126,87,194,.15),transparent 30%),
        linear-gradient(135deg,#f8fbff,#e8eef5);
    display:flex;
    justify-content:center;
    align-items:center;
}

.startBox{
    width:min(620px,92%);
    padding:50px;
    background:rgba(255,255,255,.92);
    border:1px solid white;
    border-radius:24px;
    box-shadow:0 30px 80px rgba(30,60,90,.2);
    text-align:center;
}

.logo{
    font-size:58px;
    font-weight:900;
    letter-spacing:5px;
    color:#15263a;
}

.logo span{
    color:var(--blue);
}

.subtitle{
    margin-top:10px;
    color:var(--muted);
    letter-spacing:5px;
    font-size:13px;
}

.startButtons{
    display:flex;
    flex-direction:column;
    gap:13px;
    margin-top:45px;
}

.startBtn{
    border:0;
    padding:17px;
    border-radius:12px;
    background:#edf3f9;
    color:var(--text);
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

.startBtn:hover{
    transform:translateY(-2px);
    background:#e2ebf5;
}

.startBtn.primary{
    color:white;
    background:linear-gradient(135deg,var(--blue),#1565c0);
    box-shadow:0 8px 20px rgba(25,118,210,.25);
}

.startVersion{
    margin-top:30px;
    color:#9aa7b5;
    font-size:12px;
}

/* =========================
   MAIN GAME
========================= */

#game{
    display:none;
    width:100vw;
    height:100vh;
}

/* TOP BAR */

#topbar{
    position:absolute;
    z-index:1000;
    left:14px;
    right:14px;
    top:14px;
    height:64px;
    background:rgba(255,255,255,.96);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:14px;
}

.gameLogo{
    font-weight:900;
    font-size:18px;
    letter-spacing:2px;
    margin-right:10px;
}

.gameLogo span{
    color:var(--blue);
}

.resource{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 12px;
    border-radius:9px;
    background:var(--panel2);
    border:1px solid var(--border);
    font-size:13px;
}

.resource b{
    font-size:14px;
}

.topSpacer{
    flex:1;
}

.dateBox{
    text-align:right;
}

.date{
    font-weight:bold;
}

.speedSmall{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

/* MAP */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-container{
    background:#dce8f2;
}

/* PANELS */

.panel{
    position:absolute;
    z-index:900;
    background:rgba(255,255,255,.97);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:14px;
    overflow:hidden;
}

#leftPanel{
    top:94px;
    left:14px;
    width:245px;
}

#rightPanel{
    top:94px;
    right:14px;
    width:285px;
}

.panelHeader{
    padding:15px;
    font-weight:bold;
    border-bottom:1px solid var(--border);
    background:#f8fafc;
}

.panelBody{
    padding:12px;
}

/* MENU BUTTONS */

.menuBtn{
    width:100%;
    padding:12px;
    margin-bottom:7px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    color:var(--text);
    text-align:left;
    cursor:pointer;
    font-weight:bold;
    transition:.15s;
}

.menuBtn:hover{
    background:#eef6ff;
    border-color:#a9cbed;
    transform:translateX(2px);
}

.menuBtn.active{
    background:#e7f2ff;
    color:var(--blue);
    border-color:#9ec7ed;
}

/* SELECTED COUNTRY */

.countryTitle{
    font-size:20px;
    font-weight:900;
    margin-bottom:3px;
}

.countrySub{
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
}

.statGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.stat{
    padding:10px;
    background:#f6f8fb;
    border:1px solid var(--border);
    border-radius:8px;
}

.stat span{
    display:block;
    font-size:11px;
    color:var(--muted);
}

.stat b{
    display:block;
    margin-top:3px;
    font-size:14px;
}

/* ACTIONS */

.actionBtn{
    width:100%;
    border:0;
    padding:12px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    margin-top:8px;
    transition:.15s;
}

.actionBtn:hover{
    filter:brightness(.96);
    transform:translateY(-1px);
}

.blue{
    background:#e3f0ff;
    color:#1265b5;
}

.green{
    background:#e4f7ed;
    color:#16814c;
}

.red{
    background:#ffe7e6;
    color:#c62828;
}

.orange{
    background:#fff2dc;
    color:#b56b00;
}

.purple{
    background:#eee8fb;
    color:#6943aa;
}

/* MAP CONTROLS */

#mapControls{
    position:absolute;
    z-index:800;
    left:274px;
    bottom:22px;
    display:flex;
    gap:7px;
}

.mapBtn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    box-shadow:var(--shadow);
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

/* SPEED */

#speedControls{
    position:absolute;
    z-index:900;
    left:50%;
    transform:translateX(-50%);
    bottom:20px;
    display:flex;
    gap:5px;
    background:white;
    padding:6px;
    border:1px solid var(--border);
    border-radius:11px;
    box-shadow:var(--shadow);
}

.speedBtn{
    border:0;
    background:#f2f5f8;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.speedBtn.active{
    background:var(--blue);
    color:white;
}

/* NEWS */

#news{
    position:absolute;
    z-index:800;
    left:50%;
    transform:translateX(-50%);
    top:92px;
    width:min(520px,45%);
    pointer-events:none;
}

.newsItem{
    background:rgba(255,255,255,.96);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    padding:10px 14px;
    border-radius:9px;
    margin-bottom:7px;
    font-size:12px;
    animation:newsIn .25s ease;
}

@keyframes newsIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(20,30,45,.45);
    display:none;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(5px);
}

.modalBox{
    width:min(760px,92%);
    max-height:85vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 30px 100px rgba(0,0,0,.25);
    border:1px solid var(--border);
}

.modalHeader{
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
}

.closeBtn{
    border:0;
    background:#f0f3f6;
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.modalContent{
    padding:20px;
}

/* COUNTRY LIST */

.countryGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:9px;
}

.countryChoice{
    padding:13px;
    background:#f7f9fb;
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:.15s;
}

.countryChoice:hover{
    border-color:#7eb4e5;
    background:#edf6ff;
    transform:translateY(-2px);
}

.countryFlag{
    font-size:26px;
}

.countryName{
    font-weight:bold;
    margin-top:5px;
}

.countryMeta{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

/* WAR */

.warBox{
    padding:18px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:12px;
}

.warTitle{
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:900;
}

.progress{
    height:13px;
    background:#e5eaf0;
    border-radius:20px;
    overflow:hidden;
    margin:13px 0;
}

.progressFill{
    height:100%;
    background:linear-gradient(90deg,#42a5f5,#1565c0);
    transition:width .5s;
}

.frontText{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
}

/* TOAST */

#toast{
    position:fixed;
    z-index:11000;
    bottom:80px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#172231;
    color:white;
    padding:12px 18px;
    border-radius:9px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    box-shadow:var(--shadow);
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:900px){
    #leftPanel{
        width:210px;
    }

    #rightPanel{
        width:240px;
    }

    #mapControls{
        left:230px;
    }

    #news{
        width:35%;
    }
}

@media(max-width:700px){
    #leftPanel,
    #rightPanel{
        display:none;
    }

    #topbar{
        left:7px;
        right:7px;
        top:7px;
        overflow-x:auto;
    }

    .gameLogo{
        display:none;
    }

    .resource{
        white-space:nowrap;
    }

    #news{
        top:80px;
        width:80%;
    }

    #mapControls{
        left:10px;
    }
}
</style>
</head>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="startBox">

        <div class="logo">
            IRON <span>NATIONS</span>
        </div>

        <div class="subtitle">
            GLOBAL GRAND STRATEGY
        </div>

        <div class="startButtons">

            <button class="startBtn primary"
                    onclick="startNewGame()">
                ⚔ NEW GAME
            </button>

            <button class="startBtn"
                    onclick="continueGame()">
                ▶ CONTINUE
            </button>

            <button class="startBtn"
                    onclick="openSettings()">
                ⚙ SETTINGS
            </button>

        </div>

        <div class="startVersion">
            IRON NATIONS • v1.0
        </div>

    </div>

</div>

<!-- =========================
     GAME
========================= -->

<div id="game">

    <div id="topbar">

        <div class="gameLogo">
            IRON <span>NATIONS</span>
        </div>

        <div class="resource">
            💰 <b id="money">0</b>
        </div>

        <div class="resource">
            👥 <b id="population">0</b>
        </div>

        <div class="resource">
            🪖 <b id="military">0</b>
        </div>

        <div class="resource">
            🧑‍🤝‍🧑 <b id="manpower">0</b>
        </div>

        <div class="topSpacer"></div>

        <div class="dateBox">
            <div class="date" id="date">January 1936</div>
            <div class="speedSmall">
                Economy running
            </div>
        </div>

    </div>

    <!-- LEFT -->

    <div id="leftPanel" class="panel">

        <div class="panelHeader">
            COMMAND
        </div>

        <div class="panelBody">

            <button class="menuBtn"
                    onclick="openCountryMenu()">
                🌍 Nations
            </button>

            <button class="menuBtn"
                    onclick="openConstruction()">
                🏭 Construction
            </button>

            <button class="menuBtn"
                    onclick="openDiplomacy()">
                🤝 Diplomacy
            </button>

            <button class="menuBtn"
                    onclick="openResearch()">
                🔬 Research
            </button>

            <button class="menuBtn"
                    onclick="openMilitary()">
                🪖 Military
            </button>

            <button class="menuBtn"
                    onclick="collectTaxes()">
                💰 Collect Taxes
            </button>

            <button class="menuBtn"
                    onclick="saveGame()">
                💾 Save Game
            </button>

            <button class="menuBtn"
                    onclick="loadGame()">
                📂 Load Game
            </button>

            <button class="menuBtn"
                    onclick="returnToMenu()">
                🏠 Main Menu
            </button>

        </div>

    </div>

    <!-- RIGHT -->

    <div id="rightPanel" class="panel">

        <div class="panelHeader">
            NATION
        </div>

        <div class="panelBody">

            <div id="nationInfo">
                Select a country.
            </div>

        </div>

    </div>

    <!-- NEWS -->

    <div id="news"></div>

    <!-- MAP -->

    <div id="map"></div>

    <!-- MAP BUTTONS -->

    <div id="mapControls">

        <button class="mapBtn"
                onclick="map.zoomIn()">+</button>

        <button class="mapBtn"
                onclick="map.zoomOut()">−</button>

        <button class="mapBtn"
                onclick="resetMap()">⌂</button>

    </div>

    <!-- SPEED -->

    <div id="speedControls">

        <button class="speedBtn active"
                onclick="setSpeed(0)">Ⅱ</button>

        <button class="speedBtn"
                onclick="setSpeed(1)">1×</button>

        <button class="speedBtn"
                onclick="setSpeed(2)">2×</button>

        <button class="speedBtn"
                onclick="setSpeed(4)">4×</button>

        <button class="speedBtn"
                onclick="setSpeed(8)">8×</button>

    </div>

</div>

<!-- =========================
     MODAL
========================= -->

<div id="modal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <b id="modalTitle">
                IRON NATIONS
            </b>

            <button class="closeBtn"
                    onclick="closeModal()">
                ×
            </button>

        </div>

        <div class="modalContent"
             id="modalContent">
        </div>

    </div>

</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

   GAME STATE
========================= */

let map;

let geoLayer;

let selectedISO=null;

let speed=0;

let gameRunning=false;

let year=1936;

let month=1;

let conquered={};

let wars=[];

let troops=[];

let selectedWar=null;

let gameInterval=null;

let countryLayers={};


/* =========================
   MAP
========================= */

function initMap(){

    map=L.map("map",{

        zoomControl:false,

        minZoom:2,

        maxZoom:7,

        worldCopyJump:true

    }).setView([25,0],2);


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:7,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    fetch(
        "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson"
    )
    .then(r=>r.json())
    .then(data=>{

        geoLayer=L.geoJSON(data,{

            style:countryStyle,

            onEachFeature:(feature,layer)=>{

                let iso=getISO(feature);

                countryLayers[iso]=layer;

                layer.on({

                    click:()=>countryClicked(iso),

                    mouseover:()=>{

                        layer.setStyle({
                            weight:2,
                            color:"#1976d2",
                            fillOpacity:.85
                        });

                    },

                    mouseout:()=>{

                        refreshCountry(iso);

                    }

                });

            }

        }).addTo(map);

    });

}


/* =========================
   ISO
========================= */

function getISO(feature){

    let p=feature.properties||{};

    return (

        p.ISO_A3 ||

        p.ADM0_A3 ||

        p.WB_A3 ||

        "UNK"

    ).toUpperCase();

}


/* =========================
   COUNTRY STYLE
========================= */

function countryStyle(feature){

    let iso=getISO(feature);

    let base="#b9c5d1";

    if(countries[iso]){

        base=countries[iso].color;

    }

    if(player.nation===iso){

        base="#1976d2";

    }

    if(conquered[iso]){

        base="#42a5f5";

    }

    let enemy=isEnemy(iso);

    if(enemy){

        base="#e05252";

    }

    if(selectedISO===iso){

        return {

            color:"#f5a623",

            weight:3,

            fillColor:"#f5c15a",

            fillOpacity:.85

        };

    }

    return {

        color:"#ffffff",

        weight:1,

        fillColor:base,

        fillOpacity:.72

    };

}


function refreshCountry(iso){

    if(countryLayers[iso]){

        countryLayers[iso].setStyle(
            countryStyle(
                countryLayers[iso].feature
            )
        );

    }

}


/* =========================
   COUNTRY CLICK
========================= */

function countryClicked(iso){

    if(!gameRunning) return;

    selectedISO=iso;

    refreshAllCountries();

    showCountryInfo(iso);

}


function refreshAllCountries(){

    Object.keys(countryLayers)
        .forEach(refreshCountry);

}

   RESET
========================= */

function resetGame(){

        factoriesMilitary:0,

        technology:1,

        income:50

    };

    selectedISO=null;

    conquered={};

    wars=[];

/* =========================
   COUNTRY MENU
========================= */

function openCountryMenu(){

    let list=Object.entries(countries)

        .sort((a,b)=>
            a[1].name.localeCompare(b[1].name)
        )

        .map(([iso,c])=>`

            <div class="countryChoice"
                 onclick="chooseNation('${iso}')">

                </div>

                <div class="countryName">

                </div>

        `<div class="countryGrid">${list}</div>`
    );

}


function chooseNation(iso){

    let c=countries[iso];

    if(!c) return;

    player.nation=iso;

    player.money=c.money;

    player.population=c.population;

    player.military=c.military;

    player.manpower=c.manpower;

    player.factories=c.factories;

    player.territory=1;

    player.income=Math.max(
        30,
        Math.round(c.factories*9+c.population*.4)
    );

    selectedISO=iso;

    conquered={};

    conquered[iso]=true;

    gameRunning=true;

    closeModal();

    updateUI();

    refreshAllCountries();

    map.fitBounds(
        countryLayers[iso]
        ? countryLayers[iso].getBounds()
        : [[-20,-20],[20,20]]
    );

    addNews(
        `${c.flag} ${c.name} has entered the world stage.`
    );

    showCountryInfo(iso);

    startGameLoop();

}


/* =========================
   GAME LOOP
========================= */

function startGameLoop(){

    clearInterval(gameInterval);

    gameInterval=setInterval(()=>{

        if(!gameRunning || speed===0) return;

        for(let i=0;i<speed;i++){

            advanceMonth();

        }

        updateUI();

    },3000);

}


function advanceMonth(){

    month++;

    if(month>12){

        month=1;

        year++;

    }

    /* ECONOMY */

    player.money+=player.income;

    /* MANPOWER */

    player.manpower+=Math.max(
        1,
        Math.floor(player.population*.015)
    );

    /* RESEARCH */

    player.research+=2;

    if(player.research>=100){

        player.research-=100;

        player.technology++;

        addNews(
            `🔬 Technology level increased to ${player.technology}.`
        );

    }

    /* WARS */

    wars.forEach(war=>{

        if(!war.active) return;

        simulateWar(war);

    });

    /* TROOPS */

    moveTroops();

    /* AI */

    if(Math.random()<.04){

        aiWar();

    }

}


/* =========================
   WAR SYSTEM
========================= */

function declareWar(enemyISO){

    if(enemyISO===player.nation){

        return;

    }

    let existing=getWarWith(enemyISO);

    if(existing){

        toast("Du bist bereits im Krieg mit diesem Land.");

        return;

    }

    let enemy=countries[enemyISO] || {

        name:enemyISO,

        flag:"🌍",

        military:10

    };

    let war={

        id:Date.now(),

        enemy:enemyISO,

        active:true,

        progress:0,

        playerLosses:0,

        enemyLosses:0,

        days:0

    };

    wars.push(war);

    selectedWar=war;

    addNews(
        `⚔ War declared on ${enemy.flag} ${enemy.name}!`
    );

    createTroop(enemyISO);

    refreshAllCountries();

    openWar(enemyISO);

}


function getWarWith(iso){

    return wars.find(
        w=>w.active && w.enemy===iso
    );

}


function simulateWar(war){

    war.days+=30;

    let enemy=countries[war.enemy] || {

        military:10,

        name:war.enemy

    };

    let attackPower=

        player.military *

        (0.08+player.technology*.005);

    let defensePower=

        enemy.military*.045;

    let advantage=

        attackPower-defensePower;

    war.progress+=Math.max(
        .4,
        advantage
    );

    war.progress=Math.min(
        100,
        war.progress
    );

    player.military-=Math.max(
        0,
        Math.floor(enemy.military*.002)
    );

    war.enemyLosses+=Math.floor(
        Math.max(1,attackPower*.12)
    );

    war.playerLosses+=Math.floor(
        Math.max(0,defensePower*.08)
    );

    updateWarTroop(war);

    if(war.progress>=100){

        winWar(war);

    }

}


/* =========================
   WIN WAR
========================= */

function winWar(war){

    war.active=false;

    conquered[war.enemy]=true;

    player.territory++;

    player.income+=15;

    let enemy=countries[war.enemy];

    addNews(
        `🏆 ${enemy ? enemy.flag+" "+enemy.name : war.enemy}
        has been conquered.`
    );

    removeWarTroop(war);

    refreshAllCountries();

    updateUI();

}


/* =========================
   RETREAT
========================= */

function retreatWar(war){

    if(!war) return;

    war.active=false;

    removeWarTroop(war);

    addNews(
        `↩ Army retreated from the front.`
    );

    refreshAllCountries();

    updateUI();

}


/* =========================
   WAR WINDOW
========================= */

function openWar(enemyISO){

    let war=getWarWith(enemyISO);

    if(!war){

        war=wars.find(w=>w.enemy===enemyISO);

    }

    if(!war){

        return;

    }

    selectedWar=war;

    let enemy=countries[enemyISO] || {

        name:enemyISO,

        flag:"🌍",

        military:10

    };

    openModal(

        `⚔ ${enemy.flag} ${enemy.name}`,

        warHTML(war)

    );

}


function warHTML(war){

    let enemy=countries[war.enemy] || {

        name:war.enemy,

        flag:"🌍",

        military:10

    };

    return `

        <div class="warBox">

            <div class="warTitle">

                <span>
                    ${countries[player.nation].flag}
                    ${countries[player.nation].name}
                </span>

                <span>
                    ${enemy.flag}
                    ${enemy.name}
                </span>

            </div>

            <div class="progress">

                <div class="progressFill"
                     style="width:${war.progress}%">
                </div>

            </div>

            <div class="frontText">

                <span>
                    Frontline
                </span>

                <b>
                    ${war.progress.toFixed(1)}%
                </b>

            </div>

            <br>

            <div class="statGrid">

                <div class="stat">
                    <span>War days</span>
                    <b>${war.days}</b>
                </div>

                <div class="stat">
                    <span>Enemy losses</span>
                    <b>${war.enemyLosses}</b>
                </div>

                <div class="stat">
                    <span>Your losses</span>
                    <b>${war.playerLosses}</b>
                </div>

                <div class="stat">
                    <span>Army</span>
                    <b>${Math.max(0,Math.floor(player.military))}</b>
                </div>

            </div>

            ${
                war.active
                ?`

                <button class="actionBtn red"
                        onclick="manualAttack(${war.id})">
                    ⚔ Attack
                </button>

                <button class="actionBtn orange"
                        onclick="retreatById(${war.id})">
                    ↩ Retreat
                </button>

                `
                :`

                <button class="actionBtn green"
                        onclick="closeModal()">
                    Continue
                </button>

                `
            }

        </div>

    `;

}


function manualAttack(id){

    let war=wars.find(w=>w.id===id);

    if(!war) return;

    war.progress+=5+player.technology;

    war.enemyLosses+=5;

    player.military-=1;

    if(war.progress>=100){

        war.progress=100;

        winWar(war);

        closeModal();

        return;

    }

    openWar(war.enemy);

    updateUI();

}


function retreatById(id){

    let war=wars.find(w=>w.id===id);

    retreatWar(war);

    closeModal();

}


/* =========================
   TROOPS
========================= */

function createTroop(enemyISO){

    let layer=countryLayers[enemyISO];

    let playerLayer=countryLayers[player.nation];

    if(!layer || !playerLayer) return;

    let a=playerLayer.getBounds().getCenter();

    let b=layer.getBounds().getCenter();

    let marker=L.marker(
        [a.lat,a.lng],
        {
            icon:L.divIcon({

                className:"armyMarker",

                html:`
                    <div style="
                        font-size:25px;
                        filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));
                    ">
                        🪖
                    </div>
                `,

                iconSize:[30,30],

                iconAnchor:[15,15]

            })

        }
    ).addTo(map);

    troops.push({

        marker,

        from:a,

        to:b,

        progress:0,

        enemy:enemyISO

    });

}


function moveTroops(){

    troops.forEach(t=>{

        t.progress+=.012*speed;

        if(t.progress>1){

            t.progress=0;

        }

        let lat=

            t.from.lat+
            (t.to.lat-t.from.lat)*
            t.progress;

        let lng=

            t.from.lng+
            (t.to.lng-t.from.lng)*
            t.progress;

        t.marker.setLatLng([lat,lng]);

    });

}


function updateWarTroop(war){

    /* movement is handled by the global troop animation */

}


function removeWarTroop(war){

    troops=troops.filter(t=>{

        if(t.enemy===war.enemy){

            map.removeLayer(t.marker);

            return false;

        }

        return true;

    });

}

function build(type){

        military:650,

        farm:300

    }[type];

    if(player.money<cost){

        toast("Nicht genug Geld.");

        return;

    player.money-=cost;

    if(type==="civilian"){

        player.factories++;

        player.factoriesCivilian++;

        player.income+=12;

    if(type==="military"){

        player.factories++;

        player.factoriesMilitary++;

        player.military+=2;

    if(type==="farm"){

        player.population+=2;

        player.manpower+=8;

            Math.floor(

/* =========================
   LOAD
========================= */

function loadGame(){

    let raw=localStorage.getItem(
        "ironNationsSave"
    );

    if(!raw){

        toast("No save found.");

        return;

    }

    try{

        let save=JSON.parse(raw);

        player=save.player;

        year=save.year;

        month=save.month;

        conquered=save.conquered || {};

        wars=save.wars || [];

        selectedISO=save.selectedISO ||
                    player.nation;

        gameRunning=true;

        closeModal();

        refreshAllCountries();

        updateUI();

        startGameLoop();

        showCountryInfo(
            selectedISO
        );

        toast("Game loaded.");

    }catch(e){

        alert("Save file is damaged.");

    }

}


/* =========================
   SETTINGS
========================= */

function openSettings(){

    openModal(

        "⚙ Settings",

        `

        <div class="stat">

            <span>Game</span>

            <b>IRON NATIONS</b>

        </div>

        <button class="actionBtn blue"
                onclick="toast('World map enabled.')">
            🌍 World Map
        </button>

        <button class="actionBtn green"
                onclick="toggleFullscreen()">
            ⛶ Fullscreen
        </button>

        <button class="actionBtn red"
                onclick="deleteSave()">
            🗑 Delete Save
        </button>

        `

    );

}


function deleteSave(){

    if(confirm("Delete your save?")){

        localStorage.removeItem(
            "ironNationsSave"
        );

        toast("Save deleted.");

    }

}


function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

}


/* =========================
   MENU
========================= */

function returnToMenu(){

    gameRunning=false;

    clearInterval(gameInterval);

    document.getElementById("game")
        .style.display="none";

    document.getElementById("startScreen")
        .style.display="flex";

}


function resetMap(){

    map.setView([25,0],2);

}


/* =========================
   MODAL
========================= */

function openModal(title,content){

    document.getElementById("modalTitle")
        .textContent=title;

    document.getElementById("modalContent")
        .innerHTML=content;

    document.getElementById("modal")
        .style.display="flex";

}


function closeModal(){

    document.getElementById("modal")
        .style.display="none";

}


/* =========================
   SPEED
========================= */

function setSpeed(value){

    speed=value;

    document.querySelectorAll(".speedBtn")
        .forEach(btn=>
            btn.classList.remove("active")
        );

    let buttons=
        document.querySelectorAll(".speedBtn");

    let index=

        value===0 ? 0 :

        value===1 ? 1 :

        value===2 ? 2 :

        value===4 ? 3 : 4;

    buttons[index]
        .classList.add("active");

    if(speed>0){

        gameRunning=true;

    }

}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("money")
        .textContent=format(player.money);

    document.getElementById("population")
        .textContent=format(player.population)+"M";

    document.getElementById("military")
        .textContent=Math.floor(player.military);

    document.getElementById("manpower")
        .textContent=Math.floor(player.manpower)+"k";

    document.getElementById("date")
        .textContent=

        new Date(
            year,
            month-1,
            1
        ).toLocaleDateString(
            "en-US",
            {
                month:"long",
                year:"numeric"
            }
        );

}


/* =========================
   NEWS
========================= */

function addNews(text){

    let container=
        document.getElementById("news");

    let item=
        document.createElement("div");

    item.className="newsItem";

    item.textContent=text;

    container.prepend(item);

    setTimeout(()=>{

        item.remove();

    },6000);

}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(text){

    let el=
        document.getElementById("toast");

    el.textContent=text;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{

        el.classList.remove("show");

    },2500);

}


/* =========================
   HELPERS
========================= */

function format(number){

    return Math.floor(number)
        .toLocaleString("en-US");

}


function isEnemy(iso){

    return wars.some(
        w=>w.active && w.enemy===iso
    );

}


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    ()=>{

        initMap();

        updateUI();

    }
);


/* CLOSE MODAL WHEN CLICKING
   OUTSIDE
*/

document.getElementById("modal")
    .addEventListener("click",e=>{

        if(e.target.id==="modal"){

            closeModal();

        }

    });


/* =========================
   AUTOSAVE
========================= */

setInterval(()=>{

    if(gameRunning && player.nation){

        let save={

            player,

            year,

            month,

            conquered,

            wars,

            selectedISO

        };

        localStorage.setItem(
            "ironNationsSave",
            JSON.stringify(save)
        );

    }

},30000);

</script>
