<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#071018;
    color:#fff;
}

/* ================= START ================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#203c50 0%,#0b1720 40%,#050a0e 100%);
}

.startBox{
    width:460px;
    max-width:90%;
    padding:40px;
    text-align:center;
    background:rgba(9,19,28,.96);
    border:1px solid #345064;
    border-radius:18px;
    box-shadow:0 30px 100px #000;
}

.logo{
    font-size:44px;
    font-weight:900;
    letter-spacing:5px;
}

.subtitle{
    color:#8999a5;
    margin:12px 0 30px;
}

.startBtn{
    width:100%;
    padding:15px;
    margin:6px 0;
    border:0;
    border-radius:9px;
    color:white;
    background:#187edb;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.startBtn:hover{
    background:#2997f5;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:fixed;
    inset:0;
}

#topbar{
    position:absolute;
    z-index:100;
    top:0;
    left:0;
    right:0;
    height:68px;

    display:flex;
    align-items:center;
    gap:22px;

    padding:8px 18px;

    background:rgba(6,14,21,.96);
    border-bottom:1px solid #263b49;
}

.title{
    font-weight:900;
    letter-spacing:2px;
    margin-right:15px;
}

.stat{
    min-width:80px;
}

.stat small{
    display:block;
    color:#738490;
    font-size:10px;
}

.stat strong{
    font-size:14px;
}

.date{
    margin-left:auto;
    font-weight:bold;
}

.speed{
    display:flex;
    gap:4px;
}

.speed button{
    border:1px solid #314858;
    background:#101e28;
    color:#bbc8d0;
    border-radius:6px;
    padding:7px 10px;
    cursor:pointer;
}

.speed button.active{
    background:#197fdc;
    color:white;
}

/* ================= LEFT MENU ================= */

#leftMenu{
    position:absolute;
    z-index:100;
    top:84px;
    left:14px;

    width:155px;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.menuButton{
    padding:11px;
    border:1px solid #2c4352;
    border-radius:8px;

    background:rgba(9,20,29,.95);
    color:#dce7ed;

    text-align:left;
    cursor:pointer;
}

.menuButton:hover{
    background:#18303f;
}

/* ================= MAP ================= */

#map{
    position:absolute;
    inset:68px 0 0;

    background:
        radial-gradient(circle at center,#1c3748,#09131b);
}

#world{
    width:100%;
    height:100%;
    cursor:grab;
}

#world:active{
    cursor:grabbing;
}

.country{
    stroke:#34434c;
    stroke-width:.7;
}

.country:hover{
    stroke:#fff;
    stroke-width:1.5;
}

.neutral{
    fill:#b9bea4;
}

.player{
    fill:#287cc5;
}

.enemy{
    fill:#7c414b;
}

.conquered{
    fill:#287cc5;
}

.selected{
    stroke:#fff;
    stroke-width:2;
}

/* ================= WAR ================= */

.occupation{
    fill:#2d87d3;
    opacity:.65;
    pointer-events:none;
}

.frontGlow{
    stroke:#ff4545;
    stroke-width:10;
    opacity:.15;
    pointer-events:none;
}

.front{
    stroke:#ff6868;
    stroke-width:2.5;
    stroke-dasharray:8 5;
    pointer-events:none;
}

.frontDot{
    fill:#ff6464;
}

.army{
    cursor:pointer;
}

.armyCircle{
    fill:#0a151d;
    stroke:#51a8ff;
    stroke-width:2;
}

.armyIcon{
    font-size:16px;
    text-anchor:middle;
}

.armyText{
    fill:white;
    font-size:10px;
    font-weight:bold;
    text-anchor:middle;
}

.enemyText{
    fill:#ff9b9b;
    font-size:10px;
    font-weight:bold;
    text-anchor:middle;
}

.progressText{
    fill:white;
    font-size:9px;
    font-weight:bold;
    text-anchor:middle;
}

/* ================= RIGHT PANEL ================= */

.countryFlag{

.countryName{

    color:white;
    font-weight:bold;

}

.warButton{

/* ================= MODAL ================= */

#modal{

    position:fixed;
    inset:0;
    z-index:500;

    justify-content:center;
    align-items:center;

    background:#000b;

.modalBox{

    padding:25px;

    border:1px solid #314858;

.close{

    color:#bbb;

.countryGrid{

    gap:8px;

.countryChoice{

.countryChoice:hover{

.choiceFlag{

/* ================= WAR BOX ================= */

.box{

.boxTitle{

}

.bigNumber{

.bar{

    border-radius:10px;
    overflow:hidden;

.barFill{

.red{

/* ================= TOAST ================= */

#toast{
    display:none;

    position:fixed;
    z-index:900;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    padding:12px 18px;

    background:#10232f;
    border:1px solid #355467;
    border-radius:9px;

    box-shadow:0 10px 30px #000;

/* ================= MOBILE ================= */

@media(max-width:800px){

    .stat{

    }

    .title{

    }

    #rightPanel{
        width:225px;
    }

    .countryGrid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

let month = 1;

/* =========================================================

========================================================= */

function formatNumber(value){

    value = Math.floor(Number(value) || 0);

    if(value >= 1000000000)
        return (value / 1000000000).toFixed(1)+"B";

    if(value >= 1000000)
        return (value / 1000000).toFixed(1)+"M";

    if(value >= 1000)
        return (value / 1000).toFixed(1)+"K";

    return value.toLocaleString("de-DE");
}


function toast(text){

    const el = document.getElementById("toast");

    el.textContent = text;
    el.style.display = "block";

    clearTimeout(toast.timeout);

    toast.timeout = setTimeout(()=>{
        el.style.display = "none";
    },2500);
}

            Starte deine Kampagne im Januar 1936.

                     onclick="chooseCountry('${iso}')">

                        ${c.flag}

                    </div>

                </div>

            `).join("")}

    `;
}


/* =========================================================
CHOOSE COUNTRY
========================================================= */

function chooseCountry(iso){

    const c = countries[iso];

    player = {
        nation:iso,
        money:c.money,
        population:c.pop,
        manpower:c.manpower,
        army:c.army,
        factories:c.factories,
        income:c.income,
        technology:1,
        research:0,
        stability:80
    };

    year=1936;
    month=1;
    speed=0;

    conquered={};
    conquered[iso]=true;

    wars=[];
    selectedCountry=iso;

    if(timer)
        clearInterval(timer);

    timer=null;

    closeModal();

    document.getElementById("startScreen").style.display="none";
    document.getElementById("game").style.display="block";

    updateUI();
    updateMap();
    redrawWars();

    toast(`${c.flag} ${c.name} ausgewählt`);
}


/* =========================================================
TIME
========================================================= */

function setSpeed(value,button){

    speed=value;

    document
        .querySelectorAll(".speed button")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    if(timer)
        clearInterval(timer);

    timer=null;

    if(speed===0)
        return;

    timer=setInterval(
        nextMonth,
        4000/speed
    );
}


function nextMonth(){

    if(!player)
        return;

    month++;

    if(month>12){
        month=1;
        year++;
    }

    player.money +=
        player.income +
        player.factories*5;

    player.manpower +=
        Math.floor(
            player.population*.00008
        );

    player.research +=
        Math.max(
            1,
            Math.floor(player.factories*.12)
        );

    player.research =
        Math.min(100,player.research);

    wars.forEach(war=>{
        if(war.active)
            battle(war);
    });

    updateUI();
}


/* =========================================================
BATTLE
========================================================= */

function battle(war){

    if(!war.active)
        return;

    if(player.army<=0){

        war.active=false;

        removeWar(war);

        toast("💀 Deine Armee wurde zerstört.");

        return;
    }

    if(war.enemyArmy<=0){

        conquer(war);

        return;
    }

    const playerPower =
        player.army *
        (1 + player.technology*.10);

    const enemyPower =
        war.enemyArmy *
        (1 + war.enemyTechnology*.05);

    const ratio =
        playerPower /
        (playerPower+enemyPower);

    const casualties =
        500 +
        Math.random()*700;

    const playerLoss =
        Math.max(
            5,
            Math.floor(
                casualties*(1-ratio)*.65
            )
        );

    const enemyLoss =
        Math.max(
            5,
            Math.floor(
                casualties*ratio*.65
            )
        );

    player.army =
        Math.max(
            0,
            player.army-playerLoss
        );

    war.enemyArmy =
        Math.max(
            0,
            war.enemyArmy-enemyLoss
        );

    war.myLosses += playerLoss;
    war.enemyLosses += enemyLoss;

    let movement=0;

    if(ratio>.5){

        movement =
            .10 +
            (ratio-.5)*1.5;

    }else{

        movement =
            -(
                .04 +
                (.5-ratio)*.8
            );
    }

    movement =
        Math.max(
            -.45,
            Math.min(.65,movement)
        );

    war.progress += movement;

    war.progress =
        Math.max(
            0,
            Math.min(100,war.progress)
        );

    drawOccupation(war);
    drawFront(war);

    if(war.enemyArmy<=0)
        conquer(war);
}


/* =========================================================
DECLARE WAR
========================================================= */

function declareWar(iso){

    if(!player)
        return;

    if(iso===player.nation){

        toast("Du kannst dich nicht selbst angreifen.");

        return;
    }

    if(conquered[iso]){

        toast("Dieses Land gehört bereits dir.");

        return;
    }

    const existing =
        wars.find(
            w =>
            w.active &&
            w.enemy===iso
        );

    if(existing){

        showWar(existing);

        return;
    }

    const enemy = countries[iso];

    const war = {

        id:Date.now(),

        enemy:iso,

        active:true,

        progress:0,

        enemyArmy:enemy.army,

        enemyTechnology:1,

        myLosses:0,

        enemyLosses:0

    };

    wars.push(war);

    drawOccupation(war);
    drawFront(war);

    toast(`⚔️ Krieg gegen ${enemy.flag} ${enemy.name}`);

    selectCountry(iso);
}


/* =========================================================
CONQUER
========================================================= */

function conquer(war){

    war.active=false;
    war.progress=100;

    conquered[war.enemy]=true;

    const enemy=countries[war.enemy];

    player.factories +=
        Math.max(
            1,
            Math.floor(enemy.factories*.2)
        );

    player.income +=
        Math.max(
            10,
            Math.floor(enemy.income*.4)
        );

    drawOccupation(war);
    removeWar(war);

    updateMap();
    updateUI();

    toast(
        `🏳️ ${enemy.flag} ${enemy.name} wurde erobert!`
    );
}


/* =========================================================
MAP
========================================================= */

function getISO(feature){

    if(!feature.properties)
        return "";

    return (
        feature.properties.ADM0_A3 ||
        feature.properties.ISO_A3 ||
        feature.properties.ISO_A3_EH ||
        ""
    );
}


function position(iso){

    const c=countries[iso];

    if(!c)
        return [600,325];

    return projection(c.pos);
}


/* =========================================================
LOAD MAP
========================================================= */

async function initMap(){

    projection =
        d3.geoNaturalEarth1();

    path =
        d3.geoPath()
            .projection(projection);

    try{

        const response =
            await fetch(
                "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
            );

        if(!response.ok)
            throw new Error("Map konnte nicht geladen werden.");

        const world =
            await response.json();

        projection.fitExtent(
            [
                [5,5],
                [1195,645]
            ],
            world
        );

        countryLayer
            .selectAll("path")
            .data(world.features)
            .enter()
            .append("path")
            .attr("class","country neutral")
            .attr("d",path)
            .attr("data-iso",getISO)
            .on("click",(event,d)=>{

                const iso=getISO(d);

                if(countries[iso])
                    selectCountry(iso);

            });

        mapReady=true;

        updateMap();

    }
    catch(error){

        console.error(error);

        toast("⚠️ Weltkarte konnte nicht geladen werden.");
    }
}


/* =========================================================
UPDATE MAP
========================================================= */

function updateMap(){

    if(!mapReady)
        return;

    countryLayer
        .selectAll("path")
        .each(function(){

            const iso =
                this.getAttribute("data-iso");

            let cls="country neutral";

            if(iso===player?.nation)
                cls="country player";

            if(conquered[iso])
                cls="country conquered";

            const war =
                wars.find(
                    w =>
                    w.active &&
                    w.enemy===iso
                );

            if(war)
                cls="country enemy";

            if(selectedCountry===iso)
                cls+=" selected";

            d3.select(this)
                .attr("class",cls);
        });
}


/* =========================================================
SELECT COUNTRY
========================================================= */

function selectCountry(iso){

    if(!countries[iso])
        return;

    selectedCountry=iso;

    updateMap();

    const c=countries[iso];

    const war =
        wars.find(
            w =>
            w.active &&
            w.enemy===iso
        );

    let army=c.army;

    if(iso===player?.nation)
        army=player.army;

    if(war)
        army=war.enemyArmy;

    const panel =
        document.getElementById("rightPanel");

    panel.style.display="block";

    panel.innerHTML=`

        <div class="countryHeader">

            <div class="countryFlag">
                ${c.flag}
            </div>

            <div>

                <div class="countryName">
                    ${c.name}
                </div>

                <div class="countryCode">
                    ${iso}
                </div>

            </div>

        </div>

        <div class="infoRow">
            <span>🪖 Army</span>
            <b>${formatNumber(army)}</b>
        </div>

        <div class="infoRow">
            <span>👥 Population</span>
            <b>${formatNumber(c.pop)}</b>
        </div>

        <div class="infoRow">
            <span>🏭 Factories</span>
            <b>${c.factories}</b>
        </div>

        <div class="infoRow">
            <span>💰 Income</span>
            <b>${c.income}</b>
        </div>

        ${
            iso===player?.nation
            ?
            `<div class="box">
                🇺🇳 DEINE NATION
            </div>`
            :
            war
            ?
            `<button class="action warButton"
                onclick="showWar(${war.id})">
                ⚔️ KRIEG ANZEIGEN
            </button>`
            :
            conquered[iso]
            ?
            `<div class="box">
                🏳️ ERobert
            </div>`
            :
            `<button class="action warButton"
                onclick="declareWar('${iso}')">
                ⚔️ KRIEG ERKLÄREN
            </button>`
        }
    `;
}


/* =========================================================
OCCUPATION
========================================================= */

function drawOccupation(war){

    if(!mapReady)
        return;

    occupationLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();

    const country =
        countryLayer.select(
            `path[data-iso="${war.enemy}"]`
        );

    if(country.empty())
        return;

    const bbox =
        country.node().getBBox();

    const start =
        position(player.nation);

    const end =
        position(war.enemy);

    const fromLeft =
        start[0] < end[0];

    const percent =
        Math.max(
            0,
            Math.min(100,war.progress)
        )/100;

    let x;
    let width;

    if(fromLeft){

        x=bbox.x;
        width=bbox.width*percent;

    }else{

        width=bbox.width*percent;

        x=
            bbox.x+
            bbox.width-
            width;
    }

    const clipId =
        "clip_"+war.id;

    defs
        .select("#"+clipId)
        .remove();

    const clip =
        defs.append("clipPath")
            .attr("id",clipId);

    clip.append("path")
        .attr("d",country.attr("d"));

    occupationLayer
        .append("rect")
        .attr("data-war",war.id)
        .attr("class","occupation")
        .attr("x",x)
        .attr("y",bbox.y)
        .attr("width",Math.max(0,width))
        .attr("height",bbox.height)
        .attr(
            "clip-path",
            `url(#${clipId})`
        );
}


/* =========================================================
FRONT
========================================================= */

function drawFront(war){

    if(!mapReady || !war.active)
        return;

    removeWarGraphics(war);

    const start=position(player.nation);
    const end=position(war.enemy);

    const percent =
        Math.max(
            0,
            Math.min(100,war.progress)
        )/100;

    const t=.15+percent*.70;

    const fx =
        start[0]+
        (end[0]-start[0])*t;

    const fy =
        start[1]+
        (end[1]-start[1])*t;

    const dx=end[0]-start[0];
    const dy=end[1]-start[1];

    const len =
        Math.sqrt(dx*dx+dy*dy)||1;

    const px=-dy/len;
    const py=dx/len;

    const size=55;

    const x1=fx+px*size;
    const y1=fy+py*size;

    const x2=fx-px*size;
    const y2=fy-py*size;

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","frontGlow")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);

    frontLayer
        .append("line")
        .attr("data-war",war.id)
        .attr("class","front")
        .attr("x1",x1)
        .attr("y1",y1)
        .attr("x2",x2)
        .attr("y2",y2);

    for(let i=0;i<5;i++){

        const q=i/4;

        frontLayer
            .append("circle")
            .attr("data-war",war.id)
            .attr("class","frontDot")
            .attr(
                "cx",
                x1+(x2-x1)*q
            )
            .attr(
                "cy",
                y1+(y2-y1)*q
            )
            .attr("r",3);
    }

    const group =
        armyLayer
            .append("g")
            .attr("data-war",war.id)
            .attr("class","army")
            .attr(
                "transform",
                `translate(${fx},${fy})`
            )
            .on("click",()=>{
                showWar(war.id);
            });

    group
        .append("circle")
        .attr("class","armyCircle")
        .attr("r",23);

    group
        .append("text")
        .attr("class","armyIcon")
        .attr("y",-4)
        .text("🪖");

    group
        .append("text")
        .attr("class","armyText")
        .attr("y",11)
        .text(formatNumber(player.army));

    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","enemyText")
        .attr("x",fx)
        .attr("y",fy-35)
        .text("⚔️ "+formatNumber(war.enemyArmy));

    armyLayer
        .append("text")
        .attr("data-war",war.id)
        .attr("class","progressText")
        .attr("x",fx)
        .attr("y",fy+40)
        .text(Math.floor(war.progress)+"%");
}


/* =========================================================
REMOVE FRONT
========================================================= */

function removeWarGraphics(war){

    frontLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();

    armyLayer
        .selectAll(
            `[data-war="${war.id}"]`
        )
        .remove();
}
